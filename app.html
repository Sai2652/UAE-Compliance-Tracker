<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE Compliance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Apply saved theme before any paint to avoid a dark-to-light flash on load.
(function(){ try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('theme-light'); } catch(e){} })();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-deep:#080b12;--bg-base:#0c1018;--bg-card:#111722;--bg-card-hover:#151c2a;
--bg-elevated:#1a2234;--bg-input:#0e1420;
--border:#1c2538;--border-light:#243048;--border-focus:#3d7aed;
--text-primary:#e8ecf4;--text-secondary:#8a95aa;--text-muted:#5a6578;
--accent:#3d7aed;--accent-soft:#3d7aed22;
--green:#22c55e;--green-bg:#22c55e18;--green-border:#22c55e33;
--amber:#f59e0b;--amber-bg:#f59e0b18;--amber-border:#f59e0b33;
--red:#ef4444;--red-bg:#ef444418;--red-border:#ef444433;
--blue:#3d7aed;--blue-bg:#3d7aed18;
--slate:#64748b;--slate-bg:#64748b18;
--radius:8px;--radius-lg:12px;--radius-xl:16px;
--font:'Plus Jakarta Sans',system-ui,sans-serif;
--mono:'IBM Plex Mono',monospace;
--transition:0.2s cubic-bezier(0.4,0,0.2,1);
}
/* Light theme — variable overrides only, no structural changes. */
html.theme-light{
--bg-deep:#f4f6fb;--bg-base:#eef1f7;--bg-card:#ffffff;--bg-card-hover:#f4f6fb;
--bg-elevated:#e8ecf4;--bg-input:#ffffff;
--border:#dde3ee;--border-light:#c8d0dd;--border-focus:#2d6adc;
--text-primary:#0c1018;--text-secondary:#3d4658;--text-muted:#6b7488;
--accent:#2d6adc;--accent-soft:#3d7aed14;
--green:#16a34a;--green-bg:#16a34a14;--green-border:#16a34a44;
--amber:#c2410c;--amber-bg:#f59e0b18;--amber-border:#f59e0b55;
--red:#dc2626;--red-bg:#ef444414;--red-border:#ef444455;
--blue:#2d6adc;--blue-bg:#3d7aed12;
--slate:#475569;--slate-bg:#64748b18;
}
html.theme-light ::-webkit-scrollbar-thumb{background:#c8d0dd}
html.theme-light .modal{box-shadow:0 20px 60px rgba(15,23,42,0.18)}
html.theme-light .modal-overlay{background:rgba(15,23,42,0.35)}
html.theme-light .logo-mark{color:#ffffff}
html.theme-light .btn-primary{color:#ffffff}
/* Smoother tab-switch: color/background transitions on every interactive surface */
html{color-scheme:dark}
html.theme-light{color-scheme:light}
body,.header,.nav,.nav-btn,.btn,.card,.stat-card,.form-input,.main,.sidebar,.modal,.deadline-item,.tm-item,.detail-nav-btn,.month-cell,.doc-toggle-btn,.cred-card{transition:background-color 0.18s ease,color 0.18s ease,border-color 0.18s ease}
.nav-btn.active{transition:background-color 0.15s ease,color 0.15s ease}
/* Skeleton loader — used while a tab's async data is loading. */
.skeleton{background:linear-gradient(90deg,var(--bg-card) 0%,var(--bg-card-hover) 50%,var(--bg-card) 100%);background-size:200% 100%;animation:skeleton-shimmer 1.4s ease-in-out infinite;border-radius:var(--radius);border:1px solid var(--border)}
@keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-row{height:64px;margin-bottom:8px}
.skeleton-card{height:120px;margin-bottom:12px}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.5}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243048;border-radius:3px}
.app{display:flex;flex-direction:column;height:100vh}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:8px 24px;min-height:56px;display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:100;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:4px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3d7aed,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#080b12}
.logo-text{font-weight:800;font-size:15px;color:var(--text-primary)}
.logo-sub{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:0.5px;text-transform:uppercase}
.nav{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg-deep);border-radius:8px;padding:3px;margin-left:8px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.nav::-webkit-scrollbar{height:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav-btn{padding:6px 12px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);white-space:nowrap;flex-shrink:0}
.nav-btn:hover{color:var(--text-secondary)}
.nav-btn.active{background:var(--bg-elevated);color:var(--text-primary)}
/* Left main-nav sidebar — replaces the old top-of-header tabs. Big click targets. */
.side-nav{width:236px;background:var(--bg-base);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding-bottom:8px}
.side-nav-section{padding:14px 16px 6px;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px}
.side-nav-btn{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:1px 8px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:calc(100% - 16px);transition:background-color 0.15s ease,color 0.15s ease,border-color 0.15s ease;font-family:inherit}
.side-nav-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.side-nav-btn.active{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-light)}
.side-nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.side-nav-label{flex:1;line-height:1.2}
.side-nav-footer{margin-top:auto;padding:10px 8px 4px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.side-nav-footer .side-nav-btn{margin:0 8px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--bg-base);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.main{flex:1;overflow-y:auto;padding:24px;background:var(--bg-deep)}
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--border-light);color:var(--text-primary);background:var(--bg-card-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#2d6adc}
.btn-danger{color:var(--red);border-color:var(--red-border)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 10px;font-size:11px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.stat-grid{display:grid;gap:12px;margin-bottom:20px}
.stat-grid.cols-6{grid-template-columns:repeat(6,1fr)}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
.stat-value{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;line-height:1}
.stat-label{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge-not-started{background:var(--slate-bg);color:var(--slate)}.badge-in-progress{background:var(--blue-bg);color:var(--blue)}.badge-completed{background:var(--green-bg);color:var(--green)}.badge-blocked{background:var(--red-bg);color:var(--red)}.badge-not-applicable{background:var(--bg-elevated);color:var(--text-muted)}
.badge .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-not-started .dot{background:var(--slate)}.badge-in-progress .dot{background:var(--blue)}.badge-completed .dot{background:var(--green)}.badge-blocked .dot{background:var(--red)}.badge-not-applicable .dot{background:var(--text-muted)}
.progress-bar{display:flex;align-items:center;gap:8px}
.progress-track{flex:1;height:6px;background:var(--bg-deep);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.progress-label{font-size:11px;font-weight:700;font-family:var(--mono);min-width:36px;text-align:right}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
.form-input{width:100%;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;outline:none;transition:var(--transition)}
.form-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-soft)}
.form-input::placeholder{color:var(--text-muted)}
select.form-input{cursor:pointer;appearance:auto}
textarea.form-input{resize:vertical;min-height:60px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;transition:var(--transition)}
.toggle input:checked+.toggle-track{background:var(--green);border-color:var(--green)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:var(--transition)}
.toggle input:checked~.toggle-thumb{left:19px}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;background:var(--bg-base);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:var(--bg-card-hover)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-title{font-size:17px;font-weight:800;margin-bottom:20px;color:var(--text-primary)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.alert{padding:12px 16px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-warning{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)}
.alert-info{background:var(--blue-bg);border:1px solid transparent;color:var(--blue)}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{max-width:280px}
.deadline-item{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer}
.deadline-item:hover{border-color:var(--border-light);background:var(--bg-card-hover)}
.detail-nav{display:flex;flex-direction:column;gap:2px;padding:8px}
.detail-nav-btn{padding:8px 12px;border-radius:var(--radius);border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);text-align:left}
.detail-nav-btn:hover{color:var(--text-secondary);background:var(--bg-card)}
.detail-nav-btn.active{color:var(--text-primary);background:var(--bg-elevated)}
.doc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.doc-row:last-child{border-bottom:none}
.doc-toggle-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition)}
.doc-toggle-btn.received{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.doc-toggle-btn.pending{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.doc-toggle-btn.na{background:var(--bg-elevated);color:var(--text-muted);border-color:var(--border)}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month-cell{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center}
.month-cell:hover{border-color:var(--border-light)}
.month-name{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.team-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.tm-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tm-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius)}
.tm-item-name{flex:1;font-size:13px;font-weight:600;color:var(--text-primary)}
.tm-item-count{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.tm-remove{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tm-remove:hover{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:0.3}
.empty-state-title{font-size:16px;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
.empty-state-text{font-size:13px;max-width:400px;margin:0 auto 16px}
.mandatory-tag{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:700;margin-left:6px}
.mandatory-tag.req{background:var(--red-bg);color:var(--red)}
.mandatory-tag.opt{background:var(--bg-elevated);color:var(--text-muted)}
.cred-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.cred-card .cred-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cred-card .cred-title{font-weight:600;font-size:13px;color:var(--text-primary)}
.cred-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cred-meta{font-size:10px;color:var(--text-muted);margin-top:6px;font-style:italic}
.pwd-field{position:relative}
.pwd-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:2px}
@media(max-width:900px){.stat-grid.cols-6{grid-template-columns:repeat(3,1fr)}.sidebar{width:220px}.month-grid{grid-template-columns:repeat(3,1fr)}.header{padding:0 12px;gap:8px;overflow-x:auto}}
@media(max-width:640px){.stat-grid.cols-6{grid-template-columns:repeat(2,1fr)}.main{padding:16px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const STATUSES=["Not Started","In Progress","Completed","Blocked","Not Applicable"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ENTITY_TYPES=["FZCO (Free Zone)","FZE (Free Zone)","FZ-LLC (Free Zone)","Mainland LLC"];
const VAT_OPTIONS=["Yes","No","Pending - Documents Awaited","Pending - Registration in Progress"];
const FY_OPTIONS=["2023","2024","2025","2026","2027"];
const ACCT_STATUSES=["Not Started","In Progress","Completed","Blocked"];

// 1) NEW Document list with mandatory flags
const DOCS_LIST=[
  {name:"COI",mandatory:true},
  {name:"Trade License",mandatory:true},
  {name:"BCL Mandate",mandatory:true},
  {name:"MOA",mandatory:true},
  {name:"AOA",mandatory:false},
  {name:"Ejari",mandatory:true},
  {name:"Establishment Card",mandatory:false},
  {name:"Shareholders Passport",mandatory:true},
  {name:"Shareholder Emirates ID",mandatory:true},
  {name:"FTA Login",mandatory:true},
  {name:"CT Registration",mandatory:true},
  {name:"VAT Registration",mandatory:true}, // special: has N/A option
  {name:"Signed KYC",mandatory:true},
];

// 3) Default login portals — only FTA & Zoho, rest are custom
const DEFAULT_PORTALS=["FTA Portal","Zoho Books"];

const STORAGE_KEY="uae_compliance_v4";

// ═══════════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════════
// Cloud storage — all data goes to the server API
let currentUser = null;

async function loadData(){
  try {
    const res = await fetch('/api/tracker');
    if(res.ok){ const data = await res.json(); return { clients: data.clients, teamMembers: data.teamMembers }; }
    if(res.status === 401) window.location.href = '/login';
  } catch(e) { console.warn('Load error:', e); }
  return null;
}

async function saveData(d){
  try {
    await fetch('/api/tracker', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(d)
    });
  } catch(e) { console.warn('Save error:', e); }
}

function persistState(){ saveData({ clients: state.clients, teamMembers: state.teamMembers }); }

// Role helpers
function isAdmin(){ return currentUser && currentUser.role === 'admin'; }
function getVisibleClients(){ 
  if(isAdmin()) return state.clients;
  if(!currentUser) return [];
  return state.clients.filter(c => c.assignedTeam === currentUser.name);
}

async function loadCurrentUser(){
  try {
    const res = await fetch('/api/auth/me');
    if(res.ok){ const data = await res.json(); currentUser = data.user; return data.user; }
    window.location.href = '/login';
  } catch(e) { window.location.href = '/login'; }
  return null;
}

async function logout(){
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
const uid=()=>Math.random().toString(36).substr(2,9);
const today=new Date();
const fmtDate=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fmtDateTime=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const daysUntil=d=>d?Math.ceil((new Date(d)-today)/864e5):null;
const esc=s=>{if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");};
const nowISO=()=>new Date().toISOString();
function getTeamOptions(){return["Unassigned",...state.teamMembers];}
function badgeHTML(s,sm){const c="badge-"+s.toLowerCase().replace(/\s+/g,"-");return`<span class="badge ${c}"${sm?' style="font-size:10px;padding:2px 8px"':''}><span class="dot"></span>${esc(s)}</span>`;}
function progressHTML(p,h=6){const c=p>=80?'var(--green)':p>=50?'var(--amber)':p>=20?'var(--blue)':'var(--slate)';return`<div class="progress-bar"><div class="progress-track" style="height:${h}px"><div class="progress-fill" style="width:${p}%;background:${c};height:${h}px"></div></div><span class="progress-label" style="color:${c}">${p}%</span></div>`;}
function selectHTML(n,v,opts,a=""){return`<select class="form-input" data-field="${n}" ${a} style="padding:5px 8px;font-size:12px;max-width:200px">${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join("")}</select>`;}
function toggleHTML(n,ch){return`<label class="toggle"><input type="checkbox" data-toggle="${n}"${ch?' checked':''}><span class="toggle-track"></span><span class="toggle-thumb"></span></label>`;}

// Check if accounting is complete for the specific months covered by a VAT period
// Period label format: "Mar-May 2026", "Dec-Feb 2026/27", "Jun-Aug 2026"
function getVatPeriodMonths(periodLabel){
  const mnMap={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const m=periodLabel.match(/(\w{3})-(\w{3})\s+(\d{4})/i);
  if(!m)return[];
  const startM=mnMap[m[1].toLowerCase()];
  const endM=mnMap[m[2].toLowerCase()];
  const yr=parseInt(m[3]);
  if(!startM||!endM)return[];
  const months=[];
  if(startM<=endM){
    for(let i=startM;i<=endM;i++)months.push(`${yr}-${String(i).padStart(2,'0')}`);
  } else {
    // Cross-year: e.g., Dec-Feb → Dec of yr, Jan-Feb of yr+1
    for(let i=startM;i<=12;i++)months.push(`${yr}-${String(i).padStart(2,'0')}`);
    // Check if label has "2026/27" format
    const yrMatch=periodLabel.match(/(\d{4})\/(\d{2})/);
    const nextYr=yrMatch?parseInt(yrMatch[1])+1:yr+1;
    for(let i=1;i<=endM;i++)months.push(`${nextYr}-${String(i).padStart(2,'0')}`);
  }
  return months;
}

function checkPeriodAccounting(client, periodLabel){
  const keys=getVatPeriodMonths(periodLabel);
  if(!keys.length)return{complete:false,pending:[],total:0};
  const pending=[];
  keys.forEach(k=>{
    const status=client.accounting.monthlyStatus[k];
    if(status!=="Completed")pending.push(k);
  });
  return{complete:pending.length===0,pending,total:keys.length,done:keys.length-pending.length};
}

function formatMonthKey(k){
  const p=k.split("-");
  return MONTHS[parseInt(p[1])-1]+" "+p[0];
}
// 4) Generate months for a financial year
function getFYMonths(fy){
  const y=parseInt(fy);
  return MONTHS.map((m,i)=>({month:m,year:y,key:`${y}-${String(i+1).padStart(2,'0')}`,label:`${m} ${y}`}));
}

// METRICS
// ═══════════════════════════════════════════════════════════════
function calcMetrics(c){
  const ms=Object.values(c.accounting.monthlyStatus);
  const acctDone=ms.filter(s=>s==="Completed").length;
  const acctTotal=ms.filter(s=>s!=="Not Applicable").length||12;
  const acctPct=Math.round(acctDone/acctTotal*100);
  const acctPending=Object.entries(c.accounting.monthlyStatus).filter(([,v])=>v!=="Completed"&&v!=="Not Applicable").map(([k])=>{const p=k.split("-");return MONTHS[parseInt(p[1])-1]+" "+p[0];});
  const acctBlocked=ms.some(s=>s==="Blocked");

  const mandDocs=DOCS_LIST.filter(d=>d.mandatory).map(d=>d.name);
  const docsRecv=mandDocs.filter(n=>c.documents[n]==="Received"||c.documents[n]==="N/A").length;
  const docsPct=Math.round(docsRecv/mandDocs.length*100);
  const docsMissing=mandDocs.filter(n=>c.documents[n]!=="Received"&&c.documents[n]!=="N/A");

  const loginsOk=c.logins.filter(l=>l.enabled&&l.username).length;
  const loginsTotal=c.logins.length||1;
  const loginsPct=Math.round(loginsOk/loginsTotal*100);

  const vatIsYes=c.vatApplicable==="Yes";
  const vatIsPending=c.vatApplicable&&c.vatApplicable.startsWith("Pending");
  let vatPct=0;
  if(vatIsYes&&c.vat.returnDates.length>0)vatPct=Math.round(c.vat.returnDates.filter(r=>r.filingStatus==="Completed").length/c.vat.returnDates.length*100);
  const ctPct=c.ct.status==="Completed"?100:c.ct.status==="In Progress"?50:0;
  const totalPct=Math.round((acctPct*35+vatPct*25+ctPct*15+docsPct*15+loginsPct*10)/100);

  const acctStatus=acctBlocked?"Blocked":acctPct===100?"Completed":acctPct>0?"In Progress":"Not Started";
  const vatStatus=c.vatApplicable==="No"?"Not Applicable":vatIsPending?"Blocked":vatPct===100&&c.vat.returnDates.length>0?"Completed":vatPct>0?"In Progress":"Not Started";
  const ctStatus=!c.ctApplicable?"Not Applicable":c.ct.status;
  const docsStatus=docsPct===100?"Completed":docsPct>0?"In Progress":"Not Started";
  const loginsStatus=loginsPct===100&&c.logins.length>0?"Completed":loginsPct>0?"In Progress":"Not Started";

  const all=[acctStatus,vatStatus,ctStatus,docsStatus,loginsStatus];
  let overallStatus;
  if(all.some(s=>s==="Blocked"))overallStatus="Blocked";
  else if(all.filter(s=>s!=="Not Applicable").every(s=>s==="Completed"))overallStatus="Completed";
  else if(all.some(s=>s==="In Progress"||s==="Completed"))overallStatus="In Progress";
  else overallStatus="Not Started";

  const deadlines=[];
  if(vatIsYes)c.vat.returnDates.forEach(r=>{if(r.filingStatus!=="Completed"){const d=daysUntil(r.dueDate);deadlines.push({label:`VAT: ${r.period}`,date:r.dueDate,days:d,type:"vat"});}});
  if(c.ctApplicable&&c.ct.status!=="Completed"){const d=daysUntil(c.ct.dueDate);deadlines.push({label:`CT FY${c.ct.financialYear}`,date:c.ct.dueDate,days:d,type:"ct"});}
  deadlines.sort((a,b)=>(a.days??999)-(b.days??999));

  const warnings=[];
  if(vatStatus==="Completed"&&acctStatus!=="Completed")warnings.push("VAT completed but Accounting incomplete");
  if(ctStatus==="Completed"&&acctStatus!=="Completed")warnings.push("CT completed but Accounting incomplete");
  const brs=c.blockedReasons||{};
  if(acctBlocked){const blockedMonths=Object.entries(c.accounting.monthlyStatus).filter(([,v])=>v==="Blocked").map(([k])=>{const p=k.split("-");const reason=brs[`acct_${k}`];return MONTHS[parseInt(p[1])-1]+(reason?` (${reason})`:'');});warnings.push("Accounting blocked: "+blockedMonths.join(", "));}
  if(docsMissing.length>0)warnings.push(`${docsMissing.length} mandatory doc(s) pending`);
  if(vatIsPending)warnings.push("VAT: "+c.vatApplicable);
  if(c.ct&&c.ct.status==="Blocked"){const r=brs.ct;warnings.push("CT blocked"+(r?": "+r:""));}

  return{acctPct,acctPending,acctStatus,acctBlocked,vatPct,vatStatus,ctPct,ctStatus,docsPct,docsMissing,docsStatus,loginsPct,loginsStatus,totalPct,overallStatus,deadlines,warnings};
}

// RENDER
// ═══════════════════════════════════════════════════════════════
// ---- Render coalescing ----
// Many async loaders call render() when they resolve. If two fire in the same
// tick they used to rebuild the DOM twice in quick succession, which made
// clicks miss their targets. We batch all render() calls within one animation
// frame into a single rebuild.
let _renderQueued=false, _renderInProgress=false;
function render(){
  if(_renderInProgress) return;
  if(_renderQueued) return;
  _renderQueued=true;
  requestAnimationFrame(()=>{
    _renderQueued=false;
    _renderInProgress=true;
    try{ _renderImpl(); } finally { _renderInProgress=false; }
  });
}
function _renderImpl(){
  try{
    refreshMetrics();
    const app=document.getElementById("app");if(!app)return;

    // Save scroll position of main content area before re-render
    const mainEl=app.querySelector(".main");
    const scrollTop=mainEl?mainEl.scrollTop:0;

    const sc=state.selectedClientId?getClient(state.selectedClientId):null;
    const scm=sc?metricsCache[sc.id]:null;
    if(state.selectedClientId&&!sc)state.selectedClientId=null;
    let h=renderHeader();h+=`<div class="body-wrap">`;
    if(sc&&scm){h+=renderSidebar(sc,scm);h+=`<div class="main">${renderDetail(sc,scm)}</div>`;}
    else {h+=renderMainNavSidebar();h+=`<div class="main">${renderMain()}</div>`;}
    h+=`</div>`;
    if(state.showModal==="addClient")h+=renderAddModal();
    if(state.showModal==="manageTeam")h+=renderTeamModal();
    if(state.showModal==="addVatReturn")h+=renderAddVatReturnModal();
    if(state.showModal==="addCredential")h+=renderAddCredentialModal();

    app.innerHTML=h;bindEvents();

    // Restore scroll position after re-render
    const newMainEl=app.querySelector(".main");
    if(newMainEl&&scrollTop>0)newMainEl.scrollTop=scrollTop;

  }catch(err){
    console.error(err);
    document.getElementById("app").innerHTML=`<div style="padding:40px;color:var(--red);font-family:var(--mono)"><pre>${err.message}\n${err.stack}</pre></div>`;
  }
}

  const tile=(label,n,color)=>`<div class="card" style="text-align:center;border-color:${color||'var(--border)'}"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${label}</div><div style="font-size:22px;font-weight:800;color:${color||'var(--text-primary)'}">${n||0}</div></div>`;
  let h=`<div class="card-title" style="margin-top:14px;margin-bottom:10px">⏰ Critical Deadlines</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px">`;
  h+=tile('Overdue',     d.overdueCount, 'var(--red)');
  h+=tile('Due Today',   d.todayCount,   d.todayCount>0?'var(--amber)':'var(--border)');
  h+=tile('Next 7 Days', d.next7Count);
  h+=tile('Next 14 Days',d.next14Count);
  h+=`</div>`;
  // By category breakdown (upcoming only)
  const cats=d.byCategory||{};
  h+=`<div class="card" style="padding:0;overflow:auto;margin-bottom:14px"><table style="width:100%;font-size:12px"><thead><tr style="text-align:left;color:var(--text-muted)"><th style="padding:6px">Category</th><th style="padding:6px">Count</th><th style="padding:6px">Earliest</th><th style="padding:6px">Latest</th></tr></thead><tbody>`;
  ['VAT','CT','Registration','Review','Client Approval','Other'].forEach(k=>{
    const list=cats[k]||[];
    if(!list.length) return;
    const dates=list.map(x=>x.dueDate).filter(Boolean).sort();
    h+=`<tr><td style="padding:6px;font-weight:600">${esc(k)}</td><td style="padding:6px">${list.length}</td><td style="padding:6px">${dates[0]||'—'}</td><td style="padding:6px">${dates[dates.length-1]||'—'}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  // Overdue detail (if any) — first 8 rows
  if(d.overdue && d.overdue.length){
    h+=`<div class="card" style="border-color:var(--red-border);margin-bottom:14px"><div class="card-title" style="color:var(--red)">Overdue (${d.overdueCount})</div><div style="overflow:auto"><table style="width:100%;font-size:12px"><tbody>`;
    d.overdue.slice(0,8).forEach(t=>{
      h+=`<tr data-task="${t.taskId}" style="cursor:pointer"><td style="padding:4px;font-weight:600">${esc(t.clientName)}</td><td style="padding:4px">${esc((t.taskType||'').replace(/_/g,' '))}</td><td style="padding:4px;color:var(--red)">${t.dueDate} (${-t.daysToDue}d overdue)</td><td style="padding:4px;color:var(--text-muted)">${esc(t.assignedUser||'—')}</td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
  }
  return h;
}

function renderMB_ClientsAttention(rows){

  h+=`<div style="overflow:auto"><table style="width:100%;font-size:12px"><thead><tr style="text-align:left;color:var(--text-muted)"><th style="padding:6px">Client</th><th style="padding:6px">Tier</th><th style="padding:6px">Risk</th><th style="padding:6px">Readiness</th><th style="padding:6px">Next Deadline</th><th style="padding:6px">Recommended</th></tr></thead><tbody>`;

// ----- Section 4 -----
function renderMB_TeamHealth(t){
  if(!t) return '';
  const tot=t.totals||{};
  const tile=(label,val,color)=>`<div class="card" style="text-align:center"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${label}</div><div style="font-size:22px;font-weight:800;color:${color||'var(--text-primary)'}">${val||0}</div></div>`;
  let h=`<div class="card-title" style="margin-bottom:10px">👥 Team Health</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px">`;
  h+=tile('Total Open',      tot.totalOpenTasks);
  h+=tile('Overdue',         tot.overdueTasks, tot.overdueTasks>0?'var(--red)':'var(--text-primary)');
  h+=tile('Pending Reviews', tot.pendingReviews, tot.pendingReviews>5?'var(--amber)':'var(--text-primary)');
  h+=tile('Blocked',         tot.blockedWork, tot.blockedWork>0?'var(--red)':'var(--text-primary)');
  h+=tile('Open Escalations',tot.openEscalations, tot.openEscalations>0?'var(--red)':'var(--text-primary)');
  h+=`</div>`;
  if(t.byUser && t.byUser.length){
    h+=`<div class="card" style="padding:0;overflow:auto;margin-bottom:14px"><table style="width:100%;font-size:12px"><thead><tr style="text-align:left;color:var(--text-muted)"><th style="padding:6px">User</th><th style="padding:6px">Workload</th><th style="padding:6px">Open</th><th style="padding:6px">Overdue</th><th style="padding:6px">Reviews</th><th style="padding:6px">Blocked</th></tr></thead><tbody>`;
    t.byUser.forEach(u=>{
      const c=u.band==='overloaded'?'var(--red)':u.band==='underutilized'?'var(--blue)':'var(--green)';
      const pct=Math.min(150,(u.workloadRatio||0)*100);
      h+=`<tr><td style="padding:6px;font-weight:600">${esc(u.userName)}</td><td style="padding:6px;width:30%"><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;background:var(--bg-deep);height:6px;border-radius:3px;overflow:hidden"><div style="width:${Math.min(100,pct)}%;background:${c};height:100%"></div></div><span style="color:${c};font-weight:700;font-size:11px">${u.workloadRatio||0}</span></div></td><td style="padding:6px">${u.openTasks||0}/${u.capacity||'—'}</td><td style="padding:6px;color:${u.overdueTasks>0?'var(--red)':'var(--text-muted)'}">${u.overdueTasks||0}</td><td style="padding:6px">${u.awaitingReview||0}</td><td style="padding:6px">${u.blockedTasks||0}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  if(t.overloaded && t.overloaded.length){
    h+=`<div class="card" style="border-color:var(--red-border);margin-bottom:14px"><div class="card-title" style="color:var(--red)">⚠ Overloaded (${t.overloaded.length})</div><div style="font-size:12px">${t.overloaded.map(u=>esc(u.userName)+' (ratio '+u.workloadRatio+')').join(' · ')}</div></div>`;
  }
  return h;
}

function renderMB_RiskSummary(r){

  const tile=(label,n,color,target)=>`<button class="card" data-mb-go="${target}" style="cursor:pointer;text-align:center;border-color:${n>0?(color||'var(--border)'):'var(--border)'}"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${label}</div><div style="font-size:26px;font-weight:800;color:${n>0?(color||'var(--text-primary)'):'var(--text-muted)'};margin-top:2px">${n||0}</div><div style="font-size:10px;color:var(--accent);margin-top:4px">View →</div></button>`;
  let h=`<div class="card-title" style="margin-bottom:10px">📊 Risk Summary</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px">`;
  h+=tile('High-Risk Clients',     r.highRiskClients,        'var(--amber)', 'portfolio_action');
  h+=tile('Critical-Risk Clients', r.criticalRiskClients,    'var(--red)',   'risk_critical');
  h+=tile('Open Escalations',      r.openEscalations,        'var(--red)',   'risk_action');
  h+=tile('Overdue Compliance',    r.overdueComplianceItems, 'var(--red)',   'overdue');
  h+=`</div>`;
  return h;
}

function renderAIAssistant(){

function renderAIInsight(){
  const clientOpts=state.clients.map(c=>`<option value="${c.id}" ${String(c.id)===String(aiState.insightClientId)?'selected':''}>${esc(c.name)}</option>`).join('');
  let h=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><label style="font-size:11px;color:var(--text-muted)">Client</label><select class="form-input" id="ai-insight-pick" style="min-width:260px"><option value="">— select —</option>${clientOpts}</select></div>`;
  if(!aiState.insightClientId){ h+=`<div class="empty-state"><div class="empty-state-icon">🔎</div><div class="empty-state-title">Pick a client to see the insight panel.</div></div>`; }
  else if(!aiState.insight){ setTimeout(loadAIInsight,0); h+=`<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Composing insight…</div></div>`; }
  else{
    const i=aiState.insight;
    h+=`<div class="card" style="margin-bottom:12px"><div class="card-title">${esc(i.client.name)} — Current Status</div>`;
    (i.status||[]).forEach(s=>{ if(s) h+=`<div style="font-size:13px;margin:4px 0">${esc(s)}</div>`; });
    h+=`</div>`;
    const block=(title,items,renderer,empty,color)=>{
      let inner=`<div class="card-title" style="color:${color||'var(--text-primary)'}">${title} (${items.length})</div>`;
      if(!items.length){ return `<div class="card">${inner}<div style="padding:6px 0;font-size:12px;color:var(--text-muted)">${empty}</div></div>`; }
      inner+=`<div style="display:grid;gap:6px">${items.map(renderer).join('')}</div>`;
      return `<div class="card">${inner}</div>`;
    };
    h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px">`;
    h+=block('Open Risks', i.openRisks||[], r=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="font-weight:700;color:${r.level==='critical'||r.level==='high'?'var(--red)':'var(--amber)'};text-transform:uppercase;font-size:10px">${esc(r.level)}</span> ${esc(r.sentence)}</div>`, 'No active risks.', 'var(--red)');
    h+=block('Missing Items', i.missingItems||[], m=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">${esc(m.sentence)}</div>`, 'No pending documents.', 'var(--amber)');
    h+=block('Upcoming Deadlines (30d)', i.upcomingDeadlines||[], u=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">${esc(u.sentence)}</div>`, 'No upcoming deadlines.', 'var(--blue)');
    h+=block('Recommended Next Actions', i.recommendedActions||[], a=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--accent)">→ ${esc(a.sentence)}</div>`, 'No specific actions needed right now.', 'var(--accent)');
    h+=`</div>`;
  }
  setTimeout(()=>{ const sel=document.getElementById('ai-insight-pick'); if(sel) sel.onchange=()=>{ aiState.insightClientId=sel.value||null; aiState.insight=null; render(); }; },0);
  return h;
}

const portfolioState={ subTab:'dashboard', dashboard:null, insights:null, alerts:null, actionList:null, sortBy:'overallRisk', sortDir:'desc' };

const TIER_META={ A:{ color:'var(--red)', label:'A · High Priority'}, B:{ color:'var(--accent)', label:'B · Standard'}, C:{ color:'var(--text-muted)', label:'C · Low Priority'} };
function tierBadge(tier){
  const m=TIER_META[tier]||TIER_META.B;
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${m.color};font-weight:700;font-size:11px">Tier ${esc(tier||'B')}</span>`;
}
function riskBandPill(band){
  const c={low:'var(--green)',medium:'var(--amber)',high:'var(--red)',critical:'var(--red)'}[band]||'var(--text-muted)';
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${c};font-weight:700;font-size:11px;text-transform:uppercase">${esc(band||'low')}</span>`;
}
function scorePill(score, lowIsBad){
  if(score==null) return `<span style="font-size:11px;color:var(--text-muted)">—</span>`;
  const good=lowIsBad? score>=70 : score<=30;
  const bad =lowIsBad? score<=30 : score>=70;
  const c=good?'var(--green)':bad?'var(--red)':'var(--amber)';
  return `<span style="font-weight:700;color:${c}">${score}</span>`;
}

function renderPortfolio(){
  const tabs=[['dashboard','Dashboard'],['action','Manager Action List'],['insights','Insights'],['alerts','Key Alerts']];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div class="nav" style="margin:0">`;
  tabs.forEach(([k,l])=>{ h+=`<button class="nav-btn ${portfolioState.subTab===k?'active':''}" data-pt="${k}">${l}</button>`; });
  h+=`</div>`;
  const exp=portfolioExportUrl(); if(exp) h+=`<button class="btn btn-sm" onclick="window.location.href='${exp}'">⬇ Export CSV</button>`;
  h+=`</div>`;
  switch(portfolioState.subTab){
    case 'dashboard': h+=renderPortfolioDashboard(); break;
    case 'action':    h+=renderPortfolioActionList(); break;
    case 'insights':  h+=renderPortfolioInsights(); break;
    case 'alerts':    h+=renderPortfolioAlerts(); break;
  }
  setTimeout(()=>{ document.querySelectorAll('[data-pt]').forEach(b=>{ b.onclick=()=>{ portfolioState.subTab=b.dataset.pt; render(); }; }); },0);
  return h;
}
function portfolioExportUrl(){
  if(portfolioState.subTab==='dashboard') return '/api/portfolio/dashboard?format=csv';
  if(portfolioState.subTab==='action')    return '/api/portfolio/manager-action-list?format=csv&limit=100';
  return null;
}

async function loadPortfolioDashboard(){ try{ portfolioState.dashboard=await apiJSON('/api/portfolio/dashboard'); render(); }catch(e){console.error(e);} }
function renderPortfolioDashboard(){
  if(!portfolioState.dashboard){ setTimeout(loadPortfolioDashboard,0); return `<div class="empty-state"><div class="empty-state-icon">🗂️</div><div class="empty-state-title">Loading portfolio…</div></div>`; }
  const rows=(portfolioState.dashboard.rows||[]).slice();
  // Sortable columns
  const sb=portfolioState.sortBy; const dir=portfolioState.sortDir==='asc'?1:-1;
  rows.sort((a,b)=>{ const av=a[sb]; const bv=b[sb]; if(av==null) return 1; if(bv==null) return -1; if(typeof av==='string') return av.localeCompare(bv)*dir; return (av-bv)*dir; });
  const TH=(key,label)=>`<th data-sort="${key}" style="cursor:pointer;user-select:none">${esc(label)}${portfolioState.sortBy===key?(portfolioState.sortDir==='asc'?' ▲':' ▼'):''}</th>`;
  let h=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:1300px"><thead><tr>${TH('clientName','Client')}${TH('tier','Tier')}${TH('riskBand','Risk')}${TH('overallRisk','Risk Score')}${TH('healthScore','Health')}${TH('readinessState','Readiness')}${TH('openTasks','Open')}${TH('overdueTasks','Overdue')}${TH('openEscalations','Escalations')}${TH('documentsPending','Docs')}${TH('upcomingDeadlines','Due ≤7d')}${TH('responsivenessScore','Resp')}${TH('effortScore','Effort')}${TH('serviceQualityScore','Quality')}${TH('lastActivity','Last Activity')}</tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr style="cursor:pointer" data-client="${r.clientId}"><td style="font-weight:600">${esc(r.clientName)}</td><td>${tierBadge(r.tier)}</td><td>${riskBandPill(r.riskBand)}</td><td><b>${r.overallRisk||0}</b></td><td>${healthBadge(r.healthScore, r.healthBand)}</td><td>${readinessPill(r.readinessState)}</td><td>${r.openTasks}</td><td style="color:${r.overdueTasks>0?'var(--red)':'var(--text-muted)'}">${r.overdueTasks}</td><td>${r.openEscalations}</td><td>${r.documentsPending}</td><td>${r.upcomingDeadlines}</td><td>${scorePill(r.responsivenessScore,true)}</td><td>${scorePill(r.effortScore,false)}</td><td>${scorePill(r.serviceQualityScore,true)}</td><td style="font-size:11px;color:var(--text-muted)">${r.lastActivity?r.lastActivity.slice(0,10):'—'}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  setTimeout(()=>{ document.querySelectorAll('[data-sort]').forEach(th=>{ th.onclick=()=>{ const k=th.dataset.sort; if(portfolioState.sortBy===k){ portfolioState.sortDir=portfolioState.sortDir==='asc'?'desc':'asc'; } else { portfolioState.sortBy=k; portfolioState.sortDir='desc'; } render(); }; }); },0);
  return h;
}

async function loadPortfolioInsights(){ try{ portfolioState.insights=await apiJSON('/api/portfolio/insights'); render(); }catch(e){console.error(e);} }
function renderPortfolioInsights(){
  if(!portfolioState.insights){ setTimeout(loadPortfolioInsights,0); return `<div class="empty-state"><div class="empty-state-icon">💡</div><div class="empty-state-title">Loading insights…</div></div>`; }
  const x=portfolioState.insights;
  const list=(title,rows,renderer)=>{
    let inner=`<div class="card-title">${title} (${rows.length})</div>`;
    if(!rows.length) return `<div class="card">${inner}<div style="padding:8px;font-size:12px;color:var(--text-muted)">No data.</div></div>`;
    inner+=`<div style="max-height:300px;overflow:auto">${rows.map(renderer).join('')}</div>`;
    return `<div class="card">${inner}</div>`;
  };
  const row=r=>`<div data-client="${r.clientId}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;gap:6px"><span style="font-weight:600;flex:1">${esc(r.clientName)}</span>${tierBadge(r.tier)}${riskBandPill(r.riskBand)}<span style="color:var(--text-muted)">risk ${r.overallRisk||0}</span></div>`;
  const effortRow=r=>`<div data-client="${r.clientId}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="font-weight:600">${esc(r.clientName)}</span><span>${scorePill(r.effortScore,false)}</span></div>`;
  const overdueRow=r=>`<div data-client="${r.clientId}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="font-weight:600">${esc(r.clientName)}</span><span style="color:var(--red);font-weight:700">${r.overdueTasks}</span></div>`;
  const docRow=r=>`<div data-client="${r.clientId}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="font-weight:600">${esc(r.clientName)}</span><span style="color:var(--amber);font-weight:700">${r.documentsPending}</span></div>`;
  const respRow=r=>`<div data-client="${r.clientId}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="font-weight:600">${esc(r.clientName)}</span><span>${scorePill(r.responsivenessScore,true)}</span></div>`;
  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px">`;
  h+=list('🚨 Top 10 Highest Risk',          x.topHighestRisk||[], row);

  h+=list('⏰ Most Overdue Work',             x.mostOverdue||[], overdueRow);
  h+=list('📎 Most Document Delays',          x.mostDocumentDelays||[], docRow);
  h+=list('👔 Require Partner Attention',     x.requirePartnerAttention||[], row);
  h+=list('🐢 Least Responsive Clients',      x.leastResponsive||[], respRow);
  h+=`</div>`;
  return h;
}

const reportsState={
  subTab:'summary', period:'month', value:null, options:null,
  summary:null, employees:null, clients:null, documents:null,
  vat:null, ct:null, escalations:null, workload:null, workloadSlice:'user',
  trends:{ filing_completion:null, sla_compliance:null, escalations:null },
  attention:null
};

function reportsExportUrl(path){
  const q=new URLSearchParams();
  if(reportsState.period) q.set('period', reportsState.period);
  if(reportsState.value)  q.set('value',  reportsState.value);
  q.set('format','csv');
  return path + (path.includes('?') ? '&' : '?') + q.toString();
}

async function loadReportsOptions(){
  if(reportsState.options) return;
  try{ reportsState.options=await apiJSON('/api/reports/period-options'); render(); }catch(e){ console.error(e);}
}
function periodSelector(){
  loadReportsOptions();
  const opts=reportsState.options;
  if(!opts) return `<span style="font-size:12px;color:var(--text-muted)">Loading periods…</span>`;
  const map={month:opts.months, quarter:opts.quarters, year:opts.years};
  const values=map[reportsState.period]||[];
  if(!reportsState.value) reportsState.value = values[0];
  let h=`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">`;
  ['month','quarter','year'].forEach(p=>{ h+=`<button class="btn btn-sm ${reportsState.period===p?'btn-primary':''}" data-rp="${p}">${p}</button>`; });
  h+=`<select class="form-input" id="rp-value" style="min-width:130px">`;
  values.forEach(v=>{ h+=`<option value="${v}" ${v===reportsState.value?'selected':''}>${v}</option>`; });
  h+=`</select>`;
  return h;
}

function renderReports(){
  const tabs=[
    ['summary','Monthly Summary'],['attention','Attention Required'],
    ['employees','Employees'],['clients','Clients'],['documents','Documents'],
    ['vat','VAT'],['ct','CT'],['escalations','Escalations'],['workload','Workload'],['trends','Trends']
  ];
  let h=`<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><div class="nav" style="margin:0">`;
  tabs.forEach(([k,l])=>{ h+=`<button class="nav-btn ${reportsState.subTab===k?'active':''}" data-rt="${k}">${l}</button>`; });
  h+=`</div>`;
  if(['summary','employees','clients','documents','vat','ct','escalations'].includes(reportsState.subTab)){
    h+=`<div style="margin-left:auto;display:flex;gap:8px;align-items:center">${periodSelector()}<button class="btn btn-sm" id="rp-export">⬇ Export CSV</button></div>`;
  }
  h+=`</div>`;
  switch(reportsState.subTab){
    case 'summary':     h+=renderReportSummary(); break;
    case 'attention':   h+=renderReportAttention(); break;
    case 'employees':   h+=renderReportEmployees(); break;
    case 'clients':     h+=renderReportClients(); break;
    case 'documents':   h+=renderReportDocuments(); break;
    case 'vat':         h+=renderReportCompliance('vat'); break;
    case 'ct':          h+=renderReportCompliance('ct'); break;
    case 'escalations': h+=renderReportEscalations(); break;
    case 'workload':    h+=renderReportWorkload(); break;
    case 'trends':      h+=renderReportTrends(); break;
  }
  setTimeout(()=>{
    document.querySelectorAll('[data-rt]').forEach(b=>{ b.onclick=()=>{ reportsState.subTab=b.dataset.rt; render(); }; });
    document.querySelectorAll('[data-rp]').forEach(b=>{ b.onclick=()=>{ reportsState.period=b.dataset.rp; reportsState.value=null; reportsClearCache(); render(); }; });
    const sel=document.getElementById('rp-value'); if(sel) sel.onchange=()=>{ reportsState.value=sel.value; reportsClearCache(); render(); };
    const exp=document.getElementById('rp-export'); if(exp) exp.onclick=()=>{ const url=reportsExportPath(); if(url) window.location.href=url; };
  },0);
  return h;
}
function reportsClearCache(){
  reportsState.summary=null; reportsState.employees=null; reportsState.clients=null;
  reportsState.documents=null; reportsState.vat=null; reportsState.ct=null; reportsState.escalations=null;
  reportsState.attention=null;
}
function reportsExportPath(){
  const map={ summary:'/api/reports/management-summary', employees:'/api/reports/employees', clients:'/api/reports/clients',
    documents:'/api/reports/document-delays', vat:'/api/reports/vat-compliance', ct:'/api/reports/ct-compliance',
    escalations:'/api/reports/escalations', workload:'/api/reports/workload?slice='+(reportsState.workloadSlice||'user'),
    attention:'/api/reports/attention-required?limit=50' };
  const base=map[reportsState.subTab]; if(!base) return null;
  return reportsExportUrl(base);
}

// --- per-report renderers ---
function periodQ(){ const q=new URLSearchParams(); if(reportsState.period) q.set('period',reportsState.period); if(reportsState.value) q.set('value',reportsState.value); return q.toString()?('?'+q.toString()):''; }

async function loadReportSummary(){ try{ reportsState.summary=await apiJSON('/api/reports/management-summary'+(reportsState.value?'?month='+encodeURIComponent(reportsState.value):'')); render(); }catch(e){console.error(e);} }
function renderReportSummary(){
  if(!reportsState.summary){ setTimeout(loadReportSummary,0); return `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">Loading summary…</div></div>`; }
  const s=reportsState.summary; const k=s.headline;
  const tile=(label,val,suffix)=>`<div class="card"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${label}</div><div style="font-size:26px;font-weight:700;margin-top:2px">${val==null?'—':val}${suffix||''}</div></div>`;
  let h=`<div class="card-title" style="margin-bottom:12px">📊 ${esc(s.meta.label)} Monthly Summary</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px">`;
  h+=tile('Total Clients',k.totalClients);
  h+=tile('Active in Period',k.activeClients);
  h+=tile('Filing Completion',k.filingCompletionRate,'%');
  h+=tile('Productivity / User',k.teamProductivity);
  h+=tile('High-Risk Clients',k.highRiskClients);
  h+=tile('Open Escalations',k.openEscalations);
  h+=tile('Overdue Work',k.overdueWork);
  h+=tile('Pending Reviews',k.pendingReviews);
  h+=tile('Completed',k.completedInPeriod);
  h+=`</div>`;
  // VAT/CT summary
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">`;
  ['vat','ct'].forEach(kk=>{
    const t=s[kk]||{}; const label=kk.toUpperCase();
    h+=`<div class="card"><div class="card-title">${label} Compliance</div><div style="font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:6px"><div>Due: <b>${t.due||0}</b></div><div>Filed: <b>${t.filed||0}</b></div><div>On Time: <b>${t.filedOnTime||0}</b></div><div>Overdue: <b style="color:var(--red)">${t.overdue||0}</b></div><div>Timeliness: <b>${t.timelinessPct==null?'—':t.timelinessPct+'%'}</b></div></div></div>`;
  });
  h+=`</div>`;
  // Escalation categories
  if(s.escalationCategories && s.escalationCategories.length){
    h+=`<div class="card" style="margin-bottom:12px"><div class="card-title">Escalation Categories</div><table style="width:100%"><tbody>`;
    s.escalationCategories.forEach(c=>{ h+=`<tr><td style="padding:4px 6px">${esc(c.category)}</td><td style="padding:4px 6px;text-align:right;font-weight:700">${c.count}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }
  // Attention required
  if(s.attentionRequired && s.attentionRequired.length){
    h+=`<div class="card"><div class="card-title">🎯 Top 10 Attention Required</div>`;
    h+=attentionTableHtml(s.attentionRequired.slice(0,10));
    h+=`</div>`;
  }
  return h;
}

function attentionTableHtml(rows){
  let h=`<table style="width:100%"><thead><tr><th>Client</th><th>Score</th><th>Readiness</th><th>Risk</th><th>Overdue</th><th>Stale Docs</th><th>Due ≤7d</th><th>Reasons</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr><td style="font-weight:600">${esc(r.clientName)}</td><td><b style="color:var(--red)">${r.score}</b></td><td>${readinessPill(r.readinessState)}</td><td>${escalationPill(r.escalationBand, '')}</td><td style="color:${r.overdueCount?'var(--red)':'var(--text-muted)'}">${r.overdueCount}</td><td>${r.staleDocsCount}</td><td>${r.upcomingDeadlineCount}</td><td style="font-size:11px;color:var(--text-muted)">${esc((r.reasons||[]).join(' · '))}</td></tr>`;
  });
  h+=`</tbody></table>`;
  return h;
}

function trendCard(title, data, key){
  if(!data){ return `<div class="card"><div class="card-title">${title}</div><div style="padding:8px;color:var(--text-muted);font-size:12px">Loading…</div></div>`; }

  const max=Math.max(1,...vals);
  let h=`<div class="card"><div class="card-title">${title}</div><div style="display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--border);padding-bottom:4px">`;

  h+=`</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px"><span>${pts[0]?.period||''}</span><span>${pts[pts.length-1]?.period||''}</span></div></div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════
// PHASE 5 — Risk Center (+ Phase 4 workflow widget)
// ═══════════════════════════════════════════════════════════════
const riskState={ subTab:'dashboard', groupBy:'client',
  findings:null, clientScores:null, accountability:null, action:null, bottlenecks:null, briefing:null, followUp:null, sla:null,
  readinessFilter:'All', readinessSort:'off' /* off | asc | desc */ };

// ---- Readiness filter / sort helpers shared across Risk Center sub-tabs ----
function riskReadinessMatches(clientId){
  if(!riskState.readinessFilter || riskState.readinessFilter==='All') return true;
  const r=readinessFor(clientId);
  if(!r) return false;
  return r.state===riskState.readinessFilter;
}
function riskSortByReadiness(rows, getId){
  if(riskState.readinessSort==='off') return rows;
  const dir=riskState.readinessSort==='desc'?-1:1;
  return rows.slice().sort((a,b)=>{
    const ra=readinessFor(getId(a)); const rb=readinessFor(getId(b));
    const oa=ra?readinessOrder(ra.state):999;
    const ob=rb?readinessOrder(rb.state):999;
    return (oa-ob)*dir;
  });
}
function readinessFilterStrip(){
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); return ''; }
  const counts=state.clientReadiness.counts||{};
  const order=['high_risk','blocked','filing_due','awaiting_client_approval','awaiting_documents','awaiting_review','partially_ready','ready'];
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-right:4px">Readiness filter</span>`;
  const isAll=!riskState.readinessFilter||riskState.readinessFilter==='All';
  h+=`<button class="btn btn-sm ${isAll?'btn-primary':''}" data-rrf="All">All</button>`;
  order.forEach(s=>{
    const n=counts[s]||0; if(!n) return;
    const m=READINESS_STATE_META[s]; const active=riskState.readinessFilter===s;
    h+=`<button class="btn btn-sm" data-rrf="${s}" style="border-left:3px solid ${m.color};${active?'background:var(--bg-elevated);font-weight:700':''}">${esc(m.label)}: ${n}</button>`;
  });
  // Sort toggle
  const sortLabel={off:'⇅ Sort by readiness', asc:'↑ Readiness (worst first)', desc:'↓ Readiness (best first)'}[riskState.readinessSort];
  h+=`<button class="btn btn-sm" data-rrs="toggle" style="margin-left:auto">${sortLabel}</button>`;
  h+=`</div>`;
  setTimeout(()=>{
    document.querySelectorAll('[data-rrf]').forEach(b=>{ b.onclick=()=>{ riskState.readinessFilter=b.dataset.rrf; render(); }; });
    document.querySelectorAll('[data-rrs]').forEach(b=>{ b.onclick=()=>{ riskState.readinessSort = riskState.readinessSort==='off'?'asc':riskState.readinessSort==='asc'?'desc':'off'; render(); }; });
  },0);
  return h;
}

// ═══════════════════════════════════════════════════════════════
// Client Readiness — shared pill, cache, filter state
// ═══════════════════════════════════════════════════════════════
const READINESS_STATE_META={
  high_risk:               { label:'High Risk',                color:'var(--red)',        order:0 },
  blocked:                 { label:'Blocked',                  color:'var(--red)',        order:1 },
  filing_due:              { label:'Filing Due',               color:'var(--amber)',      order:2 },
  awaiting_client_approval:{ label:'Awaiting Client Approval', color:'var(--amber)',      order:3 },
  awaiting_documents:      { label:'Awaiting Documents',       color:'var(--amber)',      order:4 },
  awaiting_review:         { label:'Awaiting Review',          color:'var(--accent)',     order:5 },
  partially_ready:         { label:'Partially Ready',          color:'var(--blue)',       order:6 },
  ready:                   { label:'Ready',                    color:'var(--green)',      order:7 },
  idle:                    { label:'Active',                   color:'var(--text-muted)', order:8 }
};
function readinessPill(state){
  const m=READINESS_STATE_META[state]||READINESS_STATE_META.idle;
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${m.color};font-weight:700;font-size:10px;text-transform:uppercase;white-space:nowrap">${esc(m.label)}</span>`;
}
function readinessOrder(state){ return (READINESS_STATE_META[state]||READINESS_STATE_META.idle).order; }

// Compact tier badge for list/table contexts — visually quiet for B (the
// default), prominent for A. Priority order in any row: risk → readiness → tier.
const TIER_MINI_META = {
  A: { color: 'var(--red)',        bg: 'rgba(239,68,68,0.12)', weight: 800 },
  B: { color: 'var(--text-muted)', bg: 'var(--bg-elevated)',   weight: 600 },
  C: { color: 'var(--text-muted)', bg: 'var(--bg-elevated)',   weight: 600 }
};
function tierBadgeMini(tier){
  const t=tier||'B'; const m=TIER_MINI_META[t]||TIER_MINI_META.B;
  return `<span title="Tier ${esc(t)}" style="display:inline-block;min-width:18px;padding:1px 5px;border-radius:4px;background:${m.bg};color:${m.color};font-size:10px;font-weight:${m.weight};text-align:center;letter-spacing:0.5px">${esc(t)}</span>`;
}
function tierFor(clientId){
  const map=state.clientReadinessByClient||{};
  const r=map[String(clientId)]; return r ? (r.tier || 'B') : null;
}
function tierForName(name){
  if(!state.clientReadiness) return null;
  const row=(state.clientReadiness.clients||[]).find(r=>r.clientName===name);
  return row ? (row.tier || 'B') : null;
}
function tierOrder(t){ return t==='A'?0:t==='B'?1:t==='C'?2:3; }

// Cache keyed in `state` so existing render() refreshes pick it up.
async function ensureReadinessLoaded(force){
  if(!force && state.clientReadiness && state.clientReadinessLoadedAt && (Date.now()-state.clientReadinessLoadedAt)<60000) return state.clientReadiness;
  return _once('readiness', async()=>{
    try{
      const j=await apiJSON('/api/clients/readiness');
      state.clientReadiness=j;
      state.clientReadinessLoadedAt=Date.now();
      state.clientReadinessByClient={};
      (j.clients||[]).forEach(r=>{ state.clientReadinessByClient[String(r.clientId)]=r; });
      render();
      return j;
    }catch(e){ console.error('[readiness]', e); return null; }
  });
}
function readinessFor(clientId){
  const map=state.clientReadinessByClient||{};
  return map[String(clientId)]||null;
}

  // Make sure readiness data is loaded — sub-tabs depend on it.
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); }
  const tabs=[['dashboard','Dashboard'],['action','Action Center'],['bottlenecks','Bottlenecks'],['sla','SLA Prediction'],['briefing','Daily Briefing'],['followup','Follow-up'],['team','Team Accountability']];

  h+=`</div></div>`;
  // Readiness filter strip — applies to all sub-tabs except Team Accountability.
  if(riskState.subTab!=='team' && riskState.subTab!=='bottlenecks') h+=readinessFilterStrip();
  switch(riskState.subTab){
    case 'dashboard':  h+=renderRiskDashboard(); break;
    case 'action':     h+=renderActionCenter(); break;
    case 'bottlenecks':h+=renderBottlenecks(); break;

  setTimeout(()=>{ document.querySelectorAll('[data-rs]').forEach(b=>{ b.onclick=()=>{ riskState.subTab=b.dataset.rs; render(); }; }); },0);
  return h;
}

  if(!riskState.findings){ setTimeout(loadRiskFindings,0); return `<div class="empty-state"><div class="empty-state-icon">🛡️</div><div class="empty-state-title">Loading risk findings…</div></div>`; }
  const t=riskState.findings.totals;
  const tile=(lvl,n)=>{ const c={critical:'var(--red)',high:'var(--red)',medium:'var(--amber)',low:'var(--text-muted)'}[lvl]; return `<div class="card" style="border-color:${c}"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${lvl}</div><div style="font-size:28px;font-weight:700;color:${c}">${n}</div></div>`; };
  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:12px">`+tile('critical',t.critical)+tile('high',t.high)+tile('medium',t.medium)+tile('low',t.low)+`</div>`;
  h+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><label style="font-size:11px;color:var(--text-muted)">Group by</label>`;
  ['client','user','type'].forEach(g=>{ h+=`<button class="btn btn-sm ${riskState.groupBy===g?'btn-primary':''}" data-gb="${g}">${g}</button>`; });
  h+=`</div>`;
  let groups=riskState.findings.grouped||[];
  // Readiness filter at group level: keep groups that have at least one matching item.
  if(riskState.readinessFilter && riskState.readinessFilter!=='All'){
    groups = groups.map(g=>{
      const items=(g.items||[]).filter(f=>riskReadinessMatches(f.clientId));
      const totals={critical:0,high:0,medium:0,low:0};
      items.forEach(f=>{ totals[f.level]++; });
      return Object.assign({}, g, { items, totals });
    }).filter(g=>g.items.length>0);
  }
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px">`;
  groups.forEach(g=>{
    // If grouped by client, show readiness + tier pill in the group header.
    const groupReadiness = (riskState.groupBy==='client' && g.items[0]) ? readinessFor(g.items[0].clientId) : null;
    const groupTier = (riskState.groupBy==='client' && g.items[0]) ? tierFor(g.items[0].clientId) : null;
    h+=`<div class="card"><div class="card-title" style="display:flex;align-items:center;gap:6px">${esc(g.key)} ${groupReadiness?readinessPill(groupReadiness.state):''}${groupTier?tierBadgeMini(groupTier):''} <span style="font-size:11px;color:var(--text-muted)">· ${g.items.length}</span></div><div style="display:flex;gap:6px;margin:4px 0 8px">`;
    ['critical','high','medium','low'].forEach(l=>{ if(g.totals[l]) h+=`<span style="font-size:10px;color:var(--text-muted)">${l}: <b style="color:var(--text-primary)">${g.totals[l]}</b></span>`; });
    h+=`</div><div style="max-height:240px;overflow:auto">`;
    g.items.slice(0,15).forEach(f=>{
      const r=readinessFor(f.clientId);
      h+=`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:8px;justify-content:space-between;align-items:center">${riskLevelPill(f.level)}<span style="flex:1">${esc(f.evidence||f.kind)}</span>${r&&riskState.groupBy!=='client'?readinessPill(r.state):''}${f.taskId?`<a href="#" data-task="${f.taskId}" style="color:var(--accent);font-size:11px">view</a>`:''}</div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // Client scores — apply filter + sort, add Readiness column.
  if(riskState.clientScores){
    let rows=(riskState.clientScores.scores||[]).filter(r=>r.band!=='green');
    rows = rows.filter(r=>riskReadinessMatches(r.clientId));
    rows = riskSortByReadiness(rows, r=>r.clientId).slice(0,30);
    if(rows.length){
      h+=`<div class="card" style="margin-top:16px"><div class="card-title">Client Escalation Scores (non-green)</div><table style="width:100%"><thead><tr><th>Client</th><th>Readiness</th><th>Tier</th><th>Band</th><th>Score</th><th>Critical</th><th>High</th><th>Medium</th></tr></thead><tbody>`;
      rows.forEach(r=>{ const rd=readinessFor(r.clientId); const t=tierFor(r.clientId); h+=`<tr><td style="font-weight:600">${esc(r.clientName||'')}</td><td>${rd?readinessPill(rd.state):'<span style="font-size:10px;color:var(--text-muted)">—</span>'}</td><td>${t?tierBadgeMini(t):'<span style="font-size:10px;color:var(--text-muted)">—</span>'}</td><td>${escalationPill(r.band,r.score)}</td><td>${r.score}</td><td style="color:var(--red)">${r.totals.critical}</td><td>${r.totals.high}</td><td>${r.totals.medium}</td></tr>`; });
      h+=`</tbody></table></div>`;
    }
  }
  setTimeout(()=>{ document.querySelectorAll('[data-gb]').forEach(b=>{ b.onclick=()=>{ riskState.groupBy=b.dataset.gb; riskState.findings=null; render(); }; }); },0);

}

async function loadSla(){ try{ riskState.sla=await apiJSON('/api/risk/sla-prediction'); render(); }catch(e){ console.error(e);} }
function renderSlaPrediction(){
  if(!riskState.sla){ setTimeout(loadSla,0); return `<div class="empty-state"><div class="empty-state-icon">🔮</div><div class="empty-state-title">Predicting breaches…</div></div>`; }
  // SLA predictions don't carry clientId — match on clientName as fallback.
  const byName={}; (state.clientReadiness&&state.clientReadiness.clients||[]).forEach(r=>{ byName[r.clientName]=r; });
  const readinessForRow=p=>{ const byName2=byName[p.clientName]; if(byName2) return readinessFor(byName2.clientId); return null; };

  }
  let h=`<div class="card-title" style="margin-bottom:12px">SLA Breach Predictions (${ps.length})</div>`;

  h+=`</tbody></table></div>`;

function openTierEditor(clientId, currentSettings){

    <div style="background:var(--bg-card);padding:22px;border-radius:8px;max-width:480px;width:90%">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Edit Tier / Service Settings</h3><button class="btn btn-sm" id="tierClose">✕</button></div>
      <div style="display:grid;gap:10px;font-size:13px">
        <label>Tier
          <select id="tierSel" class="form-input">

            <option value="B" ${currentSettings.tier==='B'?'selected':''}>B — Standard (× 1.0)</option>

          </select>
        </label>
        <label>Partner Owner<input id="tierOwner" class="form-input" placeholder="e.g. Partner Name" value="${esc(currentSettings.partnerOwner||'')}"></label>
        <label>Override Reason (required when changing tier)
          <textarea id="tierReason" class="form-input" placeholder="e.g. Strategic client, high-revenue, new client requiring extra attention…" rows="3">${esc(currentSettings.overrideReason||'')}</textarea>
        </label>
        <label>Internal Notes (optional)<textarea id="tierNotes" class="form-input" rows="2">${esc(currentSettings.notes||'')}</textarea></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="tierCancel">Cancel</button><button class="btn btn-primary" id="tierSave">Save</button></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('tierClose').onclick=()=>document.getElementById('tierModal').remove();
  document.getElementById('tierCancel').onclick=()=>document.getElementById('tierModal').remove();
  document.getElementById('tierSave').onclick=async function(){
    const newTier=document.getElementById('tierSel').value;

        })

function lifecycleStageColor(status){
  return ({
    complete:'var(--green)', completed:'var(--green)',
    in_progress:'var(--accent)',
    pending:'var(--amber)', stalled:'var(--red)',
    not_required:'var(--text-muted)', none:'var(--text-muted)',
    not_ready:'var(--red)', partially_ready:'var(--amber)', ready_for_filing:'var(--green)'
  })[status] || 'var(--text-muted)';
}
function lifecycleStageIcon(status){
  return ({
    complete:'✓', completed:'✓', in_progress:'●',
    pending:'◐', stalled:'⚠', not_required:'—', none:'—',
    not_ready:'✕', partially_ready:'◐', ready_for_filing:'✓'
  })[status] || '○';
}
function readinessLabel(r){
  return ({
    ready_for_filing:'Ready For Filing',
    partially_ready:'Partially Ready',
    not_ready:'Not Ready',
    completed:'Completed',
    none:'No Active Filings'
  })[r] || r;
}

function lifecycleTile(label, stage){
  if(!stage) return '';
  const c=lifecycleStageColor(stage.status);
  const icon=lifecycleStageIcon(stage.status);
  return `<div style="background:var(--bg-deep);border-radius:8px;padding:10px;border-left:3px solid ${c}">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">${esc(label)}</div><div style="font-size:16px;color:${c};font-weight:700">${icon}</div></div>
    <div style="font-size:13px;font-weight:700;color:${c};margin-top:4px;text-transform:capitalize">${esc((stage.status||'').replace(/_/g,' '))}</div>
    ${stage.detail?`<div style="font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.4">${esc(stage.detail)}</div>`:''}
  </div>`;
}

function renderClientLifecycle(data){
  if(!data) return '';
  const s=data.stages; const overall=data.overallReadiness;
  const overallColor=lifecycleStageColor(overall);
  const escalation=data.escalation||{score:0,band:'green'};
  const health=data.health;

  // Header strip with overall readiness + scores
  let h=`<div class="card" style="border-color:${overallColor};margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Compliance Lifecycle</div>
        <div style="font-size:20px;font-weight:800;color:${overallColor};margin-top:2px">${readinessLabel(overall)}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;font-size:12px">
        ${health?`<div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase">Health</div><div style="margin-top:2px">${healthBadge(health.score, health.band)}</div></div>`:''}
        <div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase">Escalation</div><div style="margin-top:2px">${escalationPill(escalation.band, escalation.score)}</div></div>
        ${data.findings && data.findings.length?`<div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase">Open Risks</div><div style="margin-top:2px;font-weight:700">${data.findings.length}</div></div>`:''}
      </div>
    </div>`;

  // 8-tile stage grid
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:14px">`;
  h+=lifecycleTile('Onboarding',         s.onboarding);
  h+=lifecycleTile('VAT Registration',   s.vatRegistration);
  h+=lifecycleTile('CT Registration',    s.ctRegistration);
  h+=lifecycleTile('Accounting',         s.accounting);
  h+=lifecycleTile('Review',             s.review);
  h+=lifecycleTile('Client Approval',    s.clientApproval);
  h+=lifecycleTile('Filing',             s.filing);
  h+=`<div style="background:var(--bg-deep);border-radius:8px;padding:10px;border-left:3px solid ${overallColor}">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Overall Readiness</div><div style="font-size:16px;color:${overallColor};font-weight:700">${lifecycleStageIcon(overall)}</div></div>
    <div style="font-size:13px;font-weight:700;color:${overallColor};margin-top:4px">${readinessLabel(overall)}</div>
  </div>`;
  h+=`</div>`;
  h+=`</div>`;

  // Blockers + next actions
  if((data.blockers&&data.blockers.length)||(data.nextActions&&data.nextActions.length)){
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">`;
    if(data.blockers&&data.blockers.length){
      h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title" style="color:var(--red)">⚠ Blockers</div>`;
      data.blockers.forEach(b=>{ h+=`<div style="padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)">${esc(b)}</div>`; });
      h+=`</div>`;
    }else{
      h+=`<div class="card"><div class="card-title">✓ Blockers</div><div style="padding:8px;font-size:12px;color:var(--text-muted)">No active blockers.</div></div>`;
    }
    if(data.nextActions&&data.nextActions.length){
      h+=`<div class="card" style="border-color:var(--accent-soft)"><div class="card-title" style="color:var(--accent)">→ Next Actions</div>`;
      data.nextActions.forEach(a=>{ h+=`<div style="padding:6px 0;font-size:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px"><span>${esc(a.title)}</span>${a.workflowId?`<button class="btn btn-sm" data-wf-open="${a.workflowId}">Open</button>`:''}</div>`; });
      h+=`</div>`;
    }else{
      h+=`<div class="card"><div class="card-title">→ Next Actions</div><div style="padding:8px;font-size:12px;color:var(--text-muted)">Nothing to action — lifecycle clean.</div></div>`;
    }
    h+=`</div>`;
  }

  // Workflows list (compact)
  if(data.workflows&&data.workflows.length){
    h+=`<div class="card" style="margin-bottom:8px"><div class="card-title">Workflows</div>`;
    data.workflows.forEach(w=>{
      const c=w.status==='completed'?'var(--green)':w.status==='active'?'var(--accent)':'var(--text-muted)';
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><div><b>${esc(w.workflow_type.replace(/_/g,' '))}</b> ${w.period_label?'· '+esc(w.period_label):''}</div><div style="display:flex;gap:8px;align-items:center"><span style="color:${c};font-size:11px;font-weight:700;text-transform:uppercase">${esc(w.status)}</span><span style="color:var(--text-muted);font-size:11px">${esc(w.current_step_key||'—')}</span><button class="btn btn-sm" data-wf-open="${w.id}">Open</button></div></div>`;
    });
    h+=`</div>`;
  }

  return h;
}

async function openWorkflowModal(workflowId){
  try{
    const data=await apiJSON('/api/workflows/'+workflowId);
    const wf=data.workflow; const steps=data.steps||[];
    const stepHtml=steps.map(s=>{
      const c=s.status==='completed'?'var(--green)':s.status==='in_progress'?'var(--accent)':s.status==='skipped'?'var(--text-muted)':'var(--text-muted)';
      const icon=s.status==='completed'?'✓':s.status==='in_progress'?'●':s.status==='skipped'?'⊘':'○';
      return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:${c};font-size:18px;width:20px">${icon}</span><div style="flex:1"><div style="font-weight:${s.status==='in_progress'?'700':'400'}">${esc(s.step_label)}</div>${s.completed_at?`<div style="font-size:11px;color:var(--text-muted)">${s.completed_at.slice(0,10)} by ${esc(s.completed_by_name||'')}</div>`:''}</div></div>`;
    }).join('');
    const current=steps.find(s=>s.status==='in_progress');
    const html=`<div id="wfModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000"><div style="background:var(--bg-card);padding:20px;border-radius:8px;max-width:620px;width:90%;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">${esc(wf.workflow_type.replace(/_/g,' '))} ${wf.period_label?'· '+esc(wf.period_label):''}</h3><button class="btn btn-sm" id="wfClose">✕</button></div><div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Status: ${esc(wf.status)} · Client: ${esc(wf.client_name)}</div><div>${stepHtml}</div>${current?`<div style="margin-top:14px;display:flex;gap:8px"><input id="wfNotes" class="form-input" placeholder="Notes (optional)" style="flex:1"><button class="btn btn-primary" id="wfAdvance">Complete "${esc(current.step_label)}"</button></div>`:`<div style="margin-top:14px;color:var(--green);font-weight:700">✓ Workflow complete</div>`}</div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
    document.getElementById('wfClose').onclick=()=>document.getElementById('wfModal').remove();
    if(current){
      document.getElementById('wfAdvance').onclick=async function(){
        try{ await apiJSON('/api/workflows/'+workflowId+'/advance',{method:'POST',body:JSON.stringify({requireKey:current.step_key,notes:document.getElementById('wfNotes').value||null})}); document.getElementById('wfModal').remove(); openWorkflowModal(workflowId); }
        catch(err){ alert(err.message); }
      };
    }
  }catch(e){ alert(e.message); }
}
