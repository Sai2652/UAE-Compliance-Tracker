<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset password — BCL</title>
<script>
  // Reset now lives inside login.html — the same page renders Forgot →
  // code-entry → set-new. If the browser landed here with a legacy token
  // in the URL, pass it through so login.html can decide.
  var url = new URL(window.location.href);
  var target = '/login';
  var qs = [];
  if (url.searchParams.get('token')) qs.push('legacy_reset_token=' + url.searchParams.get('token'));
  if (url.searchParams.get('email')) qs.push('email=' + encodeURIComponent(url.searchParams.get('email')));
  if (qs.length) target += '?' + qs.join('&');
  window.location.replace(target);
</script>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">Redirecting to <a href="/login">the sign-in page</a>…</p>
</body>
</html>
