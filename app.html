<!DOCTYPE html>
<!-- data-bcl-tracker is how the BCL Compliance Companion extension (see
     extension/) recognises this app. It MUST stay in the static markup: the
     extension's bridge scripts read it at document_start and return immediately
     if it's absent, which is before any inline script has run. Set it from
     JavaScript and Launch and fill silently degrades to just opening the tab. -->
<html lang="en" data-bcl-tracker="uae-compliance-tracker">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAE Compliance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Apply saved theme before any paint to avoid a dark-to-light flash on load.
(function(){ try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('theme-light'); } catch(e){} })();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-deep:#080b12;--bg-base:#0c1018;--bg-card:#111722;--bg-card-hover:#151c2a;
--bg-elevated:#1a2234;--bg-input:#0e1420;
--border:#1c2538;--border-light:#243048;--border-focus:#3d7aed;
--text-primary:#e8ecf4;--text-secondary:#8a95aa;--text-muted:#5a6578;
--accent:#3d7aed;--accent-soft:#3d7aed22;
--green:#22c55e;--green-bg:#22c55e18;--green-border:#22c55e33;
--amber:#f59e0b;--amber-bg:#f59e0b18;--amber-border:#f59e0b33;
--red:#ef4444;--red-bg:#ef444418;--red-border:#ef444433;
--blue:#3d7aed;--blue-bg:#3d7aed18;
--slate:#64748b;--slate-bg:#64748b18;
--radius:8px;--radius-lg:12px;--radius-xl:16px;
--font:'Plus Jakarta Sans',system-ui,sans-serif;
--mono:'IBM Plex Mono',monospace;
--transition:0.2s cubic-bezier(0.4,0,0.2,1);
}
/* Light theme — variable overrides only, no structural changes. */
html.theme-light{
--bg-deep:#f4f6fb;--bg-base:#eef1f7;--bg-card:#ffffff;--bg-card-hover:#f4f6fb;
--bg-elevated:#e8ecf4;--bg-input:#ffffff;
--border:#dde3ee;--border-light:#c8d0dd;--border-focus:#2d6adc;
--text-primary:#0c1018;--text-secondary:#3d4658;--text-muted:#6b7488;
--accent:#2d6adc;--accent-soft:#3d7aed14;
--green:#16a34a;--green-bg:#16a34a14;--green-border:#16a34a44;
--amber:#c2410c;--amber-bg:#f59e0b18;--amber-border:#f59e0b55;
--red:#dc2626;--red-bg:#ef444414;--red-border:#ef444455;
--blue:#2d6adc;--blue-bg:#3d7aed12;
--slate:#475569;--slate-bg:#64748b18;
}
html.theme-light ::-webkit-scrollbar-thumb{background:#c8d0dd}
html.theme-light .modal{box-shadow:0 20px 60px rgba(15,23,42,0.18)}
html.theme-light .modal-overlay{background:rgba(15,23,42,0.35)}
html.theme-light .logo-mark{color:#ffffff}
html.theme-light .btn-primary{color:#ffffff}
/* Smoother tab-switch: color/background transitions on every interactive surface */
html{color-scheme:dark}
html.theme-light{color-scheme:light}
body,.header,.nav,.nav-btn,.btn,.card,.stat-card,.form-input,.main,.sidebar,.modal,.deadline-item,.tm-item,.detail-nav-btn,.month-cell,.doc-toggle-btn,.cred-card{transition:background-color 0.18s ease,color 0.18s ease,border-color 0.18s ease}
.nav-btn.active{transition:background-color 0.15s ease,color 0.15s ease}
/* Skeleton loader — used while a tab's async data is loading. */
.skeleton{background:linear-gradient(90deg,var(--bg-card) 0%,var(--bg-card-hover) 50%,var(--bg-card) 100%);background-size:200% 100%;animation:skeleton-shimmer 1.4s ease-in-out infinite;border-radius:var(--radius);border:1px solid var(--border)}
@keyframes skeleton-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-row{height:64px;margin-bottom:8px}
.skeleton-card{height:120px;margin-bottom:12px}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.5}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243048;border-radius:3px}
.app{display:flex;flex-direction:column;height:100vh}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:8px 24px;min-height:56px;display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:100;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:4px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3d7aed,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#080b12}
.logo-text{font-weight:800;font-size:15px;color:var(--text-primary)}
.logo-sub{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:0.5px;text-transform:uppercase}
.nav{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg-deep);border-radius:8px;padding:3px;margin-left:8px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.nav::-webkit-scrollbar{height:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav-btn{padding:6px 12px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);white-space:nowrap;flex-shrink:0}
.nav-btn:hover{color:var(--text-secondary)}
.nav-btn.active{background:var(--bg-elevated);color:var(--text-primary)}
/* Left main-nav sidebar — replaces the old top-of-header tabs. Big click targets. */
.side-nav{width:236px;background:var(--bg-base);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding-bottom:8px}
.side-nav-section{padding:14px 16px 6px;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px}
.side-nav-btn{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:1px 8px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:calc(100% - 16px);transition:background-color 0.15s ease,color 0.15s ease,border-color 0.15s ease;font-family:inherit}
.side-nav-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.side-nav-btn.active{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-light)}
.side-nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.side-nav-label{flex:1;line-height:1.2}
.side-nav-footer{margin-top:auto;padding:10px 8px 4px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.side-nav-footer .side-nav-btn{margin:0 8px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--bg-base);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.main{flex:1;overflow-y:auto;padding:24px;background:var(--bg-deep)}
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--border-light);color:var(--text-primary);background:var(--bg-card-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#2d6adc}
.btn-danger{color:var(--red);border-color:var(--red-border)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 10px;font-size:11px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.stat-grid{display:grid;gap:12px;margin-bottom:20px}
.stat-grid.cols-6{grid-template-columns:repeat(6,1fr)}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
.stat-value{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;line-height:1}
.stat-label{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge-not-started{background:var(--slate-bg);color:var(--slate)}.badge-in-progress{background:var(--blue-bg);color:var(--blue)}.badge-completed{background:var(--green-bg);color:var(--green)}.badge-blocked{background:var(--red-bg);color:var(--red)}.badge-not-applicable{background:var(--bg-elevated);color:var(--text-muted)}
.badge .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-not-started .dot{background:var(--slate)}.badge-in-progress .dot{background:var(--blue)}.badge-completed .dot{background:var(--green)}.badge-blocked .dot{background:var(--red)}.badge-not-applicable .dot{background:var(--text-muted)}
.progress-bar{display:flex;align-items:center;gap:8px}
.progress-track{flex:1;height:6px;background:var(--bg-deep);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.progress-label{font-size:11px;font-weight:700;font-family:var(--mono);min-width:36px;text-align:right}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
.form-input{width:100%;background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;outline:none;transition:var(--transition)}
.form-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-soft)}
.form-input::placeholder{color:var(--text-muted)}
select.form-input{cursor:pointer;appearance:auto}
textarea.form-input{resize:vertical;min-height:60px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;transition:var(--transition)}
.toggle input:checked+.toggle-track{background:var(--green);border-color:var(--green)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:var(--transition)}
.toggle input:checked~.toggle-thumb{left:19px}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;background:var(--bg-base);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:var(--bg-card-hover)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-title{font-size:17px;font-weight:800;margin-bottom:20px;color:var(--text-primary)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.alert{padding:12px 16px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-warning{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)}
.alert-info{background:var(--blue-bg);border:1px solid transparent;color:var(--blue)}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{max-width:280px}
.deadline-item{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer}
.deadline-item:hover{border-color:var(--border-light);background:var(--bg-card-hover)}
.detail-nav{display:flex;flex-direction:column;gap:2px;padding:8px}
.detail-nav-btn{padding:8px 12px;border-radius:var(--radius);border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);text-align:left}
.detail-nav-btn:hover{color:var(--text-secondary);background:var(--bg-card)}
.detail-nav-btn.active{color:var(--text-primary);background:var(--bg-elevated)}
.doc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.doc-row:last-child{border-bottom:none}
.doc-toggle-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition)}
.doc-toggle-btn.received{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.doc-toggle-btn.pending{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.doc-toggle-btn.na{background:var(--bg-elevated);color:var(--text-muted);border-color:var(--border)}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month-cell{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center}
.month-cell:hover{border-color:var(--border-light)}
.month-name{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.team-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.tm-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.tm-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius)}
.tm-item-name{flex:1;font-size:13px;font-weight:600;color:var(--text-primary)}
.tm-item-count{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.tm-remove{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tm-remove:hover{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:0.3}
.empty-state-title{font-size:16px;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
.empty-state-text{font-size:13px;max-width:400px;margin:0 auto 16px}
.mandatory-tag{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:700;margin-left:6px}
.mandatory-tag.req{background:var(--red-bg);color:var(--red)}
.mandatory-tag.opt{background:var(--bg-elevated);color:var(--text-muted)}
.cred-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.cred-card .cred-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cred-card .cred-title{font-weight:600;font-size:13px;color:var(--text-primary)}
.cred-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cred-meta{font-size:10px;color:var(--text-muted);margin-top:6px;font-style:italic}
.pwd-field{position:relative}
.pwd-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:2px}
@media(max-width:900px){.stat-grid.cols-6{grid-template-columns:repeat(3,1fr)}.sidebar{width:220px}.month-grid{grid-template-columns:repeat(3,1fr)}.header{padding:0 12px;gap:8px;overflow-x:auto}}
@media(max-width:640px){.stat-grid.cols-6{grid-template-columns:repeat(2,1fr)}.main{padding:16px}}
</style>

<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const STATUSES=["Not Started","In Progress","Completed","Blocked","Not Applicable"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// UAE legal forms, grouped, with one line on when to pick each.
//
// The old list had four entries — FZCO, FZE, FZ-LLC and Mainland LLC — which
// could not tell a DIFC company from an offshore holding company from a
// representative office. That difference decides whether a client can claim
// the free-zone 0% corporate-tax rate, whether it registers for CT at all,
// and whether it can invoice inside the UAE, so the whole set is listed here
// with guidance attached instead of leaving the team to guess.
//
// KEEP IN STEP WITH entityTypes.js — the server needs the same catalogue for
// the Ops-Mkt sync, which runs with no browser. scripts/check-entity-types.js
// fails if the two drift apart.
const ENTITY_TYPE_CATALOGUE=[
  {value:"Mainland — LLC",group:"Mainland (Economic Department licence)",hint:"The usual onshore company with two or more owners. Trades anywhere in the UAE. Corporate tax at 9% above AED 375,000 — no free-zone 0% relief."},
  {value:"Mainland — One Person LLC",group:"Mainland (Economic Department licence)",hint:"An LLC with a single owner. Same tax and audit position as a normal LLC — pick this only when the licence itself says \"One Person\"."},
  {value:"Mainland — Sole Establishment",group:"Mainland (Economic Department licence)",hint:"One individual trading in their own name, usually on a professional licence. The owner is personally liable for everything."},
  {value:"Mainland — Civil Company",group:"Mainland (Economic Department licence)",hint:"A partnership of professionals — doctors, engineers, consultants, accountants. Partners are personally liable."},
  {value:"Mainland — Private Joint Stock",group:"Mainland (Economic Department licence)",hint:"Shares held privately among founders, not offered to the public. Rare for SMEs — the licence will say PrJSC."},
  {value:"Mainland — Public Joint Stock",group:"Mainland (Economic Department licence)",hint:"Listed, or able to offer shares publicly. Audited financial statements are compulsory every year."},
  {value:"Mainland — Branch of a Foreign Company",group:"Mainland (Economic Department licence)",hint:"An arm of an overseas parent, with no share capital of its own. It still files its own UAE corporate tax return."},
  {value:"Mainland — Branch of a UAE Company",group:"Mainland (Economic Department licence)",hint:"An arm of another UAE company. It is the same legal person as the parent, so corporate tax normally goes in the parent's return."},
  {value:"Mainland — Representative Office",group:"Mainland (Economic Department licence)",hint:"Marketing and liaison only. It cannot trade or raise invoices, so there is no revenue to account for."},
  {value:"Free Zone — FZE (single shareholder)",group:"Free Zone",hint:"Free Zone Establishment: exactly one shareholder. Can claim the 0% rate on qualifying income if it meets the free-zone conditions."},
  {value:"Free Zone — FZCO / FZC (two or more shareholders)",group:"Free Zone",hint:"Free Zone Company: two or more shareholders. Same 0% possibility on qualifying income as an FZE."},
  {value:"Free Zone — FZ-LLC",group:"Free Zone",hint:"The same thing as an FZCO — it is just the label DMCC, Dubai South and a few other zones print on the licence. Go by the licence wording."},
  {value:"Free Zone — Branch",group:"Free Zone",hint:"A branch of a mainland or foreign company registered inside a free zone. Being in a zone does not by itself give it the 0% rate."},
  {value:"Free Zone — Freelance Permit",group:"Free Zone",hint:"An individual permit, not a company. Corporate tax only bites once business turnover passes AED 1 million in a calendar year."},
  {value:"DIFC — Company",group:"Financial free zone (own registrar and courts)",hint:"Dubai International Financial Centre company. Its own companies law and filing calendar — do not treat it like a Dubai mainland LLC."},
  {value:"DIFC — Branch",group:"Financial free zone (own registrar and courts)",hint:"A branch registered with the DIFC registrar rather than an Economic Department."},
  {value:"ADGM — Company",group:"Financial free zone (own registrar and courts)",hint:"Abu Dhabi Global Market company. Common-law rules and its own registrar, separate from Abu Dhabi mainland."},
  {value:"ADGM — Branch",group:"Financial free zone (own registrar and courts)",hint:"A branch registered with the ADGM registrar."},
  {value:"Offshore — JAFZA Offshore",group:"Offshore (cannot trade inside the UAE)",hint:"A Jebel Ali offshore holding company. No UAE trading, no office, no visas — usually just holds shares or property."},
  {value:"Offshore — RAK ICC",group:"Offshore (cannot trade inside the UAE)",hint:"A Ras Al Khaimah International Corporate Centre company. Holding and asset ownership only."},
  {value:"Offshore — Ajman Offshore",group:"Offshore (cannot trade inside the UAE)",hint:"An Ajman offshore holding company. Same restriction — it cannot trade or invoice within the UAE."},
  {value:"Foundation",group:"Other structures",hint:"A DIFC, ADGM or RAK ICC foundation. It has no shareholders — it is used to hold assets and plan succession."},
  {value:"Trust",group:"Other structures",hint:"A trust arrangement rather than a company. Choose this only when the instrument is actually a trust deed."},
  {value:"Partnership (General or Limited)",group:"Other structures",hint:"A partnership registered as such. General partners carry unlimited liability; limited partners do not."},
  {value:"Non-profit / Association",group:"Other structures",hint:"An association, society or non-profit body. Corporate tax may be exempt, but only once the exemption is actually granted."},
  {value:"Natural Person (individual licence)",group:"Other structures",hint:"An individual doing business in their own name. They register for corporate tax only if business turnover crosses AED 1 million in a calendar year."},
  {value:"Not Recorded",group:"Other structures",hint:"Use only as a placeholder when the trade licence has not been seen yet. Anything sitting here should be fixed before the first filing."}
];
const ENTITY_TYPES=ENTITY_TYPE_CATALOGUE.map(e=>e.value);
// The four labels used before this catalogue existed, plus the spellings that
// turn up in Excel imports, so old rows and old templates still load.

function normalizeEntityType(raw){
  const s=String(raw==null?"":raw).trim();
  if(!s)return"";
  const exact=ENTITY_TYPES.find(v=>v.toLowerCase()===s.toLowerCase());
  if(exact)return exact;
  const loose=s.toLowerCase().replace(/—/g,"-").replace(/\s+/g," ");
  const byDash=ENTITY_TYPES.find(v=>v.toLowerCase().replace(/—/g,"-").replace(/\s+/g," ")===loose);
  if(byDash)return byDash;
  return LEGACY_ENTITY_ALIASES[s.toLowerCase()]||"";
}

// Starting URLs for the portals we ship by default. Each credential stores its
// own editable url, so these are only a first guess — FTA in particular moves
// its login page around, and the field is there to be corrected.
// EmaraTax lands on #/Logon, which offers UAE PASS and a "Login here" link.
// The email/password form mounts in place when that link is clicked and the FTA
// gives it no URL of its own, so this is as close as a link can get.
const PORTAL_URLS={"FTA Portal":"https://eservices.tax.gov.ae/#/Logon","Zoho Books":"https://books.zoho.com/"};
function portalUrlFor(lg){return (lg&&lg.url)||PORTAL_URLS[lg&&lg.name]||"";}

// ---- Launch & fill -------------------------------------------------------
// A web page can't type into a form on another origin — that rule is what stops
// any site reading your bank login — so this hands the job to our own browser
// extension, the BCL Compliance Companion in extension/. We post a message, its
// bridge forwards it to the extension's service worker, and that opens the tab
// and fills the fields.
//
// The extension fills the fields and stops. It does not press Login: UAE portals
// put a captcha or security code beside the password, so submitting stays with
// the user.
//
// The data-bcl-tracker marker the extension looks for is on the root element in
// the static markup above, and has to stay there — see the comment on it.
function extensionPresent(){return !!window.__BCL_TRACKER_EXT__;}

function launchPortal(cid,idx){
  const sc=getClient(cid); if(!sc) return;
  const lg=sc.logins&&sc.logins[idx]; if(!lg) return;
  const url=portalUrlFor(lg);
  const note=document.getElementById(`launchNote_${cid}_${idx}`);
  const say=(html,kind)=>{if(!note)return;note.style.display='block';note.innerHTML=`<div class="alert ${kind||''}" style="margin:0;font-size:11px">${html}</div>`;};

  if(!url){say('Add the portal URL first.','alert-warning');return;}
  if(!/^https?:\/\//i.test(url)){say('The portal URL needs to start with https://','alert-warning');return;}

  if(!extensionPresent()){
    // Without the extension we can still open the portal — just not fill it.
    // Say so plainly rather than opening a tab and looking broken.
    window.open(url,'_blank','noopener');
    say('Opened the portal, but nothing was filled — the <b>BCL Compliance Companion</b> extension isn\'t loaded in this browser. Install it once from the <code>extension</code> folder of this repo (chrome://extensions → Developer mode → Load unpacked), reload this page, and the fields will fill themselves.','alert-warning');
    return;
  }

  window.postMessage({source:'bcl-compliance-tracker',type:'BCL_LAUNCH',payload:{url:url,username:lg.username||'',password:lg.password||''}},window.location.origin);

  // EmaraTax opens on a UAE PASS screen that has no email/password fields at
  // all — they only mount after "Login here" is clicked, and the FTA gives that
  // view no URL of its own, so we can't land on it directly. The extension
  // watches the page for five minutes, so the fields fill the moment they
  // appear; the user just needs to know to click through first.
  const isEmaraTax=/tax\.gov\.ae/i.test(url);
  say(isEmaraTax
    ? `Opening <b>${esc(lg.name)}</b>. On the FTA page click <b>“Login here”</b> under “Non UAE PASS users may” — the email and password fill themselves as soon as that form appears. Then enter the security code and press Login.`
    : `Opening <b>${esc(lg.name)}</b> and filling the credentials. Solve any captcha and press Login yourself.`);
}

async function loadData(){

// Serialize saves so a fast sequence of state mutations (e.g. bulk-import
// finish + a follow-up edit) can't race and clobber each other's blobs.
let _savePending = Promise.resolve();
async function saveData(d){
  const attempt = _savePending.then(async ()=>{
    let r;
    try {
      r = await fetch('/api/tracker', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(d)
      });
    } catch(networkErr){
      console.error('Save network error:', networkErr);
      alert('Could not reach the server to save your changes. Your data has NOT been saved. Check your connection and try again.');
      throw networkErr;
    }
    if(!r.ok){
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); if(j && j.error) msg = j.error; } catch(_){}
      console.error('Save failed:', msg);
      alert('Save failed: ' + msg + '\n\nYour changes are NOT saved. Please retry or refresh — the previous version is still safely stored.');
      throw new Error(msg);
    }
  });
  _savePending = attempt.catch(()=>{}); // don't let a rejection poison the chain
  return attempt;
}

function persistState(){ saveData({ clients: state.clients, teamMembers: state.teamMembers }); }

// Role helpers
// Three roles, labelled the same way as AutoLedger so the two tools read alike.
//   super_admin  Super Admin  the manager — every client, every team, all settings
//   admin        Admin        a team lead — their own team's clients and overview
//   user         User         an executive — their own clients
const ROLE_LABEL={super_admin:'Super Admin',admin:'Admin',user:'User'};
const ROLE_RANK={super_admin:3,admin:2,user:1};
// Legacy accounts predate this model; treat anything unrecognised as the least
// privileged rather than the most.
function roleOf(u){const r=(u&&u.role)||'';if(ROLE_RANK[r])return r;if(r==='member'||r==='staff')return 'user';if(r==='team-lead')return 'admin';return 'user';}
function roleLabel(u){return ROLE_LABEL[roleOf(u)]||'User';}
function atLeast(role){return ROLE_RANK[roleOf(currentUser)]>=ROLE_RANK[role];}
// The manager. Firm-wide settings and everything-at-once views.
function isSuperAdmin(){ return !!currentUser && roleOf(currentUser)==='super_admin'; }
// A lead or the manager — the management views. What DATA they get back is
// scoped server-side by the reporting line, so this only decides what's on screen.
function isAdmin(){ return !!currentUser && atLeast('admin'); }
function getVisibleClients(){ 
  if(isAdmin()) return state.clients;
  if(!currentUser) return [];
  return state.clients.filter(c => c.assignedTeam === currentUser.name);
}

// Check if accounting is complete for the specific months covered by a VAT period
// Period label format: "Mar-May 2026", "Dec-Feb 2026/27", "Jun-Aug 2026"
function getVatPeriodMonths(periodLabel){
  const mnMap={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const m=periodLabel.match(/(\w{3})-(\w{3})\s+(\d{4})/i);
  if(!m)return[];
  const startM=mnMap[m[1].toLowerCase()];
  const endM=mnMap[m[2].toLowerCase()];
  const yr=parseInt(m[3]);
  if(!startM||!endM)return[];
  const months=[];
  if(startM<=endM){
    for(let i=startM;i<=endM;i++)months.push(`${yr}-${String(i).padStart(2,'0')}`);
  } else {
    // Cross-year: e.g., Dec-Feb → Dec of yr, Jan-Feb of yr+1
    for(let i=startM;i<=12;i++)months.push(`${yr}-${String(i).padStart(2,'0')}`);
    // Check if label has "2026/27" format
    const yrMatch=periodLabel.match(/(\d{4})\/(\d{2})/);
    const nextYr=yrMatch?parseInt(yrMatch[1])+1:yr+1;
    for(let i=1;i<=endM;i++)months.push(`${nextYr}-${String(i).padStart(2,'0')}`);
  }
  return months;
}

// Is this 'YYYY-MM' month earlier than the client's engagement start?
// Both are zero-padded 'YYYY-MM', so a string compare is a date compare.
function isBeforeScope(client,monthKey){
  const s=client&&client.scopeStart;
  if(!s)return false;
  return monthKey<s;
}

// The engagement-start selector needs a label ("Apr 2025") different from its
// stored value ("2025-04"), which the shared selectHTML can't do — it uses the
// option's own text as the value.
function scopeStartSelectHTML(sc,fy){
  const y=parseInt(fy);
  const cur=sc.scopeStart||"";
  let opts=`<option value=""${cur===""?" selected":""}>— not set —</option>`;
  for(let i=0;i<12;i++){
    const key=`${y}-${String(i+1).padStart(2,'0')}`;
    opts+=`<option value="${key}"${key===cur?" selected":""}>${MONTHS[i]} ${y}</option>`;
  }
  return`<select class="form-input" data-action="changeScopeStart" data-cid="${sc.id}" style="padding:5px 8px;font-size:12px;max-width:200px">${opts}</select>`;
}

// Note there is deliberately no "apply" step that writes "Not Applicable" into
// the months before the start. scopeStart is the single source of truth and the
// stored month statuses are never touched, so setting the date is completely
// reversible: pick the wrong month, correct it, and every status is still there.
// An earlier version did overwrite them, which silently destroyed a "Completed"
// month and could not put it back. Display, completion % and the VAT readiness
// check all read through isBeforeScope() instead.

function checkPeriodAccounting(client, periodLabel){
  const keys=getVatPeriodMonths(periodLabel);
  if(!keys.length)return{complete:false,pending:[],total:0};
  const pending=[];
  // A month outside our scope, or explicitly Not Applicable, is not something
  // we owe — so it must not hold a VAT return open. Only months we're actually
  // responsible for count toward the period being ready.
  const inScope=keys.filter(k=>!isBeforeScope(client,k)&&client.accounting.monthlyStatus[k]!=="Not Applicable");
  inScope.forEach(k=>{
    if(client.accounting.monthlyStatus[k]!=="Completed")pending.push(k);
  });
  return{complete:pending.length===0,pending,total:inScope.length,done:inScope.length-pending.length};
}

function formatMonthKey(k){
  const p=k.split("-");
  return MONTHS[parseInt(p[1])-1]+" "+p[0];
}
// 4) Generate months for a financial year
function getFYMonths(fy){
  const y=parseInt(fy);
  return MONTHS.map((m,i)=>({month:m,year:y,key:`${y}-${String(i+1).padStart(2,'0')}`,label:`${m} ${y}`}));
}

// ═══════════════════════════════════════════════════════════════
// METRICS
// ═══════════════════════════════════════════════════════════════
function calcMetrics(c){
  // Only months we're actually engaged for count: skip anything before the
  // client's scope start, and anything explicitly marked Not Applicable.
  const acctEntries=Object.entries(c.accounting.monthlyStatus).filter(([k,v])=>!isBeforeScope(c,k)&&v!=="Not Applicable");
  const acctDone=acctEntries.filter(([,v])=>v==="Completed").length;
  // No months in scope means nothing is outstanding, so 100% — which is what
  // keeps the figure consistent with an empty pending list.
  const acctPct=acctEntries.length?Math.round(acctDone/acctEntries.length*100):100;
  const acctPending=acctEntries.filter(([,v])=>v!=="Completed").map(([k])=>{const p=k.split("-");return MONTHS[parseInt(p[1])-1]+" "+p[0];});
  const acctBlocked=acctEntries.some(([,v])=>v==="Blocked");

  const mandDocs=DOCS_LIST.filter(d=>d.mandatory).map(d=>d.name);
  const docsRecv=mandDocs.filter(n=>c.documents[n]==="Received"||c.documents[n]==="N/A").length;
  const docsPct=Math.round(docsRecv/mandDocs.length*100);
  const docsMissing=mandDocs.filter(n=>c.documents[n]!=="Received"&&c.documents[n]!=="N/A");

  const loginsOk=c.logins.filter(l=>l.enabled&&l.username).length;
  const loginsTotal=c.logins.length||1;
  const loginsPct=Math.round(loginsOk/loginsTotal*100);

  const vatIsYes=c.vatApplicable==="Yes";
  const vatIsPending=c.vatApplicable&&c.vatApplicable.startsWith("Pending");
  let vatPct=0;
  if(vatIsYes&&c.vat.returnDates.length>0)vatPct=Math.round(c.vat.returnDates.filter(r=>r.filingStatus==="Completed").length/c.vat.returnDates.length*100);
  const ctPct=c.ct.status==="Completed"?100:c.ct.status==="In Progress"?50:0;
  const totalPct=Math.round((acctPct*35+vatPct*25+ctPct*15+docsPct*15+loginsPct*10)/100);

  const acctStatus=acctBlocked?"Blocked":acctPct===100?"Completed":acctPct>0?"In Progress":"Not Started";
  const vatStatus=c.vatApplicable==="No"?"Not Applicable":vatIsPending?"Blocked":vatPct===100&&c.vat.returnDates.length>0?"Completed":vatPct>0?"In Progress":"Not Started";
  const ctStatus=!c.ctApplicable?"Not Applicable":c.ct.status;
  const docsStatus=docsPct===100?"Completed":docsPct>0?"In Progress":"Not Started";
  const loginsStatus=loginsPct===100&&c.logins.length>0?"Completed":loginsPct>0?"In Progress":"Not Started";

  const all=[acctStatus,vatStatus,ctStatus,docsStatus,loginsStatus];
  let overallStatus;
  if(all.some(s=>s==="Blocked"))overallStatus="Blocked";
  else if(all.filter(s=>s!=="Not Applicable").every(s=>s==="Completed"))overallStatus="Completed";
  else if(all.some(s=>s==="In Progress"||s==="Completed"))overallStatus="In Progress";
  else overallStatus="Not Started";

  const deadlines=[];
  if(vatIsYes)c.vat.returnDates.forEach(r=>{if(r.filingStatus!=="Completed"){const d=daysUntil(r.dueDate);deadlines.push({label:`VAT: ${r.period}`,date:r.dueDate,days:d,type:"vat"});}});
  if(c.ctApplicable&&c.ct.status!=="Completed"){const d=daysUntil(c.ct.dueDate);deadlines.push({label:`CT FY${c.ct.financialYear}`,date:c.ct.dueDate,days:d,type:"ct"});}
  deadlines.sort((a,b)=>(a.days??999)-(b.days??999));

  const warnings=[];
  if(vatStatus==="Completed"&&acctStatus!=="Completed")warnings.push("VAT completed but Accounting incomplete");
  if(ctStatus==="Completed"&&acctStatus!=="Completed")warnings.push("CT completed but Accounting incomplete");
  const brs=c.blockedReasons||{};
  if(acctBlocked){const blockedMonths=Object.entries(c.accounting.monthlyStatus).filter(([,v])=>v==="Blocked").map(([k])=>{const p=k.split("-");const reason=brs[`acct_${k}`];return MONTHS[parseInt(p[1])-1]+(reason?` (${reason})`:'');});warnings.push("Accounting blocked: "+blockedMonths.join(", "));}
  if(docsMissing.length>0)warnings.push(`${docsMissing.length} mandatory doc(s) pending`);
  if(vatIsPending)warnings.push("VAT: "+c.vatApplicable);
  if(c.ct&&c.ct.status==="Blocked"){const r=brs.ct;warnings.push("CT blocked"+(r?": "+r:""));}

  return{acctPct,acctPending,acctStatus,acctBlocked,vatPct,vatStatus,ctPct,ctStatus,docsPct,docsMissing,docsStatus,loginsPct,loginsStatus,totalPct,overallStatus,deadlines,warnings};
}

// RENDER
// ═══════════════════════════════════════════════════════════════
// ---- Render coalescing ----
// Many async loaders call render() when they resolve. If two fire in the same
// tick they used to rebuild the DOM twice in quick succession, which made
// clicks miss their targets. We batch all render() calls within one animation
// frame into a single rebuild.
// ═══════════════════════════════════════════════════════════════
// Async loader helpers
// ═══════════════════════════════════════════════════════════════
// Every async loader used to look like:
//   try{ bucket.field = await apiJSON(url); render(); }catch(e){ console.error(e); }
// which left bucket.field null on failure. The render function checks
// `!bucket.field` to schedule the loader — so an API error meant the render
// re-scheduled the loader forever, spinner locked. _load stamps a sentinel
// error object on failure so the check flips false and the loop stops.
async function _load(bucket, key, endpoint){
  try{
    bucket[key] = await apiJSON(endpoint);
  }catch(e){
    console.error('Load failed for', endpoint, e);
    bucket[key] = {_error: (e && e.message) || 'Failed to load'};
  }
  render();
}
// Placeholder shown when a loader errored. Render sites call this after their
// existing "Loading…" check so the error is visible instead of a spinner OR
// a fatal render crash reading .rows/.scores off the error object.
function _isLoadErr(v){ return v && typeof v==='object' && '_error' in v; }
function renderLoaderError(v, icon, title){
  const msg = (v && v._error) || 'Failed to load';
  return `<div class="empty-state"><div class="empty-state-icon">${icon||'⚠️'}</div><div class="empty-state-title">${esc(title||'Failed to load')}</div><div class="empty-state-text">${esc(msg)}</div></div>`;
}

let _renderQueued=false, _renderInProgress=false;
// Snapshot of the last-rendered navigation context. Lets us tell "same view,
// just re-rendered from a state change" apart from "user switched tabs/clients".
// Only same-view re-renders should restore the previous .main scroll offset;
// otherwise a new tab inherits an unrelated Y and looks broken.
let _lastRenderCtx={activeTab:null,selectedClientId:null,detailTab:null};
// Renders are coalesced into one pass per frame, but the scheduling has to
// survive a backgrounded tab.
//
// The previous version queued on requestAnimationFrame alone and returned
// early whenever _renderQueued was set. Browsers pause rAF in a background
// tab, so switching away while something was loading left the flag set with
// no callback coming — and because every later render() saw the flag and
// returned, the UI stopped updating for the rest of the session. It looked
// like the app had hung; only a reload cleared it. A timer is not throttled
// the same way, so both are armed and whichever fires first does the work.
//
// A render requested while one is running is also queued now rather than
// dropped on the floor, which was the same class of silent loss.
function render(){
  if(_renderQueued) return;   // one is already scheduled — it will pick up the latest state
  _renderQueued=true;
  requestAnimationFrame(_renderFlush);
  setTimeout(_renderFlush,250);
}
function _renderFlush(){
  if(!_renderQueued) return;          // whichever of rAF/timeout got here first already ran
  if(_renderInProgress) return;       // leave it queued; the finally below reschedules
  _renderQueued=false;
  _renderInProgress=true;
  try{ _renderImpl(); }
  finally{
    _renderInProgress=false;
    if(_renderQueued) setTimeout(_renderFlush,0);
  }
}
// Capture the currently focused input/textarea/select so an incidental
// render (loader finishing, metric refresh, etc.) doesn't yank the caret
// out from under the user mid-typing. Restored after the innerHTML swap.
function _captureFocus(app){
  const el = document.activeElement;
  if(!el || el === document.body || !app.contains(el)) return null;
  const tag = el.tagName;
  if(tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return null;
  const info = { tag };
  if(el.id) info.id = el.id;
  if(el.dataset && el.dataset.action) info.action = el.dataset.action;
  if(el.name) info.name = el.name;
  if(!info.id && !info.action && !info.name) return null; // no way to find it again
  try { info.selStart = el.selectionStart; info.selEnd = el.selectionEnd; } catch(_) {}
  return info;
}
function _restoreFocus(app, info){
  if(!info) return;
  let sel;
  if(info.id) sel = '#' + (window.CSS && CSS.escape ? CSS.escape(info.id) : info.id);
  else if(info.action) sel = '[data-action="' + info.action + '"]';
  else sel = info.tag + '[name="' + info.name + '"]';
  const el = app.querySelector(sel);
  if(!el) return;
  try {
    el.focus({preventScroll: true});
    if(typeof info.selStart === 'number'){
      el.selectionStart = info.selStart;
      el.selectionEnd = (typeof info.selEnd === 'number') ? info.selEnd : info.selStart;
    }
  } catch(_){}
}

function _renderImpl(){
  try{
    refreshMetrics();
    const app=document.getElementById("app");if(!app)return;

    // Capture scroll positions of both the main content AND the left sidebar
    // before we blow away #app.innerHTML. Restoring the sidebar prevents the
    // "click a low tab, sidebar snaps back to top" bug.
    const mainEl=app.querySelector(".main");
    const sideNavEl=app.querySelector(".side-nav");
    const clientSidebarEl=app.querySelector(".sidebar");
    const mainScroll=mainEl?mainEl.scrollTop:0;
    const sideNavScroll=sideNavEl?sideNavEl.scrollTop:0;
    const clientSidebarScroll=clientSidebarEl?clientSidebarEl.scrollTop:0;
    const focusInfo=_captureFocus(app);

    const sc=state.selectedClientId?getClient(state.selectedClientId):null;
    const scm=sc?metricsCache[sc.id]:null;
    if(state.selectedClientId&&!sc)state.selectedClientId=null;

    const nextCtx={
      activeTab:state.activeTab||null,
      selectedClientId:sc?sc.id:null,
      detailTab:sc?(state.detailTab||null):null
    };
    const sameView=(
      _lastRenderCtx.activeTab===nextCtx.activeTab &&
      _lastRenderCtx.selectedClientId===nextCtx.selectedClientId &&
      _lastRenderCtx.detailTab===nextCtx.detailTab
    );

    let h=renderHeader();h+=`<div class="body-wrap">`;
    if(sc&&scm){h+=renderSidebar(sc,scm);h+=`<div class="main">${renderDetail(sc,scm)}</div>`;}
    else {h+=renderMainNavSidebar();h+=`<div class="main">${renderMain()}</div>`;}
    h+=`</div>`;
    if(state.showModal==="addClient")h+=renderAddModal();
    if(state.showModal==="opsMkt")h+=renderOpsMktModal();
    if(state.showModal==="addVatReturn")h+=renderAddVatReturnModal();
    if(state.showModal==="addCredential")h+=renderAddCredentialModal();

    app.innerHTML=h;bindEvents();

    // Restore scroll positions after re-render.
    // .main is restored ONLY on same-view re-renders — a new tab/client
    // shouldn't inherit the previous view's scroll offset.
    // .side-nav and .sidebar are always restored so the user's place in the
    // nav list is never lost, regardless of what they clicked.
    const newSideNavEl=app.querySelector(".side-nav");
    if(newSideNavEl&&sideNavScroll>0)newSideNavEl.scrollTop=sideNavScroll;
    const newClientSidebarEl=app.querySelector(".sidebar");
    if(newClientSidebarEl&&clientSidebarScroll>0)newClientSidebarEl.scrollTop=clientSidebarScroll;
    if(sameView){
      const newMainEl=app.querySelector(".main");
      if(newMainEl&&mainScroll>0)newMainEl.scrollTop=mainScroll;
    }
    // Put the user's caret back where it was — this is what stops the search
    // box (and other inputs) from losing focus after every keystroke when a
    // background loader completes and triggers a render.
    _restoreFocus(app, focusInfo);
    _lastRenderCtx=nextCtx;

  }catch(err){
    console.error(err);
    document.getElementById("app").innerHTML=`<div style="padding:40px;color:var(--red);font-family:var(--mono)"><pre>${err.message}\n${err.stack}</pre></div>`;
  }
}

// Insights menu — admin-only tabs grouped under a single dropdown to keep the
// main nav clean. Each entry is [tabKey, label, icon].
// Client Health and Exceptions folded into Risk Center as sub-tabs; Documents
// dropped from the sidebar (still reachable via /documents; Priority Queue
// surfaces pending docs directly).
// Trimmed 2026-09-03 from four entries to one.
//
// Portfolio (client tiering plus five invented scores), Risk Center (nine
// sub-tabs asking what Today already answers) and Team Analytics (capacity
// planning and 30-day forecasting for a nine-person team) were all built ahead
// of the data and answered questions nothing was recording. The code is still
// in the tree and the routes still work — only the sidebar entries are gone —
// so any of them can come back the moment there's a reason.
//
// Reports / MIS stays: it's the monthly pack that goes to clients.
// ---- Updates -------------------------------------------------------------
// The page is served from a Lambda and cached by the browser, so somebody can
// sit on a tab for days and never see a deploy. We stamp the build into
// version.json at deploy time, read it once at boot to fix what this page IS,
// then poll. When the deployed sha stops matching the one we loaded with, the
// running page is out of date and the sidebar says so.
//
// Nothing reloads on its own — losing half-typed work to a surprise refresh is
// worse than running a build that's an hour old. The user presses the button.
const versionState={
  loaded:null,        // the build this page was served from — never changes
  latest:null,        // what the server reports now
  commits:[],
  updateAvailable:false,
  checkedAt:null,
  seenKey:'uct_last_seen_sha'
};

async function readVersion(){
  try{
    const r=await fetch('/version.json?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

async function checkVersion(){
  const v=await readVersion();
  if(!v) return;
  versionState.checkedAt=new Date().toISOString();
  versionState.commits=Array.isArray(v.commits)?v.commits:[];
  versionState.latest=v;
  // The first successful read defines the build we are running. Every later
  // read is compared against it.
  if(!versionState.loaded){ versionState.loaded=v; return; }
  const was=versionState.updateAvailable;
  versionState.updateAvailable=!!(v.sha&&versionState.loaded.sha&&v.sha!==versionState.loaded.sha);
  if(versionState.updateAvailable!==was) render();
}

function startVersionWatch(){
  checkVersion();
  // Every five minutes. A deploy takes about a minute, so this is soon enough
  // to be useful without pestering the server.
  setInterval(checkVersion, 5*60*1000);
}

// Commits shipped since the build this page is running — what "new" means.
function commitsSinceLoaded(){
  const all=versionState.commits||[];
  const mine=versionState.loaded&&versionState.loaded.sha;
  if(!mine) return all;
  const i=all.findIndex(c=>c.sha===mine);
  return i<=0?(i===0?[]:all):all.slice(0,i);
}

function renderUpdates(){
  const v=versionState.latest;
  const fresh=commitsSinceLoaded();
  const upd=versionState.updateAvailable;
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:4px">Updates</h2>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">What has changed in the tracker, newest first.</div>`;

  if(!v){
    return h+`<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-title">Checking…</div></div>`;
  }

  if(upd){
    h+=`<div class="card" style="border-color:var(--accent);background:var(--accent-soft);margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <div>
          <div style="font-weight:800;font-size:15px">A newer version is ready</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
            ${fresh.length?`${fresh.length} change${fresh.length===1?'':'s'} since this page was opened.`:'This page is running an older build.'}
            Reloading is safe — finish anything half-typed first.
          </div>
        </div>
        <button class="btn btn-primary" data-action="applyUpdate">Update now</button>
      </div></div>`;
  }else{
    h+=`<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div><div style="font-weight:700">You are up to date</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px">Version <span style="font-family:var(--mono)">${esc(v.shortSha||'dev')}</span>${v.deployedAt?` · deployed ${fmtDateTime(v.deployedAt)}`:''}</div></div>
      <button class="btn btn-sm" data-action="checkUpdate">Check again</button>
    </div>`;
  }

  const list=(versionState.commits||[]).slice(0,30);
  if(!list.length){
    h+=`<div class="card" style="color:var(--text-muted);font-size:13px">No change history available for this build.</div>`;
    return h;
  }

  const mine=versionState.loaded&&versionState.loaded.sha;
  let seenOwn=false;
  h+=`<div class="card" style="padding:0;overflow:hidden"><div style="display:grid">`;
  list.forEach((c,i)=>{
    const isRunning=c.sha===mine;
    const isNew=!seenOwn&&!isRunning&&!!mine;
    if(isRunning) seenOwn=true;
    h+=`<div style="padding:12px 16px;${i?'border-top:1px solid var(--border);':''}${isNew?'background:var(--accent-soft)':''}">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
        ${isNew?`<span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:.06em">NEW</span>`:''}
        <span style="font-size:13.5px;flex:1;min-width:200px">${esc(c.subject||'')}</span>
        <span style="font-size:11px;color:var(--text-muted);font-family:var(--mono)">${c.date?fmtDate(String(c.date).slice(0,10)):''}</span>
      </div>
      ${isRunning?`<div style="font-size:10px;color:var(--text-muted);margin-top:3px">— you are running this version —</div>`:''}
    </div>`;
  });
  h+=`</div></div>`;
  return h;
}

    msg=`${stranded} name${stranded===1?'':'s'} hold${stranded===1?'s':''} clients but cannot sign in.`;
  }
  return `<div class="card" style="margin-bottom:14px;border-color:var(--amber-border);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div style="font-size:20px">⚖️</div>
    <div style="flex:1;min-width:220px;font-size:13px;line-height:1.5">${msg}</div>
    <button class="btn btn-sm" data-nav="workload">Balance the month</button>
  </div>`;
}

function renderMorningDashboard(){
  if(!isAdmin()) return renderPriorityQueue();
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); }
  if(!state.morning){ setTimeout(loadMorningDashboard,0); return `<div class="empty-state"><div class="empty-state-icon">☕</div><div class="empty-state-title">Composing morning briefing…</div></div>`; }
  if(_isLoadErr(state.morning)) return renderLoaderError(state.morning, '⚠️', 'Failed to load morning briefing');
  const d=state.morning;
  const ageSec=Math.floor((Date.now()-new Date(d.generatedAt).getTime())/1000);
  // The page used to stack eight sections of equal weight, so on a quiet day
  // it said "nothing to do" three separate times and on a busy one it gave no
  // clue what to open first. It now answers one question at the top — does
  // anything need me today — backs it with three numbers that drive action,
  // then the work itself. Everything that is context rather than action moved
  // below a fold.
  const dl=d.deadlines||{};
  const th=(d.teamHealth&&d.teamHealth.totals)||{};
  const overdue=dl.overdueCount||0, dueToday=dl.todayCount||0, next7=dl.next7Count||0;
  const blocked=th.blockedWork||0, reviews=th.pendingReviews||0;
  const needsMe=overdue+dueToday+blocked+reviews;

  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div><div style="font-size:20px;font-weight:800">${greetingFor()}</div>
    <div style="font-size:11px;color:var(--text-muted)">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}${Number.isFinite(ageSec)?' · refreshed '+(ageSec<60?ageSec+'s':Math.floor(ageSec/60)+'m')+' ago':''}</div></div>
    <button class="btn btn-sm" id="mb-refresh">↻ Refresh</button>
  </div>`;

  // ---- The answer, in one line.
  const verdict = overdue
    ? {t:overdue+' filing'+(overdue===1?' is':'s are')+' already past due',s:'Start here — everything else can wait.',c:'var(--red)',i:'🔴'}
    : (dueToday
      ? {t:dueToday+' thing'+(dueToday===1?'':'s')+' due today',s:blocked?blocked+' other item'+(blocked===1?' is':'s are')+' blocked and waiting on someone.':'Nothing overdue.',c:'var(--amber)',i:'🟠'}
      : (needsMe
        ? {t:needsMe+' item'+(needsMe===1?'':'s')+' need attention',s:'Nothing overdue and nothing due today.',c:'var(--blue)',i:'🔵'}
        : {t:'Nothing needs you today',s:next7?next7+' item'+(next7===1?'':'s')+' due later this week.':'Nothing due this week either.',c:'var(--green)',i:'✅'}));
  h+=`<div class="card" style="margin-bottom:14px;border-color:${verdict.c}">
    <div style="display:flex;gap:14px;align-items:center">
      <div style="font-size:26px;line-height:1">${verdict.i}</div>
      <div><div style="font-size:17px;font-weight:800;color:${verdict.c};line-height:1.35">${esc(verdict.t)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:3px">${esc(verdict.s)}</div></div>
    </div></div>`;

  // ---- The four numbers that decide what to do next. Clickable, because a
  // number you cannot open is trivia.
  const tile=(n,label,colour,go)=>`<button class="card" data-mb-go="${go}" style="text-align:left;cursor:pointer;border-color:${n?colour:'var(--border)'};padding:14px 16px;background:var(--bg-card)">
    <div style="font-size:26px;font-weight:800;color:${n?colour:'var(--text-muted)'};line-height:1">${n}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:700">${label}</div></button>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px">
    ${tile(overdue,'Overdue','var(--red)','overdue')}
    ${tile(dueToday,'Due today','var(--amber)','overdue')}
    ${tile(next7,'Due this week','var(--blue)','overdue')}
    ${tile(blocked,'Blocked','var(--amber)','portfolio_action')}
  </div>`;

  // ---- Who is under pressure this month. Folded in here because it is the
  // other question a manager has every morning, and it was previously only
  // answerable by counting clients by hand.
  h+=renderTodayPressureStrip();

  // ---- The work itself.
  h+=`<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px">`;
  h+=renderMB_TodaysFocus(d.todaysFocus);
  h+=renderMB_ManagerActions(d.managerActions);
  h+=`</div>`;
  h+=renderMB_Deadlines(d.deadlines);
  h+=renderMB_ClientsAttention(d.clientsAttention);

  // ---- Context, not action. Present but out of the way, so the top of the
  // page stays about what to do next.
  h+=`<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:var(--text-muted);padding:8px 0">More detail — business health, filing readiness, team and risk</summary><div style="padding-top:10px">`;
  h+=renderMB_BusinessHealth(d.businessHealth);
  h+=renderMB_ReadinessChips(d.readinessCounts);
  h+=renderMB_TeamHealth(d.teamHealth);
  h+=renderMB_RiskSummary(d.riskSummary);
  h+=`</div></details>`;

  setTimeout(()=>{
    const r=document.getElementById('mb-refresh'); if(r) r.onclick=()=>{ state.morning=null; loadMorningDashboard(true); };
    // Click handlers for readiness chips → drill into Clients Overview with filter
    document.querySelectorAll('[data-mb-readiness]').forEach(b=>{ b.onclick=()=>{ state.filterReadiness=b.dataset.mbReadiness; state.activeTab='dashboard'; render(); }; });
    // Risk Summary tile click-throughs
    document.querySelectorAll('[data-mb-go]').forEach(b=>{ b.onclick=()=>{
      const target=b.dataset.mbGo;
      if(target==='portfolio_action'){ state.activeTab='portfolio'; portfolioState.subTab='action'; }
      else if(target==='risk_critical'){ state.activeTab='risk'; riskState.subTab='dashboard'; riskState.readinessFilter='All'; }
      else if(target==='risk_action'){ state.activeTab='risk'; riskState.subTab='action'; }
      else if(target==='overdue'){ state.activeTab='dashboard'; }
      render();
    }; });
  },0);
  return h;
}

  const tile=(label,val,suffix,color)=>`<div class="card" style="text-align:center"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em">${label}</div><div style="font-size:24px;font-weight:800;color:${color||'var(--text-primary)'};margin-top:2px">${val==null?'—':val}${suffix||''}</div></div>`;

  h+=tile('Active Clients',     b.totalActiveClients);
  h+=tile('Ready For Filing',   b.readyForFiling, '', 'var(--green)');

  return h;
}

function renderMB_TodaysFocus(tf){
  if(!tf) return '';

  let h=`<div class="card"><div class="card-title">🎯 Today's Focus (Top ${items.length})</div>`;
  if(!items.length){ h+=`<div style="padding:8px;font-size:12px;color:var(--text-muted)">Nothing requires immediate attention.</div></div>`; return h; }
  h+=`<div style="overflow:auto"><table style="width:100%;font-size:12px"><thead><tr style="text-align:left;color:var(--text-muted);font-weight:600"><th style="padding:4px">Client</th><th style="padding:4px">Issue</th><th style="padding:4px">Due</th><th style="padding:4px">Owner</th><th style="padding:4px">Recommended action</th></tr></thead><tbody>`;
  items.forEach(i=>{
    const due=i.dueDate?`<span style="color:${daysUntilLocal(i.dueDate)<0?'var(--red)':daysUntilLocal(i.dueDate)<=3?'var(--amber)':'var(--text-muted)'};font-weight:700">${i.dueDate}</span>`:'—';
    h+=`<tr style="cursor:pointer" data-client="${i.clientId}"><td style="padding:6px 4px"><b>${esc(i.clientName)}</b> ${tierBadgeMini(i.tier)}</td><td style="padding:6px 4px">${esc(i.issue)}</td><td style="padding:6px 4px">${due}</td><td style="padding:6px 4px;color:var(--text-muted)">${esc(i.assignedUser||'—')}</td><td style="padding:6px 4px;color:var(--accent)">${esc(i.recommendedAction||'')}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

function daysUntilLocal(d){ if(!d) return null; return Math.floor((new Date(d).getTime()-Date.now())/86400000); }

function renderMB_Deadlines(d){
  if(!d) return '';
  const tile=(label,n,color)=>`<div class="card" style="text-align:center;border-color:${color||'var(--border)'}"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${label}</div><div style="font-size:22px;font-weight:800;color:${color||'var(--text-primary)'}">${n||0}</div></div>`;
  let h=`<div class="card-title" style="margin-top:14px;margin-bottom:10px">⏰ Critical Deadlines</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px">`;
  h+=tile('Overdue',     d.overdueCount, 'var(--red)');
  h+=tile('Due Today',   d.todayCount,   d.todayCount>0?'var(--amber)':'var(--border)');
  h+=tile('Next 7 Days', d.next7Count);
  h+=tile('Next 14 Days',d.next14Count);
  h+=`</div>`;
  // By category breakdown (upcoming only)
  const cats=d.byCategory||{};
  h+=`<div class="card" style="padding:0;overflow:auto;margin-bottom:14px"><table style="width:100%;font-size:12px"><thead><tr style="text-align:left;color:var(--text-muted)"><th style="padding:6px">Category</th><th style="padding:6px">Count</th><th style="padding:6px">Earliest</th><th style="padding:6px">Latest</th></tr></thead><tbody>`;
  ['VAT','CT','Registration','Review','Client Approval','Other'].forEach(k=>{
    const list=cats[k]||[];
    if(!list.length) return;
    const dates=list.map(x=>x.dueDate).filter(Boolean).sort();
    h+=`<tr><td style="padding:6px;font-weight:600">${esc(k)}</td><td style="padding:6px">${list.length}</td><td style="padding:6px">${dates[0]||'—'}</td><td style="padding:6px">${dates[dates.length-1]||'—'}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  // Overdue detail (if any) — first 8 rows
  if(d.overdue && d.overdue.length){
    h+=`<div class="card" style="border-color:var(--red-border);margin-bottom:14px"><div class="card-title" style="color:var(--red)">Overdue (${d.overdueCount})</div><div style="overflow:auto"><table style="width:100%;font-size:12px"><tbody>`;
    d.overdue.slice(0,8).forEach(t=>{
      h+=`<tr data-task="${t.taskId}" style="cursor:pointer"><td style="padding:4px;font-weight:600">${esc(t.clientName)}</td><td style="padding:4px">${esc((t.taskType||'').replace(/_/g,' '))}</td><td style="padding:4px;color:var(--red)">${t.dueDate} (${-t.daysToDue}d overdue)</td><td style="padding:4px;color:var(--text-muted)">${esc(t.assignedUser||'—')}</td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
  }
  return h;
}

function renderMB_TeamHealth(t){
  if(!t) return '';
  const tot=t.totals||{};
  const tile=(label,val,color)=>`<div class="card" style="text-align:center"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${label}</div><div style="font-size:22px;font-weight:800;color:${color||'var(--text-primary)'}">${val||0}</div></div>`;
  let h=`<div class="card-title" style="margin-bottom:10px">👥 Team Health</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px">`;
  h+=tile('Total Open',      tot.totalOpenTasks);
  h+=tile('Overdue',         tot.overdueTasks, tot.overdueTasks>0?'var(--red)':'var(--text-primary)');
  h+=tile('Pending Reviews', tot.pendingReviews, tot.pendingReviews>5?'var(--amber)':'var(--text-primary)');
  h+=tile('Blocked',         tot.blockedWork, tot.blockedWork>0?'var(--red)':'var(--text-primary)');
  h+=tile('Open Escalations',tot.openEscalations, tot.openEscalations>0?'var(--red)':'var(--text-primary)');
  h+=`</div>`;
  if(t.byUser && t.byUser.length){
    h+=`<div class="card" style="padding:0;overflow:auto;margin-bottom:14px"><table style="width:100%;font-size:12px"><thead><tr style="text-align:left;color:var(--text-muted)"><th style="padding:6px">User</th><th style="padding:6px">Workload</th><th style="padding:6px">Open</th><th style="padding:6px">Overdue</th><th style="padding:6px">Reviews</th><th style="padding:6px">Blocked</th></tr></thead><tbody>`;
    t.byUser.forEach(u=>{
      const c=u.band==='overloaded'?'var(--red)':u.band==='underutilized'?'var(--blue)':'var(--green)';
      const pct=Math.min(150,(u.workloadRatio||0)*100);
      h+=`<tr><td style="padding:6px;font-weight:600">${esc(u.userName)}</td><td style="padding:6px;width:30%"><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;background:var(--bg-deep);height:6px;border-radius:3px;overflow:hidden"><div style="width:${Math.min(100,pct)}%;background:${c};height:100%"></div></div><span style="color:${c};font-weight:700;font-size:11px">${u.workloadRatio||0}</span></div></td><td style="padding:6px">${u.openTasks||0}/${u.capacity||'—'}</td><td style="padding:6px;color:${u.overdueTasks>0?'var(--red)':'var(--text-muted)'}">${u.overdueTasks||0}</td><td style="padding:6px">${u.awaitingReview||0}</td><td style="padding:6px">${u.blockedTasks||0}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  if(t.overloaded && t.overloaded.length){
    h+=`<div class="card" style="border-color:var(--red-border);margin-bottom:14px"><div class="card-title" style="color:var(--red)">⚠ Overloaded (${t.overloaded.length})</div><div style="font-size:12px">${t.overloaded.map(u=>esc(u.userName)+' (ratio '+u.workloadRatio+')').join(' · ')}</div></div>`;
  }
  return h;
}

const portfolioState={ subTab:'dashboard', dashboard:null, insights:null, alerts:null, actionList:null, sortBy:'overallRisk', sortDir:'desc' };

const TIER_META={ A:{ color:'var(--red)', label:'A · High Priority'}, B:{ color:'var(--accent)', label:'B · Standard'}, C:{ color:'var(--text-muted)', label:'C · Low Priority'} };
function tierBadge(tier){
  const m=TIER_META[tier]||TIER_META.B;
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${m.color};font-weight:700;font-size:11px">Tier ${esc(tier||'B')}</span>`;
}
function riskBandPill(band){
  const c={low:'var(--green)',medium:'var(--amber)',high:'var(--red)',critical:'var(--red)'}[band]||'var(--text-muted)';
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${c};font-weight:700;font-size:11px;text-transform:uppercase">${esc(band||'low')}</span>`;
}
function scorePill(score, lowIsBad){
  if(score==null) return `<span style="font-size:11px;color:var(--text-muted)">—</span>`;
  const good=lowIsBad? score>=70 : score<=30;
  const bad =lowIsBad? score<=30 : score>=70;
  const c=good?'var(--green)':bad?'var(--red)':'var(--amber)';
  return `<span style="font-weight:700;color:${c}">${score}</span>`;
}

function renderPortfolio(){
  const tabs=[['dashboard','Dashboard'],['action','Manager Action List'],['insights','Insights'],['alerts','Key Alerts']];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div class="nav" style="margin:0">`;
  tabs.forEach(([k,l])=>{ h+=`<button class="nav-btn ${portfolioState.subTab===k?'active':''}" data-pt="${k}">${l}</button>`; });
  h+=`</div>`;
  const exp=portfolioExportUrl(); if(exp) h+=`<button class="btn btn-sm" onclick="window.location.href='${exp}'">⬇ Export CSV</button>`;
  h+=`</div>`;
  switch(portfolioState.subTab){
    case 'dashboard': h+=renderPortfolioDashboard(); break;
    case 'action':    h+=renderPortfolioActionList(); break;
    case 'insights':  h+=renderPortfolioInsights(); break;
    case 'alerts':    h+=renderPortfolioAlerts(); break;

}
function portfolioExportUrl(){
  if(portfolioState.subTab==='dashboard') return '/api/portfolio/dashboard?format=csv';

  const TH=(key,label)=>`<th data-sort="${key}" style="cursor:pointer;user-select:none">${esc(label)}${portfolioState.sortBy===key?(portfolioState.sortDir==='asc'?' ▲':' ▼'):''}</th>`;

  });
  h+=`</tbody></table></div>`;

// PHASE 6 — MIS Reports
// ═══════════════════════════════════════════════════════════════
const reportsState={
  subTab:'summary', period:'month', value:null, options:null,
  summary:null, employees:null, clients:null, documents:null,
  vat:null, ct:null, escalations:null, workload:null, workloadSlice:'user',
  trends:{ filing_completion:null, sla_compliance:null, escalations:null },
  attention:null
};

function reportsExportUrl(path){
  const q=new URLSearchParams();
  if(reportsState.period) q.set('period', reportsState.period);
  if(reportsState.value)  q.set('value',  reportsState.value);
  q.set('format','csv');
  return path + (path.includes('?') ? '&' : '?') + q.toString();
}

async function loadReportsOptions(){
  if(reportsState.options) return;
  return _load(reportsState, 'options', '/api/reports/period-options');
}
function periodSelector(){
  loadReportsOptions();
  const opts=reportsState.options;
  if(!opts) return `<span style="font-size:12px;color:var(--text-muted)">Loading periods…</span>`;
  if(_isLoadErr(opts)) return `<span style="font-size:12px;color:var(--red)">${esc(opts._error||'Failed to load periods')}</span>`;
  const map={month:opts.months, quarter:opts.quarters, year:opts.years};
  const values=map[reportsState.period]||[];
  if(!reportsState.value) reportsState.value = values[0];
  let h=`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">`;
  ['month','quarter','year'].forEach(p=>{ h+=`<button class="btn btn-sm ${reportsState.period===p?'btn-primary':''}" data-rp="${p}">${p}</button>`; });
  h+=`<select class="form-input" id="rp-value" style="min-width:130px">`;
  values.forEach(v=>{ h+=`<option value="${v}" ${v===reportsState.value?'selected':''}>${v}</option>`; });
  h+=`</select>`;
  // This wrapper used to be left open. The caller's two closing tags then
  // landed one level too shallow, so the reports header flex row never closed
  // and every section of the report below it became a flex item inside it —
  // the tile grid collapsed to its 170px minimum and stacked into a narrow
  // column, leaving the page looking blank. It broke all seven report tabs
  // that show this selector.
  h+=`</div>`;
  return h;
}

function renderReports(){
  // Ten tabs down to six. Employees, Escalations, Workload and Trends all
  // needed months of history to say anything and were reporting on an empty
  // table; Trends in particular cannot trend a single month. Their renderers
  // and routes are untouched, so they return when there's history to show.
  const tabs=[
    ['summary','Monthly Summary'],['attention','Attention Required'],
    ['clients','Clients'],['documents','Documents'],
    ['vat','VAT'],['ct','CT']
  ];
  let h=`<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><div class="nav" style="margin:0">`;
  tabs.forEach(([k,l])=>{ h+=`<button class="nav-btn ${reportsState.subTab===k?'active':''}" data-rt="${k}">${l}</button>`; });
  h+=`</div>`;
  if(['summary','employees','clients','documents','vat','ct','escalations'].includes(reportsState.subTab)){
    h+=`<div style="margin-left:auto;display:flex;gap:8px;align-items:center">${periodSelector()}<button class="btn btn-sm" id="rp-export">⬇ Export CSV</button></div>`;
  }
  h+=`</div>`;
  switch(reportsState.subTab){
    case 'summary':     h+=renderReportSummary(); break;
    case 'attention':   h+=renderReportAttention(); break;
    case 'employees':   h+=renderReportEmployees(); break;
    case 'clients':     h+=renderReportClients(); break;
    case 'documents':   h+=renderReportDocuments(); break;
    case 'vat':         h+=renderReportCompliance('vat'); break;
    case 'ct':          h+=renderReportCompliance('ct'); break;
    case 'escalations': h+=renderReportEscalations(); break;
    case 'workload':    h+=renderReportWorkload(); break;
    case 'trends':      h+=renderReportTrends(); break;
  }
  setTimeout(()=>{
    document.querySelectorAll('[data-rt]').forEach(b=>{ b.onclick=()=>{ reportsState.subTab=b.dataset.rt; render(); }; });
    document.querySelectorAll('[data-rp]').forEach(b=>{ b.onclick=()=>{ reportsState.period=b.dataset.rp; reportsState.value=null; reportsClearCache(); render(); }; });
    const sel=document.getElementById('rp-value'); if(sel) sel.onchange=()=>{ reportsState.value=sel.value; reportsClearCache(); render(); };
    const exp=document.getElementById('rp-export'); if(exp) exp.onclick=()=>{ const url=reportsExportPath(); if(url) window.location.href=url; };
  },0);
  return h;
}
function reportsClearCache(){
  reportsState.summary=null; reportsState.employees=null; reportsState.clients=null;
  reportsState.documents=null; reportsState.vat=null; reportsState.ct=null; reportsState.escalations=null;
  reportsState.attention=null;
}
function reportsExportPath(){
  const map={ summary:'/api/reports/management-summary', employees:'/api/reports/employees', clients:'/api/reports/clients',
    documents:'/api/reports/document-delays', vat:'/api/reports/vat-compliance', ct:'/api/reports/ct-compliance',
    escalations:'/api/reports/escalations', workload:'/api/reports/workload?slice='+(reportsState.workloadSlice||'user'),
    attention:'/api/reports/attention-required?limit=50' };
  const base=map[reportsState.subTab]; if(!base) return null;
  return reportsExportUrl(base);
}
