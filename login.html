<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — UAE Compliance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#080b12;color:#e8ecf4;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#111722;border:1px solid #1c2538;border-radius:16px;padding:40px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.logo-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3d7aed,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#080b12}
.logo-text{font-weight:800;font-size:18px}.logo-sub{font-size:10px;color:#5a6578;text-transform:uppercase;letter-spacing:1px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:11px;font-weight:700;color:#5a6578;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px}
.form-input{width:100%;background:#0e1420;color:#e8ecf4;border:1px solid #1c2538;border-radius:8px;padding:12px 14px;font-size:14px;outline:none;transition:0.2s;font-family:inherit}
.form-input:focus{border-color:#3d7aed;box-shadow:0 0 0 3px rgba(61,122,237,0.15)}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:#3d7aed;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:0.2s;font-family:inherit}
.btn:hover{background:#2d6adc}.btn:disabled{opacity:0.5;cursor:not-allowed}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5}
.alert-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444}
.alert-success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#22c55e}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#5a6578}
.link{color:#3d7aed;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}.link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-mark">CT</div><div><div class="logo-text">UAE Compliance Tracker</div><div class="logo-sub">Accounting & Tax Ops</div></div></div>
  <div id="alertError" class="alert alert-error"></div>
  <div id="alertSuccess" class="alert alert-success"></div>

  <!-- LOGIN -->
  <form id="loginForm">
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="loginEmail" placeholder="you@yourfirm.com" required autofocus></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="loginPassword" placeholder="Enter password" required></div>
    <button class="btn" type="submit" id="loginBtn">Sign In</button>
    <div style="text-align:center;margin-top:14px"><span class="link" onclick="showForgot()">Forgot Password?</span></div>
  </form>

  <!-- FORGOT -->
  <form id="forgotForm" style="display:none">
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:28px;margin-bottom:8px">🔑</div><div style="font-size:15px;font-weight:700">Reset Password</div><div style="font-size:12px;color:#5a6578;margin-top:4px">Enter your email and we'll send a reset link</div></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="forgotEmail" placeholder="you@yourfirm.com" required></div>
    <button class="btn" type="submit" id="forgotBtn">Send Reset Link</button>
    <div style="text-align:center;margin-top:14px"><span class="link" onclick="showLogin()">← Back to Login</span></div>
  </form>

  <div class="footer">Secure access · Your data stays on your server</div>
</div>
<script>
function showError(m){const e=document.getElementById('alertError');e.textContent=m;e.style.display='block';document.getElementById('alertSuccess').style.display='none';}
function showSuccess(m){const e=document.getElementById('alertSuccess');e.innerHTML=m;e.style.display='block';document.getElementById('alertError').style.display='none';}
function hideAlerts(){document.getElementById('alertError').style.display='none';document.getElementById('alertSuccess').style.display='none';}
function showForgot(){hideAlerts();document.getElementById('loginForm').style.display='none';document.getElementById('forgotForm').style.display='block';document.getElementById('forgotEmail').value=document.getElementById('loginEmail').value;document.getElementById('forgotEmail').focus();}
function showLogin(){hideAlerts();document.getElementById('loginForm').style.display='block';document.getElementById('forgotForm').style.display='none';document.getElementById('loginEmail').focus();}

document.getElementById('loginForm').onsubmit=async(e)=>{e.preventDefault();hideAlerts();const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in...';
try{const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('loginEmail').value,password:document.getElementById('loginPassword').value})});const data=await res.json();if(res.ok){window.location.href='/';}else{showError(data.error||'Login failed');}}catch(ex){showError('Connection error');}
btn.disabled=false;btn.textContent='Sign In';};

document.getElementById('forgotForm').onsubmit=async(e)=>{e.preventDefault();hideAlerts();const btn=document.getElementById('forgotBtn');btn.disabled=true;btn.textContent='Sending...';
try{const res=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('forgotEmail').value})});const data=await res.json();
if(res.ok){let msg=data.message||'If that email exists, a reset link has been sent.';if(data.resetUrl)msg+=`<br><br><span style="font-size:11px;color:#8a95aa">Email failed. Copy this link:</span><br><input style="width:100%;margin-top:6px;padding:6px;background:#0e1420;border:1px solid #1c2538;border-radius:6px;color:#e8ecf4;font-size:11px" value="${data.resetUrl}" onclick="this.select()" readonly>`;showSuccess(msg);}else{showError(data.error||'Failed');}}catch(ex){showError('Connection error');}
btn.disabled=false;btn.textContent='Send Reset Link';};

const p=new URLSearchParams(window.location.search);
if(p.get('reset')==='success')showSuccess('Password reset successfully! Login with your new password.');
if(p.get('expired')==='1')showError('Session expired. Please login again.');
</script>
</body>
</html>
