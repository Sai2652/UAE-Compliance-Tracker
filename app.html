function trendCard(title, data, key){
  if(!data){ return `<div class="card"><div class="card-title">${title}</div><div style="padding:8px;color:var(--text-muted);font-size:12px">Loading…</div></div>`; }
  if(_isLoadErr(data)) return `<div class="card"><div class="card-title">${title}</div>${renderLoaderError(data, '⚠️', 'Failed to load trend')}</div>`;
  if(!data.available){ return `<div class="card"><div class="card-title">${title}</div><div style="padding:8px;color:var(--text-muted);font-size:12px">${esc(data.reason||'Unavailable')}</div></div>`; }
  const pts=data.points||[];
  const vals=pts.map(p=>p[key]).map(v=>v==null?0:v);
  const max=Math.max(1,...vals);
  let h=`<div class="card"><div class="card-title">${title}</div><div style="display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--border);padding-bottom:4px">`;
  pts.forEach(p=>{ const v=p[key]==null?0:p[key]; const hpx=Math.max(2,Math.round((v/max)*110)); h+=`<div title="${p.period}: ${p[key]==null?'—':p[key]}" style="flex:1;background:var(--accent);height:${hpx}px;border-radius:2px 2px 0 0"></div>`; });
  h+=`</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px"><span>${pts[0]?.period||''}</span><span>${pts[pts.length-1]?.period||''}</span></div></div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════
// PHASE 5 — Risk Center (+ Phase 4 workflow widget)
// ═══════════════════════════════════════════════════════════════
const riskState={ subTab:'dashboard', groupBy:'client',
  findings:null, clientScores:null, accountability:null, action:null, bottlenecks:null, briefing:null, followUp:null, sla:null,
  readinessFilter:'All', readinessSort:'off' /* off | asc | desc */ };

// ---- Readiness filter / sort helpers shared across Risk Center sub-tabs ----
function riskReadinessMatches(clientId){
  if(!riskState.readinessFilter || riskState.readinessFilter==='All') return true;
  const r=readinessFor(clientId);
  if(!r) return false;
  return r.state===riskState.readinessFilter;
}
function riskSortByReadiness(rows, getId){
  if(riskState.readinessSort==='off') return rows;
  const dir=riskState.readinessSort==='desc'?-1:1;
  return rows.slice().sort((a,b)=>{
    const ra=readinessFor(getId(a)); const rb=readinessFor(getId(b));
    const oa=ra?readinessOrder(ra.state):999;
    const ob=rb?readinessOrder(rb.state):999;
    return (oa-ob)*dir;
  });
}
function readinessFilterStrip(){
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); return ''; }
  const counts=state.clientReadiness.counts||{};
  const order=['high_risk','blocked','filing_due','awaiting_client_approval','awaiting_documents','awaiting_review','partially_ready','ready'];
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-right:4px">Readiness filter</span>`;
  const isAll=!riskState.readinessFilter||riskState.readinessFilter==='All';
  h+=`<button class="btn btn-sm ${isAll?'btn-primary':''}" data-rrf="All">All</button>`;
  order.forEach(s=>{
    const n=counts[s]||0; if(!n) return;
    const m=READINESS_STATE_META[s]; const active=riskState.readinessFilter===s;
    h+=`<button class="btn btn-sm" data-rrf="${s}" style="border-left:3px solid ${m.color};${active?'background:var(--bg-elevated);font-weight:700':''}">${esc(m.label)}: ${n}</button>`;
  });
  // Sort toggle
  const sortLabel={off:'⇅ Sort by readiness', asc:'↑ Readiness (worst first)', desc:'↓ Readiness (best first)'}[riskState.readinessSort];
  h+=`<button class="btn btn-sm" data-rrs="toggle" style="margin-left:auto">${sortLabel}</button>`;
  h+=`</div>`;
  setTimeout(()=>{
    document.querySelectorAll('[data-rrf]').forEach(b=>{ b.onclick=()=>{ riskState.readinessFilter=b.dataset.rrf; render(); }; });
    document.querySelectorAll('[data-rrs]').forEach(b=>{ b.onclick=()=>{ riskState.readinessSort = riskState.readinessSort==='off'?'asc':riskState.readinessSort==='asc'?'desc':'off'; render(); }; });
  },0);
  return h;
}

function riskLevelPill(lvl){
  const c={critical:'var(--red)',high:'var(--red)',medium:'var(--amber)',low:'var(--text-muted)'}[lvl]||'var(--text-muted)';
  return `<span style="display:inline-block;min-width:60px;text-align:center;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${c};font-weight:700;font-size:10px;text-transform:uppercase">${lvl}</span>`;
}
function escalationPill(band, score){
  const c={green:'var(--green)',amber:'var(--amber)',red:'var(--red)'}[band]||'var(--text-muted)';
  return `<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;background:var(--bg-elevated);color:${c};font-weight:700;font-size:11px">●&nbsp;${score}</span>`;
}

// ═══════════════════════════════════════════════════════════════
// Client Readiness — shared pill, cache, filter state
// ═══════════════════════════════════════════════════════════════
const READINESS_STATE_META={
  high_risk:               { label:'High Risk',                color:'var(--red)',        order:0 },
  blocked:                 { label:'Blocked',                  color:'var(--red)',        order:1 },
  filing_due:              { label:'Filing Due',               color:'var(--amber)',      order:2 },
  awaiting_client_approval:{ label:'Awaiting Client Approval', color:'var(--amber)',      order:3 },
  awaiting_documents:      { label:'Awaiting Documents',       color:'var(--amber)',      order:4 },
  awaiting_review:         { label:'Awaiting Review',          color:'var(--accent)',     order:5 },
  partially_ready:         { label:'Partially Ready',          color:'var(--blue)',       order:6 },
  ready:                   { label:'Ready',                    color:'var(--green)',      order:7 },
  idle:                    { label:'Active',                   color:'var(--text-muted)', order:8 }
};
function readinessPill(state){
  const m=READINESS_STATE_META[state]||READINESS_STATE_META.idle;
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${m.color};font-weight:700;font-size:10px;text-transform:uppercase;white-space:nowrap">${esc(m.label)}</span>`;
}
function readinessOrder(state){ return (READINESS_STATE_META[state]||READINESS_STATE_META.idle).order; }

// Compact tier badge for list/table contexts — visually quiet for B (the
// default), prominent for A. Priority order in any row: risk → readiness → tier.
const TIER_MINI_META = {
  A: { color: 'var(--red)',        bg: 'rgba(239,68,68,0.12)', weight: 800 },
  B: { color: 'var(--text-muted)', bg: 'var(--bg-elevated)',   weight: 600 },
  C: { color: 'var(--text-muted)', bg: 'var(--bg-elevated)',   weight: 600 }
};
function tierBadgeMini(tier){
  const t=tier||'B'; const m=TIER_MINI_META[t]||TIER_MINI_META.B;
  return `<span title="Tier ${esc(t)}" style="display:inline-block;min-width:18px;padding:1px 5px;border-radius:4px;background:${m.bg};color:${m.color};font-size:10px;font-weight:${m.weight};text-align:center;letter-spacing:0.5px">${esc(t)}</span>`;
}
function tierFor(clientId){
  const map=state.clientReadinessByClient||{};
  const r=map[String(clientId)]; return r ? (r.tier || 'B') : null;
}
function tierForName(name){
  if(!state.clientReadiness) return null;
  const row=(state.clientReadiness.clients||[]).find(r=>r.clientName===name);
  return row ? (row.tier || 'B') : null;
}
function tierOrder(t){ return t==='A'?0:t==='B'?1:t==='C'?2:3; }

// Cache keyed in `state` so existing render() refreshes pick it up.
async function ensureReadinessLoaded(force){
  if(!force && state.clientReadiness && state.clientReadinessLoadedAt && (Date.now()-state.clientReadinessLoadedAt)<60000) return state.clientReadiness;
  return _once('readiness', async()=>{
    try{
      const j=await apiJSON('/api/clients/readiness');
      state.clientReadiness=j;
      state.clientReadinessLoadedAt=Date.now();
      state.clientReadinessByClient={};
      (j.clients||[]).forEach(r=>{ state.clientReadinessByClient[String(r.clientId)]=r; });
      render();
      return j;
    }catch(e){ console.error('[readiness]', e); return null; }
  });
}
function readinessFor(clientId){
  const map=state.clientReadinessByClient||{};
  return map[String(clientId)]||null;
}

function renderRiskCenter(){
  // Make sure readiness data is loaded — sub-tabs depend on it.
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); }
  // 'health' and 'exceptions' folded in from what used to be top-level Insights
  // tabs — they surface the same "which clients need attention" question from
  // different angles, so it's cleaner to keep them under Risk Center.
  const tabs=[['dashboard','Dashboard'],['action','Action Center'],['health','Health'],['exceptions','Exceptions'],['bottlenecks','Bottlenecks'],['sla','SLA Prediction'],['briefing','Daily Briefing'],['followup','Follow-up'],['team','Team Accountability']];
  let h=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><div class="nav" style="margin:0">`;
  tabs.forEach(([k,l])=>{ h+=`<button class="nav-btn ${riskState.subTab===k?'active':''}" data-rs="${k}">${l}</button>`; });
  h+=`</div></div>`;
  // Readiness filter strip — applies to all sub-tabs except Team Accountability + Bottlenecks + Health + Exceptions.
  if(riskState.subTab!=='team' && riskState.subTab!=='bottlenecks' && riskState.subTab!=='health' && riskState.subTab!=='exceptions') h+=readinessFilterStrip();
  switch(riskState.subTab){
    case 'dashboard':  h+=renderRiskDashboard(); break;
    case 'action':     h+=renderActionCenter(); break;
    case 'health':     h+=renderHealthBoard(); break;
    case 'exceptions': h+=renderExceptions(); break;
    case 'bottlenecks':h+=renderBottlenecks(); break;
    case 'sla':        h+=renderSlaPrediction(); break;
    case 'briefing':   h+=renderBriefing(); break;
    case 'followup':   h+=renderFollowUp(); break;
    case 'team':       h+=renderAccountability(); break;
  }
  setTimeout(()=>{ document.querySelectorAll('[data-rs]').forEach(b=>{ b.onclick=()=>{ riskState.subTab=b.dataset.rs; render(); }; }); },0);
  return h;
}

async function loadRiskFindings(){
  try{
    const params=new URLSearchParams({groupBy:riskState.groupBy});
    const j=await apiJSON('/api/risk/findings?'+params.toString());
    riskState.findings=j;
    const c=await apiJSON('/api/risk/clients'); riskState.clientScores=c;
    render();
  }catch(e){ console.error('Load failed for /api/risk/findings', e); riskState.findings={_error:(e&&e.message)||'Failed to load'}; render(); }
}
function renderRiskDashboard(){
  if(!riskState.findings){ setTimeout(loadRiskFindings,0); return `<div class="empty-state"><div class="empty-state-icon">🛡️</div><div class="empty-state-title">Loading risk findings…</div></div>`; }
  if(_isLoadErr(riskState.findings)) return renderLoaderError(riskState.findings, '⚠️', 'Failed to load risk findings');
  const t=riskState.findings.totals;
  const tile=(lvl,n)=>{ const c={critical:'var(--red)',high:'var(--red)',medium:'var(--amber)',low:'var(--text-muted)'}[lvl]; return `<div class="card" style="border-color:${c}"><div style="color:var(--text-muted);font-size:11px;text-transform:uppercase">${lvl}</div><div style="font-size:28px;font-weight:700;color:${c}">${n}</div></div>`; };
  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:12px">`+tile('critical',t.critical)+tile('high',t.high)+tile('medium',t.medium)+tile('low',t.low)+`</div>`;
  h+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><label style="font-size:11px;color:var(--text-muted)">Group by</label>`;
  ['client','user','type'].forEach(g=>{ h+=`<button class="btn btn-sm ${riskState.groupBy===g?'btn-primary':''}" data-gb="${g}">${g}</button>`; });
  h+=`</div>`;
  let groups=riskState.findings.grouped||[];
  // Readiness filter at group level: keep groups that have at least one matching item.
  if(riskState.readinessFilter && riskState.readinessFilter!=='All'){
    groups = groups.map(g=>{
      const items=(g.items||[]).filter(f=>riskReadinessMatches(f.clientId));
      const totals={critical:0,high:0,medium:0,low:0};
      items.forEach(f=>{ totals[f.level]++; });
      return Object.assign({}, g, { items, totals });
    }).filter(g=>g.items.length>0);
  }
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px">`;
  groups.forEach(g=>{
    // If grouped by client, show readiness + tier pill in the group header.
    const groupReadiness = (riskState.groupBy==='client' && g.items[0]) ? readinessFor(g.items[0].clientId) : null;
    const groupTier = (riskState.groupBy==='client' && g.items[0]) ? tierFor(g.items[0].clientId) : null;
    h+=`<div class="card"><div class="card-title" style="display:flex;align-items:center;gap:6px">${esc(g.key)} ${groupReadiness?readinessPill(groupReadiness.state):''}${groupTier?tierBadgeMini(groupTier):''} <span style="font-size:11px;color:var(--text-muted)">· ${g.items.length}</span></div><div style="display:flex;gap:6px;margin:4px 0 8px">`;
    ['critical','high','medium','low'].forEach(l=>{ if(g.totals[l]) h+=`<span style="font-size:10px;color:var(--text-muted)">${l}: <b style="color:var(--text-primary)">${g.totals[l]}</b></span>`; });
    h+=`</div><div style="max-height:240px;overflow:auto">`;
    g.items.slice(0,15).forEach(f=>{
      const r=readinessFor(f.clientId);
      h+=`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:8px;justify-content:space-between;align-items:center">${riskLevelPill(f.level)}<span style="flex:1">${esc(f.evidence||f.kind)}</span>${r&&riskState.groupBy!=='client'?readinessPill(r.state):''}${f.taskId?`<a href="#" data-task="${f.taskId}" style="color:var(--accent);font-size:11px">view</a>`:''}</div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // Client scores — apply filter + sort, add Readiness column.
  if(riskState.clientScores){
    let rows=(riskState.clientScores.scores||[]).filter(r=>r.band!=='green');
    rows = rows.filter(r=>riskReadinessMatches(r.clientId));
    rows = riskSortByReadiness(rows, r=>r.clientId).slice(0,30);
    if(rows.length){
      h+=`<div class="card" style="margin-top:16px"><div class="card-title">Client Escalation Scores (non-green)</div><table style="width:100%"><thead><tr><th>Client</th><th>Readiness</th><th>Tier</th><th>Band</th><th>Score</th><th>Critical</th><th>High</th><th>Medium</th></tr></thead><tbody>`;
      rows.forEach(r=>{ const rd=readinessFor(r.clientId); const t=tierFor(r.clientId); h+=`<tr><td style="font-weight:600">${esc(r.clientName||'')}</td><td>${rd?readinessPill(rd.state):'<span style="font-size:10px;color:var(--text-muted)">—</span>'}</td><td>${t?tierBadgeMini(t):'<span style="font-size:10px;color:var(--text-muted)">—</span>'}</td><td>${escalationPill(r.band,r.score)}</td><td>${r.score}</td><td style="color:var(--red)">${r.totals.critical}</td><td>${r.totals.high}</td><td>${r.totals.medium}</td></tr>`; });
      h+=`</tbody></table></div>`;
    }
  }
  setTimeout(()=>{ document.querySelectorAll('[data-gb]').forEach(b=>{ b.onclick=()=>{ riskState.groupBy=b.dataset.gb; riskState.findings=null; render(); }; }); },0);
  return h;
}

async function loadActionCenter(){ return _load(riskState, 'action', '/api/risk/manager-action-center'); }

async function loadBottlenecks(){ return _load(riskState, 'bottlenecks', '/api/risk/bottlenecks'); }
function renderBottlenecks(){

async function loadSla(){ return _load(riskState, 'sla', '/api/risk/sla-prediction'); }
function renderSlaPrediction(){
  if(!riskState.sla){ setTimeout(loadSla,0); return `<div class="empty-state"><div class="empty-state-icon">🔮</div><div class="empty-state-title">Predicting breaches…</div></div>`; }
  if(_isLoadErr(riskState.sla)) return renderLoaderError(riskState.sla, '⚠️', 'Failed to load SLA prediction');
  // SLA predictions don't carry clientId — match on clientName as fallback.
  const byName={}; (state.clientReadiness&&state.clientReadiness.clients||[]).forEach(r=>{ byName[r.clientName]=r; });
  const readinessForRow=p=>{ const byName2=byName[p.clientName]; if(byName2) return readinessFor(byName2.clientId); return null; };

  });
  if(riskState.readinessSort!=='off'){

    ps=ps.slice().sort((a,b)=>{ const ra=readinessForRow(a); const rb=readinessForRow(b); const oa=ra?readinessOrder(ra.state):999; const ob=rb?readinessOrder(rb.state):999; return (oa-ob)*dir; });
  }
  let h=`<div class="card-title" style="margin-bottom:12px">SLA Breach Predictions (${ps.length})</div>`;

function openTierEditor(clientId, currentSettings){
  const html=`<div id="tierModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000">
    <div style="background:var(--bg-card);padding:22px;border-radius:8px;max-width:480px;width:90%">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Edit Tier / Service Settings</h3><button class="btn btn-sm" id="tierClose">✕</button></div>
      <div style="display:grid;gap:10px;font-size:13px">
        <label>Tier
          <select id="tierSel" class="form-input">
            <option value="A" ${currentSettings.tier==='A'?'selected':''}>A — High Priority (× ${TIER_META.A?'1.5':''})</option>
            <option value="B" ${currentSettings.tier==='B'?'selected':''}>B — Standard (× 1.0)</option>
            <option value="C" ${currentSettings.tier==='C'?'selected':''}>C — Low Priority (× 0.75)</option>
          </select>
        </label>
        <label>Partner Owner<input id="tierOwner" class="form-input" placeholder="e.g. Partner Name" value="${esc(currentSettings.partnerOwner||'')}"></label>
        <label>Override Reason (required when changing tier)
          <textarea id="tierReason" class="form-input" placeholder="e.g. Strategic client, high-revenue, new client requiring extra attention…" rows="3">${esc(currentSettings.overrideReason||'')}</textarea>
        </label>
        <label>Internal Notes (optional)<textarea id="tierNotes" class="form-input" rows="2">${esc(currentSettings.notes||'')}</textarea></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="tierCancel">Cancel</button><button class="btn btn-primary" id="tierSave">Save</button></div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('tierClose').onclick=()=>document.getElementById('tierModal').remove();
  document.getElementById('tierCancel').onclick=()=>document.getElementById('tierModal').remove();
  document.getElementById('tierSave').onclick=async function(){
    const newTier=document.getElementById('tierSel').value;
    const reason=document.getElementById('tierReason').value.trim();
    const changingTier=newTier!==currentSettings.tier;
    if(changingTier && !reason){ alert('Please provide a reason when changing tier.'); return; }
    try{
      await apiJSON('/api/clients/'+clientId+'/settings',{
        method:'PUT',
        body: JSON.stringify({
          tier: newTier,
          partner_owner: document.getElementById('tierOwner').value.trim() || null,
          override_reason: reason || null,
          notes: document.getElementById('tierNotes').value.trim() || null
        })
      });
      document.getElementById('tierModal').remove();
      loadClientPortfolio(clientId);
    }catch(e){ alert(e.message); }
  };
}

function lifecycleStageColor(status){

    pending:'var(--amber)', stalled:'var(--red)',
    not_required:'var(--text-muted)', none:'var(--text-muted)',
    not_ready:'var(--red)', partially_ready:'var(--amber)', ready_for_filing:'var(--green)'

function lifecycleStageIcon(status){
  return ({
    complete:'✓', completed:'✓', in_progress:'●',
    pending:'◐', stalled:'⚠', not_required:'—', none:'—',
    not_ready:'✕', partially_ready:'◐', ready_for_filing:'✓'

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div>
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Compliance Lifecycle</div>
        <div style="font-size:20px;font-weight:800;color:${overallColor};margin-top:2px">${readinessLabel(overall)}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;font-size:12px">
        ${health?`<div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase">Health</div><div style="margin-top:2px">${healthBadge(health.score, health.band)}</div></div>`:''}
        <div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase">Escalation</div><div style="margin-top:2px">${escalationPill(escalation.band, escalation.score)}</div></div>
        ${data.findings && data.findings.length?`<div><div style="color:var(--text-muted);font-size:10px;text-transform:uppercase">Open Risks</div><div style="margin-top:2px;font-weight:700">${data.findings.length}</div></div>`:''}
      </div>
    </div>`;

  // 8-tile stage grid
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:14px">`;
  h+=lifecycleTile('Onboarding',         s.onboarding);
  h+=lifecycleTile('VAT Registration',   s.vatRegistration);
  h+=lifecycleTile('CT Registration',    s.ctRegistration);
  h+=lifecycleTile('Accounting',         s.accounting);
  h+=lifecycleTile('Review',             s.review);
  h+=lifecycleTile('Client Approval',    s.clientApproval);
  h+=lifecycleTile('Filing',             s.filing);
  h+=`<div style="background:var(--bg-deep);border-radius:8px;padding:10px;border-left:3px solid ${overallColor}">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Overall Readiness</div><div style="font-size:16px;color:${overallColor};font-weight:700">${lifecycleStageIcon(overall)}</div></div>
    <div style="font-size:13px;font-weight:700;color:${overallColor};margin-top:4px">${readinessLabel(overall)}</div>
  </div>`;
  h+=`</div>`;
  h+=`</div>`;

  // Blockers + next actions
  if((data.blockers&&data.blockers.length)||(data.nextActions&&data.nextActions.length)){
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">`;
    if(data.blockers&&data.blockers.length){
      h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title" style="color:var(--red)">⚠ Blockers</div>`;
      data.blockers.forEach(b=>{ h+=`<div style="padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)">${esc(b)}</div>`; });
      h+=`</div>`;
    }else{
      h+=`<div class="card"><div class="card-title">✓ Blockers</div><div style="padding:8px;font-size:12px;color:var(--text-muted)">No active blockers.</div></div>`;
    }
    if(data.nextActions&&data.nextActions.length){
      h+=`<div class="card" style="border-color:var(--accent-soft)"><div class="card-title" style="color:var(--accent)">→ Next Actions</div>`;
      data.nextActions.forEach(a=>{ h+=`<div style="padding:6px 0;font-size:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px"><span>${esc(a.title)}</span>${a.workflowId?`<button class="btn btn-sm" data-wf-open="${a.workflowId}">Open</button>`:''}</div>`; });
      h+=`</div>`;
    }else{
      h+=`<div class="card"><div class="card-title">→ Next Actions</div><div style="padding:8px;font-size:12px;color:var(--text-muted)">Nothing to action — lifecycle clean.</div></div>`;
    }
    h+=`</div>`;
  }

  // Workflows list (compact)
  if(data.workflows&&data.workflows.length){
    h+=`<div class="card" style="margin-bottom:8px"><div class="card-title">Workflows</div>`;
    data.workflows.forEach(w=>{
      const c=w.status==='completed'?'var(--green)':w.status==='active'?'var(--accent)':'var(--text-muted)';
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><div><b>${esc(w.workflow_type.replace(/_/g,' '))}</b> ${w.period_label?'· '+esc(w.period_label):''}</div><div style="display:flex;gap:8px;align-items:center"><span style="color:${c};font-size:11px;font-weight:700;text-transform:uppercase">${esc(w.status)}</span><span style="color:var(--text-muted);font-size:11px">${esc(w.current_step_key||'—')}</span><button class="btn btn-sm" data-wf-open="${w.id}">Open</button></div></div>`;
    });
    h+=`</div>`;
  }

  return h;
}

// ----- Phase 4 minimal: workflow widget (drop-in for client detail) -----
async function loadWorkflowsForClient(clientId, containerId){
  try{
    const j=await apiJSON('/api/clients/'+clientId+'/workflows');
    const el=document.getElementById(containerId); if(!el) return;
    el.innerHTML=renderClientWorkflows(j.workflows||[]);
    el.querySelectorAll('[data-wf-open]').forEach(b=>{ b.onclick=()=>openWorkflowModal(b.dataset.wfOpen); });
  }catch(e){ console.error(e);}
}
function renderClientWorkflows(workflows){
  if(!workflows.length) return `<div style="padding:8px;font-size:12px;color:var(--text-muted)">No active workflows. Workflows auto-start when VAT/CT obligations are generated.</div>`;
  return workflows.map(w=>`<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(w.workflow_type.replace(/_/g,' '))}</b> ${w.period_label?'· '+esc(w.period_label):''}</div><div style="display:flex;gap:6px"><span style="font-size:11px;color:var(--text-muted)">Current: ${esc(w.current_step_key||'—')}</span><button class="btn btn-sm" data-wf-open="${w.id}">Open</button></div></div></div>`).join('');
}
async function openWorkflowModal(workflowId){
  try{
    const data=await apiJSON('/api/workflows/'+workflowId);
    const wf=data.workflow; const steps=data.steps||[];
    const stepHtml=steps.map(s=>{
      const c=s.status==='completed'?'var(--green)':s.status==='in_progress'?'var(--accent)':s.status==='skipped'?'var(--text-muted)':'var(--text-muted)';
      const icon=s.status==='completed'?'✓':s.status==='in_progress'?'●':s.status==='skipped'?'⊘':'○';
      return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)"><span style="color:${c};font-size:18px;width:20px">${icon}</span><div style="flex:1"><div style="font-weight:${s.status==='in_progress'?'700':'400'}">${esc(s.step_label)}</div>${s.completed_at?`<div style="font-size:11px;color:var(--text-muted)">${s.completed_at.slice(0,10)} by ${esc(s.completed_by_name||'')}</div>`:''}</div></div>`;
    }).join('');
    const current=steps.find(s=>s.status==='in_progress');
    const html=`<div id="wfModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000"><div style="background:var(--bg-card);padding:20px;border-radius:8px;max-width:620px;width:90%;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">${esc(wf.workflow_type.replace(/_/g,' '))} ${wf.period_label?'· '+esc(wf.period_label):''}</h3><button class="btn btn-sm" id="wfClose">✕</button></div><div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Status: ${esc(wf.status)} · Client: ${esc(wf.client_name)}</div><div>${stepHtml}</div>${current?`<div style="margin-top:14px;display:flex;gap:8px"><input id="wfNotes" class="form-input" placeholder="Notes (optional)" style="flex:1"><button class="btn btn-primary" id="wfAdvance">Complete "${esc(current.step_label)}"</button></div>`:`<div style="margin-top:14px;color:var(--green);font-weight:700">✓ Workflow complete</div>`}</div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
    document.getElementById('wfClose').onclick=()=>document.getElementById('wfModal').remove();
    if(current){
      document.getElementById('wfAdvance').onclick=async function(){
        try{ await apiJSON('/api/workflows/'+workflowId+'/advance',{method:'POST',body:JSON.stringify({requireKey:current.step_key,notes:document.getElementById('wfNotes').value||null})}); document.getElementById('wfModal').remove(); openWorkflowModal(workflowId); }
        catch(err){ alert(err.message); }
      };
    }
  }catch(e){ alert(e.message); }
}

// PHASE 3 — Command Center & Team Analytics
// ═══════════════════════════════════════════════════════════════
const phase3={ command:null, analyticsTab:'capacity', range:'30',
  capacity:null, workloadRecs:null, productivity:null, kpis:null, forecast:null,
  reviewQueue:null, communication:null };

function trendArrow(delta){
  if(delta===null||delta===undefined) return '<span style="color:var(--text-muted)">—</span>';
  if(delta===0) return '<span style="color:var(--text-muted)">→ 0%</span>';
  const c=delta>0?'var(--green)':'var(--red)';
  const arrow=delta>0?'▲':'▼';
  return `<span style="color:${c};font-weight:700">${arrow} ${Math.abs(delta)}%</span>`;
}
function bandPill(band){
  const c={healthy:'var(--green)',balanced:'var(--green)',watch:'var(--blue)',underutilized:'var(--blue)',at_risk:'var(--amber)',overloaded:'var(--red)',critical:'var(--red)',unknown:'var(--text-muted)'}[band]||'var(--text-muted)';
  return `<span style="padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${c};font-weight:700;font-size:11px">${(band||'').replace(/_/g,' ')}</span>`;
}

// ----- Command Center -----
async function loadCommand(){ return _load(phase3, 'command', '/api/ops/command-center'); }
function renderCommandCenter(){
  if(!phase3.command){ setTimeout(loadCommand,0); return `<div class="empty-state"><div class="empty-state-icon">⚡</div><div class="empty-state-title">Loading command center…</div></div>`; }
  if(_isLoadErr(phase3.command)) return renderLoaderError(phase3.command, '⚠️', 'Failed to load command center');
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); }
  if(!reportsState.attention){ setTimeout(loadReportAttention,0); }
  const x=phase3.command;
  let h=`<div class="card-title" style="margin-bottom:12px">⚡ Manager Command Center</div>`;
  if(x.insights && x.insights.length){
    h+=`<div class="card" style="border-color:var(--accent-soft);margin-bottom:16px"><div class="card-title">Actionable Insights</div><ul style="margin:8px 0 0 18px;padding:0;font-size:13px;line-height:1.7">`+x.insights.map(i=>`<li>${esc(i)}</li>`).join('')+`</ul></div>`;
  }
  // Top Attention Required Clients — the most-used management report, embedded here.
  if(reportsState.attention && (reportsState.attention.rows||[]).length){
    h+=`<div class="card" style="border-color:var(--red-border);margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="card-title" style="color:var(--red);margin:0">🎯 Top Attention Required Clients</div><div style="display:flex;gap:6px"><button class="btn btn-sm" data-rt="attention">View All</button><button class="btn btn-sm" onclick="window.location.href='${reportsExportUrl('/api/reports/attention-required?limit=50')}'">⬇ CSV</button></div></div><div style="overflow:auto">${attentionTableHtml((reportsState.attention.rows||[]).slice(0,10))}</div></div>`;
    setTimeout(()=>{ document.querySelectorAll('[data-rt="attention"]').forEach(b=>{ b.onclick=()=>{ state.activeTab='reports'; reportsState.subTab='attention'; render(); }; }); },0);
  }
  // Readiness chips — reuses the Risk Center filter state so it carries across screens.
  h+=readinessFilterStrip();

  // Client-name lookup for items that don't carry clientId (review bottlenecks).
  const byName={}; (state.clientReadiness&&state.clientReadiness.clients||[]).forEach(r=>{ byName[r.clientName]=r; });
  const matchByName=name=>{ if(!riskState.readinessFilter||riskState.readinessFilter==='All') return true; const r=byName[name]; return r && r.state===riskState.readinessFilter; };
  const matchById  =id  =>{ if(!riskState.readinessFilter||riskState.readinessFilter==='All') return true; if(id==null) return false; const r=readinessFor(id); return r && r.state===riskState.readinessFilter; };
  const pillForId  =id  => { const r=id!=null?readinessFor(id):null; return r?readinessPill(r.state):''; };
  const pillForName=name=> { const r=byName[name]; return r?readinessPill(r.state):''; };

  // Apply filters per card. Cards that have no client mapping pass through unchanged.
  const topPriority   = (x.topPriorityClients||[]).filter(c=>matchById(c.clientId));
  const criticalDL    = (x.criticalDeadlines||[]).filter(t=>matchById(t.client_external_id));
  const escalationRisks=(x.escalationRisks||[]); // no client mapping on raw event row
  const overloaded    = (x.overloadedEmployees||[]); // user-centric — never filtered by client readiness
  const stuckDocs     = (x.missingDocuments||[]).filter(d=>matchById(d.client_external_id));
  const highRisk      = (x.highRiskClients||[]).filter(c=>matchById(c.clientId));
  const reviewBottle  = (x.reviewBottlenecks||[]).filter(r=>matchByName(r.client));
  const capacityWarns = (x.capacityWarnings||[]);

  const taskMini=t=>`<div data-task="${t.id}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px"><span style="font-weight:600">${esc(t.client_name||'')}</span>${pillForId(t.client_external_id)}<span style="color:var(--text-muted)">${esc((t.task_type||'').replace(/_/g,' '))}</span><span>${priorityPill(t.priority_score)}</span><span style="color:var(--text-muted)">${t.due_date||'—'}</span></div>`;
  const clientMini=c=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px"><span style="font-weight:600;flex:1">${esc(c.clientName||'')}</span>${pillForId(c.clientId)}<span style="color:var(--text-muted)">${c.openTasks||0} open · prio ${c.totalPriority||0}</span></div>`;
  const userMini=u=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="font-weight:600">${esc(u.userName||'')}</span><span>${u.openTasks||0}/${u.capacity||'—'} · ratio ${u.workloadRatio||'—'}</span>${bandPill(u.band)}</div>`;
  const card=(title,items,renderer,emptyMsg,color)=>{
    let inner=`<div class="card-title" style="color:${color||'var(--text-primary)'}">${title} (${items.length})</div>`;
    if(!items.length) return `<div class="card">${inner}<div style="padding:8px;font-size:12px;color:var(--text-muted)">${emptyMsg||'None.'}</div></div>`;
    inner+=`<div style="max-height:260px;overflow:auto">${items.slice(0,12).map(renderer).join('')}</div>`;
    return `<div class="card">${inner}</div>`;
  };
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px">`;
  h+=card('🔥 Top Priority Clients',     topPriority, clientMini, 'No priority clients.');
  h+=card('⏰ Critical Deadlines (7d)',   criticalDL,  taskMini, 'No urgent deadlines.');
  h+=card('🚨 Escalation Risks',         escalationRisks, e=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px">Task #${e.task_id} · ${esc(e.rule_name||'')} · sev ${e.severity}</div>`, 'No open escalations.');
  h+=card('👥 Overloaded Employees',     overloaded, userMini, 'No one overloaded — nice!');
  h+=card('📎 Stuck Documents',          stuckDocs, d=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px"><span><b>${esc(d.client_name)}</b> — ${esc(d.document_name)}</span>${pillForId(d.client_external_id)}</div>`, 'No stuck documents.');
  h+=card('💔 High-Risk Clients',        highRisk, c=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px"><b>${esc(c.clientName||'')}</b>${pillForId(c.clientId)}${healthBadge(c.score,c.band)}</div>`, 'All clients healthy.');
  h+=card('👀 Review Bottlenecks',       reviewBottle, r=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px"><b>${esc(r.client)}</b>${pillForName(r.client)}<span style="color:var(--text-muted)">${esc((r.taskType||'').replace(/_/g,' '))}</span><span style="color:${r.aging==='alarm'?'var(--red)':r.aging==='warn'?'var(--amber)':'var(--text-muted)'}">${r.ageDays}d</span></div>`, 'No reviews waiting.');
  h+=card('📈 Capacity Warnings',        capacityWarns, w=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;color:${w.severity==='high'?'var(--red)':'var(--amber)'}">${esc(w.message)}</div>`, 'Capacity looks healthy.');
  h+=`</div>`;
  return h;
}

// ----- Team Analytics (sub-tabs) -----
function renderAnalytics(){
  const tabs=[['capacity','Capacity'],['workload','Workload'],['productivity','Productivity'],['kpis','KPIs'],['forecast','Forecast'],['reviewq','Reviews'],['comms','Communication']];
  let h=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><div class="nav" style="margin:0">`;
  tabs.forEach(([k,l])=>{ h+=`<button class="nav-btn ${phase3.analyticsTab===k?'active':''}" data-aa="${k}">${l}</button>`; });
  h+=`</div>`;
  if(['productivity','kpis'].includes(phase3.analyticsTab)){
    h+=`<div style="display:flex;gap:4px;align-items:center;margin-left:auto"><label style="font-size:11px;color:var(--text-muted)">Range</label>`;
    ['7','30','90'].forEach(r=>{ h+=`<button class="btn btn-sm ${phase3.range===r?'btn-primary':''}" data-range="${r}">${r}d</button>`; });
    h+=`</div>`;
  }
  h+=`</div>`;
  switch(phase3.analyticsTab){
    case 'capacity': h+=renderCapacityTab(); break;
    case 'workload': h+=renderWorkloadTab(); break;
    case 'productivity': h+=renderProductivityTab(); break;
    case 'kpis': h+=renderKpiTab(); break;
    case 'forecast': h+=renderForecastTab(); break;
    case 'reviewq': h+=renderReviewQueueTab(); break;
    case 'comms': h+=renderCommunicationTab(); break;
  }
  setTimeout(()=>{
    document.querySelectorAll('[data-aa]').forEach(b=>{ b.onclick=()=>{ phase3.analyticsTab=b.dataset.aa; render(); }; });
    document.querySelectorAll('[data-range]').forEach(b=>{ b.onclick=()=>{ phase3.range=b.dataset.range; phase3.productivity=null; phase3.kpis=null; render(); }; });
  },0);
  return h;
}

async function loadCapacity(){ return _load(phase3, 'capacity', '/api/team/capacity'); }
function renderCapacityTab(){
  if(!phase3.capacity){ setTimeout(loadCapacity,0); return `<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Loading capacity…</div></div>`; }
  if(_isLoadErr(phase3.capacity)) return renderLoaderError(phase3.capacity, '⚠️', 'Failed to load capacity');
  const rows=phase3.capacity.rows||[];
  let h=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:1100px"><thead><tr><th>User</th><th>Band</th><th>Clients</th><th>Open</th><th>Cap</th><th>Ratio</th><th>Overdue</th><th>Awaiting Review</th><th>Blocked</th><th>Due ≤7d</th><th>Completed</th><th>Avg Days</th><th>SLA %</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr><td style="font-weight:600">${esc(r.userName)}</td><td>${bandPill(r.band)}</td><td>${r.assignedClients==null?'—':r.assignedClients}</td><td>${r.openTasks}</td><td>${r.capacity||'—'}</td><td>${r.workloadRatio==null?'—':r.workloadRatio}</td><td style="color:${r.overdueTasks>0?'var(--red)':'var(--text-muted)'}">${r.overdueTasks}</td><td>${r.awaitingReview}</td><td>${r.blockedTasks}</td><td>${r.dueWithin7d}</td><td>${r.completedTasks}</td><td>${r.avgCompletionDays==null?'—':r.avgCompletionDays}</td><td>${r.slaAdherencePct==null?'—':r.slaAdherencePct+'%'}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;

async function loadWorkloadRecs(){ return _load(phase3, 'workloadRecs', '/api/team/workload/recommendations'); }
function renderWorkloadTab(){
  if(!phase3.capacity){ setTimeout(loadCapacity,0); return `<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Loading…</div></div>`; }
  if(_isLoadErr(phase3.capacity)) return renderLoaderError(phase3.capacity, '⚠️', 'Failed to load capacity');
  if(!phase3.workloadRecs){ setTimeout(loadWorkloadRecs,0); }
  if(_isLoadErr(phase3.workloadRecs)) return renderLoaderError(phase3.workloadRecs, '⚠️', 'Failed to load workload recommendations');
  const rows=phase3.capacity.rows||[];
  let h=`<div class="card"><div class="card-title">Workload Distribution</div><div style="display:grid;gap:8px">`;
  rows.forEach(r=>{
    const ratio=r.workloadRatio||0;
    const pct=Math.min(150, ratio*100);
    const c=r.band==='overloaded'?'var(--red)':r.band==='underutilized'?'var(--blue)':'var(--green)';
    h+=`<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="font-weight:600">${esc(r.userName)}</span><span>${r.openTasks}/${r.capacity||'—'} · ratio ${ratio} · ${bandPill(r.band)}</span></div><div style="background:var(--bg-deep);height:8px;border-radius:4px;overflow:hidden"><div style="width:${Math.min(100,pct)}%;background:${c};height:100%"></div></div></div>`;
  });
  h+=`</div></div>`;

  const recs=(phase3.workloadRecs&&phase3.workloadRecs.recommendations)||[];
  h+=`<div class="card" style="margin-top:16px"><div class="card-title">Balancing Recommendations (${recs.length})</div>`;
  if(!recs.length) h+=`<div style="padding:8px;font-size:12px;color:var(--text-muted)">No imbalance detected.</div>`;
  recs.forEach((r,i)=>{

const phase2={ calendar:null, exceptions:null, health:null, calFilter:{ from:null, to:null, type:'' } };

function healthBadge(score, band){
  const c=band==='healthy'?'var(--green)':band==='watch'?'var(--blue)':band==='at_risk'?'var(--amber)':'var(--red)';
  return `<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;background:var(--bg-elevated);font-weight:700;color:${c}">●&nbsp;${score}</span>`;
}
function slaChip(s){
  const map={on_track:['var(--green)','On Track'],at_risk:['var(--amber)','At Risk'],likely_breach:['var(--red)','Likely Breach'],breached:['var(--red)','Breached'],met:['var(--green)','Met']};
  const [c,l]=map[s]||['var(--text-muted)',s||'—'];
  return `<span style="font-size:10px;padding:2px 6px;border-radius:4px;color:${c};background:var(--bg-elevated)">${l}</span>`;
}

async function loadCalendar(){
  const today=new Date(); const to=new Date(today.getTime()+90*86400000);
  const from=phase2.calFilter.from||today.toISOString().slice(0,10);
  const toStr=phase2.calFilter.to||to.toISOString().slice(0,10);
  const params=new URLSearchParams({from,to:toStr});
  if(phase2.calFilter.type) params.set('types',phase2.calFilter.type);
  return _load(phase2, 'calendar', '/api/calendar?'+params.toString());
}
function renderCalendar(){
  if(!phase2.calendar){ setTimeout(loadCalendar,0); return `<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">Loading calendar…</div></div>`; }
  if(_isLoadErr(phase2.calendar)) return renderLoaderError(phase2.calendar, '⚠️', 'Failed to load calendar');
  const ev=phase2.calendar.events||[];
  // Group by month
  const groups={};
  ev.forEach(e=>{ const k=(e.date||'').slice(0,7)||'unknown'; (groups[k]=groups[k]||[]).push(e); });
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title">📅 Compliance Calendar (${ev.length} events)</div><div style="display:flex;gap:6px"><select class="form-input" id="calType" style="width:auto"><option value="">All types</option><option value="VAT_Return">VAT</option><option value="CT_Return">CT</option><option value="Audit">Audit</option><option value="Management_Report">Mgmt Report</option></select><button class="btn" id="calRefresh">Refresh</button></div></div>`;
  if(!ev.length) h+=`<div class="empty-state"><div class="empty-state-icon">✨</div><div class="empty-state-title">No upcoming events in this window</div></div>`;
  Object.keys(groups).sort().forEach(month=>{
    h+=`<div class="card"><div class="card-title">${month}</div><table style="width:100%"><tbody>`;
    groups[month].forEach(e=>{
      const kindColor=e.kind==='obligation'?'var(--accent)':'var(--blue)';
      h+=`<tr><td style="padding:4px 6px;font-size:12px;color:var(--text-muted);width:90px">${e.date}</td><td style="padding:4px 6px"><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg-elevated);color:${kindColor}">${e.kind}</span></td><td style="padding:4px 6px;font-weight:600">${esc(e.client||'')}</td><td style="padding:4px 6px;font-size:12px">${esc(e.title)}</td><td style="padding:4px 6px">${e.status?statusBadge(e.status):''}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  });
  // Wire up filters after render
  setTimeout(()=>{
    const t=document.getElementById('calType'); if(t){ t.value=phase2.calFilter.type||''; t.onchange=()=>{ phase2.calFilter.type=t.value; phase2.calendar=null; render(); }; }
    const r=document.getElementById('calRefresh'); if(r) r.onclick=()=>{ phase2.calendar=null; render(); };
  },0);
  return h;
}

// TASK ENGINE — Priority queue, Tasks, Documents, Manager Dashboard
// ═══════════════════════════════════════════════════════════════
const TASK_STATUSES=["not_started","waiting_documents","documents_received","in_progress","ready_for_review","reviewed","completed","blocked","escalated"];
const TASK_TYPES=["Accounting_Bookkeeping","VAT_Filing","VAT_Registration","VAT_Deregistration","CT_Filing","CT_Registration","CT_Deregistration","Audit","Document_Request","Client_Followup","Management_Report","Review","Amendment","Refund","Other"];
const taskState={ priority:[], tasks:[], documents:[], ops:null, loading:false, priorityLoaded:false, tasksLoaded:false, documentsLoaded:false };

async function apiJSON(url, opts){
  const r=await fetch(url, Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}}, opts||{}));
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||('HTTP '+r.status)); }
  return r.json();
}

function statusBadge(s){
  const colors={not_started:'var(--text-muted)',waiting_documents:'var(--amber)',documents_received:'var(--blue)',in_progress:'var(--blue)',ready_for_review:'var(--accent)',reviewed:'var(--green)',completed:'var(--green)',blocked:'var(--red)',escalated:'var(--red)'};
  return `<span style="display:inline-block;padding:2px 8px;border-radius:4px;background:var(--bg-elevated);color:${colors[s]||'var(--text-muted)'};font-size:11px;font-weight:600">${s.replace(/_/g,' ')}</span>`;
}
function priorityPill(score){
  const c=score>=120?'var(--red)':score>=60?'var(--amber)':'var(--text-muted)';
  return `<span style="font-weight:700;color:${c}">${score||0}</span>`;
}
// fmtDate and daysUntil already defined at top of file — re-use globals.

function taskRow(t){
  const du=daysUntil(t.due_date);
  const dueStr=t.due_date?`${fmtDate(t.due_date)} (${du<0?Math.abs(du)+'d overdue':du+'d'})`:'—';
  const dueColor=du!=null&&du<0?'var(--red)':du!=null&&du<=7?'var(--amber)':'var(--text-muted)';
  return `<tr data-task="${t.id}" style="cursor:pointer"><td>${priorityPill(t.priority_score)}</td><td style="font-weight:600">${esc(t.client_name)}</td><td>${esc(t.task_type.replace(/_/g,' '))}</td><td>${statusBadge(t.status)}</td><td style="font-size:12px;color:${dueColor}">${dueStr}</td><td style="font-size:12px;color:var(--text-muted)">${esc(t.assigned_user_name||'Unassigned')}</td></tr>`;
}

// Tiny in-flight guard — prevents the same loader from being fired on every
// render while the previous fetch is still pending.
const _inflight={};
function _once(key, fn){
  if(_inflight[key]) return _inflight[key];
  const p = Promise.resolve().then(fn).finally(()=>{ delete _inflight[key]; });
  _inflight[key] = p; return p;
}
async function loadPriorityQueue(){ return _once('priority', async()=>{ try{ const j=await apiJSON('/api/my/priority-queue'); taskState.priority=j.tasks||[]; taskState.priorityLoaded=true; render(); }catch(e){ console.error(e); taskState.priorityLoaded=true; render(); } }); }
function renderPriorityQueue(){
  // Admins get the Morning Briefing rendered above their priority queue — it
  // replaces the standalone "Morning" tab that used to duplicate this space.
  // renderMorningDashboard handles its own loading + error states.
  const morning = isAdmin() ? renderMorningDashboard() : '';
  if(!taskState.priorityLoaded){ setTimeout(loadPriorityQueue,0); return morning + `<div class="empty-state"><div class="empty-state-icon">⚡</div><div class="empty-state-title">Loading your priority work…</div></div>`; }
  if(!taskState.priority.length) return morning + `<div class="empty-state"><div class="empty-state-icon">✅</div><div class="empty-state-title">All caught up</div><div class="empty-state-text">No open tasks assigned to you.</div></div>`;
  let h = morning;
  if(morning) h+=`<div style="height:12px"></div><hr style="border:none;border-top:1px solid var(--border);margin:0 0 14px 0">`;
  h+=`<div class="card-title" style="margin-bottom:12px">⚡ My Next Priority Work — ${taskState.priority.length} open</div>`;
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:800px"><thead><tr><th style="width:60px">Priority</th><th>Client</th><th>Type</th><th>Status</th><th>Due</th><th>Owner</th></tr></thead><tbody>`;
  taskState.priority.forEach(t=>{ h+=taskRow(t); });
  h+=`</tbody></table></div>`;
  return h;
}

async function loadTasks(){ return _once('tasks', async()=>{ try{ const j=await apiJSON('/api/tasks'); taskState.tasks=j.tasks||[]; taskState.tasksLoaded=true; render(); }catch(e){ console.error(e); taskState.tasksLoaded=true; render(); } }); }
function renderTasksBoard(){
  if(!taskState.tasksLoaded){ setTimeout(loadTasks,0); }
  const byStatus={};
  TASK_STATUSES.forEach(s=>byStatus[s]=[]);
  taskState.tasks.forEach(t=>{ (byStatus[t.status]||(byStatus[t.status]=[])).push(t); });
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title">Tasks (${taskState.tasks.length})</div>`;
  if(isAdmin()) h+=`<div style="display:flex;gap:8px"><button class="btn" data-action="runGeneration">↻ Run Generation</button><button class="btn btn-primary" data-action="openNewTask">+ New Task</button></div>`;
  h+=`</div>`;
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:900px"><thead><tr><th style="width:60px">Priority</th><th>Client</th><th>Type</th><th>Status</th><th>Due</th><th>Owner</th></tr></thead><tbody>`;
  taskState.tasks.slice().sort((a,b)=>b.priority_score-a.priority_score).forEach(t=>{ h+=taskRow(t); });
  h+=`</tbody></table></div>`;
  return h;
}

async function loadDocuments(){ return _once('documents', async()=>{ try{ const j=await apiJSON('/api/documents?status=pending'); taskState.documents=j.documents||[]; taskState.documentsLoaded=true; render(); }catch(e){ console.error(e); taskState.documentsLoaded=true; render(); } }); }
function renderDocumentsView(){
  if(!taskState.documentsLoaded){ setTimeout(loadDocuments,0); }
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title">📎 Missing Documents (${taskState.documents.length})</div><button class="btn btn-primary" data-action="openNewDoc">+ Request Document</button></div>`;
  if(!taskState.documents.length) return h+`<div class="empty-state"><div class="empty-state-icon">📎</div><div class="empty-state-title">No pending documents</div></div>`;
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:900px"><thead><tr><th>Client</th><th>Document</th><th>Requested</th><th>Last Reminder</th><th>Pending (days)</th><th>Actions</th></tr></thead><tbody>`;
  taskState.documents.forEach(d=>{
    const pending=Math.floor((Date.now()-new Date(d.requested_date))/86400000);
    h+=`<tr><td style="font-weight:600">${esc(d.client_name)}</td><td>${esc(d.document_name)}</td><td style="font-size:12px;color:var(--text-muted)">${fmtDate(d.requested_date)}</td><td style="font-size:12px;color:var(--text-muted)">${d.last_reminder_date?fmtDate(d.last_reminder_date):'—'}</td><td style="color:${pending>7?'var(--red)':'var(--text-muted)'}">${pending}</td><td><button class="btn btn-sm" data-doc-remind="${d.id}">Remind</button> <button class="btn btn-sm" data-doc-receive="${d.id}">Received</button></td></tr>`;
  });

async function loadOps(){ return _once('ops', ()=>_load(taskState,'ops','/api/manager/dashboard')); }
function renderManagerDashboard(){
  if(!taskState.ops){ setTimeout(loadOps,0); return `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">Loading manager dashboard…</div></div>`; }
  if(_isLoadErr(taskState.ops)) return renderLoaderError(taskState.ops, '⚠️', 'Failed to load manager dashboard');
  const o=taskState.ops;
  const card=(title,rows,emptyMsg)=>{
    let inner=`<div class="card-title">${title} (${rows.length})</div>`;
    if(!rows.length) return `<div class="card">${inner}<div style="padding:12px;color:var(--text-muted);font-size:12px">${emptyMsg||'Nothing here.'}</div></div>`;
    inner+=`<div style="max-height:280px;overflow:auto"><table style="width:100%"><tbody>`;
    rows.slice(0,12).forEach(t=>{ inner+=`<tr><td style="padding:4px 6px;font-weight:600">${esc(t.client_name)}</td><td style="padding:4px 6px;font-size:12px">${esc(t.task_type.replace(/_/g,' '))}</td><td style="padding:4px 6px">${statusBadge(t.status)}</td><td style="padding:4px 6px;font-size:12px;color:var(--text-muted)">${fmtDate(t.due_date)}</td></tr>`; });
    inner+=`</tbody></table></div>`;
    return `<div class="card">${inner}</div>`;
  };
  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px">`;
  h+=card("🔥 Today's Critical Work", o.criticalToday, "Nothing critical today.");
  h+=card("📅 Upcoming Deadlines (7d)", o.upcomingDeadlines);
  h+=card("⚠ Overdue Tasks", o.overdue, "No overdue tasks.");
  h+=card("⛔ Blocked / Escalated", o.blocked);
  h+=card("👀 Awaiting Review", o.awaitingReview);
  h+=`<div class="card"><div class="card-title">👥 Team Workload</div><table style="width:100%"><tbody>${o.workload.map(w=>`<tr><td style="padding:4px 6px;font-weight:600">${esc(w.user)}</td><td style="padding:4px 6px;text-align:right">${w.openTasks}</td></tr>`).join('')}</tbody></table></div>`;
  h+=card("📎 Pending Documents", o.pendingDocuments.map(d=>({client_name:d.client_name,task_type:d.document_name,status:'waiting_documents',due_date:d.requested_date})), "No pending documents.");
  h+=`</div>`;
  return h;
}

// Action wiring for new tabs — additive, hooks into existing data-action dispatcher if present.
document.addEventListener('click', async function(e){
  const t=e.target.closest('[data-action]'); if(!t) return;
  const action=t.dataset.action;
  try{
    if(action==='runGeneration'){ await apiJSON('/api/tasks/generate',{method:'POST'}); await loadTasks(); }
    if(action==='openNewTask'){ await promptNewTask(); }
    if(action==='openNewDoc'){ await promptNewDocument(); }
  }catch(err){ alert(err.message); }
});
document.addEventListener('click', async function(e){
  const r=e.target.closest('[data-doc-remind]'); const v=e.target.closest('[data-doc-receive]');
  try{
    if(r){ await apiJSON('/api/documents/'+r.dataset.docRemind+'/remind',{method:'POST'}); await loadDocuments(); }
    if(v){ await apiJSON('/api/documents/'+v.dataset.docReceive+'/receive',{method:'POST'}); await loadDocuments(); }
  }catch(err){ alert(err.message); }
});
document.addEventListener('click', async function(e){
  const row=e.target.closest('[data-task]'); if(!row) return;
  const id=row.dataset.task;
  await openTaskDetail(id);
});

async function openTaskDetail(id){
  try{
    const j=await apiJSON('/api/tasks/'+id);
    const t=j.task;
    const opts=TASK_STATUSES.map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('');
    const adminBtns=isAdmin()?`<button class="btn" data-task-review="approve">Approve Review</button> <button class="btn" data-task-review="reject">Reject</button> <button class="btn btn-primary" data-task-complete>Mark Completed</button>`:`<button class="btn btn-primary" data-task-submit>Submit for Review</button>`;
    const html=`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000" id="taskModal"><div style="background:var(--bg-card);padding:24px;border-radius:8px;max-width:640px;width:90%;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>Task #${t.id}</h3><button class="btn btn-sm" id="taskModalClose">✕</button></div><div style="display:grid;gap:10px;font-size:13px"><div><b>Client:</b> ${esc(t.client_name)}</div><div><b>Type:</b> ${t.task_type.replace(/_/g,' ')}</div><div><b>Due:</b> ${fmtDate(t.due_date)} · <b>Deadline:</b> ${fmtDate(t.compliance_deadline)}</div><div><b>Owner:</b> ${esc(t.assigned_user_name||'Unassigned')}</div><div><b>Priority:</b> ${priorityPill(t.priority_score)}</div><div><b>Status:</b> <select id="taskStatusSel">${opts}</select></div><div><b>Review:</b> ${t.review_status}</div><div style="margin-top:8px"><b>Comments</b><div id="taskComments" style="max-height:200px;overflow:auto;background:var(--bg-deep);padding:8px;border-radius:6px;margin-top:6px">${(j.comments||[]).map(c=>`<div style="margin-bottom:6px"><b>${esc(c.user_name||'?')}</b> <span style="color:var(--text-muted);font-size:11px">${fmtDate(c.created_at)}</span><div>${esc(c.body)}</div></div>`).join('')||'<div style="color:var(--text-muted)">No comments</div>'}</div><div style="display:flex;gap:6px;margin-top:6px"><input id="newCommentBody" class="form-input" placeholder="Add a comment..." style="flex:1"><button class="btn" id="addCommentBtn">Add</button></div></div><div style="display:flex;gap:8px;margin-top:14px">${adminBtns}</div></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('taskModalClose').onclick=()=>document.getElementById('taskModal').remove();
    document.getElementById('taskStatusSel').onchange=async function(){
      try{ await apiJSON('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({status:this.value})}); document.getElementById('taskModal').remove(); await loadTasks(); await loadPriorityQueue(); }
      catch(err){ alert(err.message); }
    };
    document.getElementById('addCommentBtn').onclick=async function(){
      const body=document.getElementById('newCommentBody').value.trim(); if(!body) return;
      await apiJSON('/api/tasks/'+t.id+'/comments',{method:'POST',body:JSON.stringify({body})});
      document.getElementById('taskModal').remove(); openTaskDetail(t.id);
    };
    const submitBtn=document.querySelector('[data-task-submit]'); if(submitBtn) submitBtn.onclick=async function(){ await apiJSON('/api/tasks/'+t.id+'/submit-review',{method:'POST'}); document.getElementById('taskModal').remove(); await loadTasks(); await loadPriorityQueue(); };
    const completeBtn=document.querySelector('[data-task-complete]'); if(completeBtn) completeBtn.onclick=async function(){ await apiJSON('/api/tasks/'+t.id+'/complete',{method:'POST'}); document.getElementById('taskModal').remove(); await loadTasks(); };
    document.querySelectorAll('[data-task-review]').forEach(b=>{ b.onclick=async function(){ await apiJSON('/api/tasks/'+t.id+'/review',{method:'POST',body:JSON.stringify({decision:this.dataset.taskReview})}); document.getElementById('taskModal').remove(); await loadTasks(); }; });
  }catch(err){ alert(err.message); }
}

async function promptNewDocument(){

function renderDashboard(){
  const vc=getVisibleClients();
  const total=vc.length;
  if(!total&&isAdmin()&&!getAssignableUsers().length)return`<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">Welcome to UAE Compliance Tracker</div><div class="empty-state-text">Set up your team, then add clients.</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn" data-nav="users">👤 Set up people</button><button class="btn btn-primary" data-action="openAddClient">+ Add Client</button></div></div>`;
  if(!total&&isAdmin())return`<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No Clients Yet</div><button class="btn btn-primary" data-action="openAddClient">+ Add First Client</button></div>`;
  if(!total&&!isAdmin())return`<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No Clients Assigned</div><div class="empty-state-text">Your admin hasn't assigned any clients to you yet. Contact your admin for access.</div></div>`;

  const completed=vc.filter(c=>metricsCache[c.id]?.overallStatus==="Completed").length;
  const blocked=vc.filter(c=>metricsCache[c.id]?.overallStatus==="Blocked").length;
  const allDL=vc.flatMap(c=>metricsCache[c.id]?.deadlines||[]);
  const urgent=allDL.filter(d=>d.days!=null&&d.days>=0&&d.days<=7).length;
  const overdue=allDL.filter(d=>d.days!=null&&d.days<0).length;
  const avgPct=Math.round(vc.reduce((s,c)=>s+(metricsCache[c.id]?.totalPct||0),0)/total);

  let h=`<div class="stat-grid cols-6">${[{l:"Total Clients",v:total,c:"var(--blue)"},{l:"Completed",v:completed,c:"var(--green)"},{l:"Blocked",v:blocked,c:"var(--red)"},{l:"Due ≤7 Days",v:urgent,c:"var(--amber)"},{l:"Overdue",v:overdue,c:"var(--red)"},{l:"Avg Completion",v:avgPct+"%",c:"var(--accent)"}].map(s=>`<div class="stat-card"><div class="stat-value" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join("")}</div>`;

  // Readiness counts strip — clickable to filter, plus an "All" reset chip.
  h+=renderReadinessCountsStrip();

  h+=`<div class="filter-bar"><input class="form-input search-input" placeholder="Search clients..." value="${esc(state.search)}" data-action="search">${selectHTML("fs",state.filterStatus,["All",...STATUSES],'data-action="filterStatus"')}${selectHTML("ft",state.filterTeam,["All",...getTeamOptions()],'data-action="filterTeam"')}${renderReadinessFilterSelect()}${renderClientTierFilterSelect()}<button class="btn btn-sm ${state.sortByTier?'btn-primary':''}" data-action="toggleSortTier">Sort by Tier</button></div>`;

  const fl=getFilteredClients();
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:1000px"><thead><tr><th>Client</th><th>Readiness</th><th>Overall</th><th style="min-width:120px">Completion</th><th>Accounting</th><th>VAT</th><th>Corp Tax</th><th>Documents</th><th>Logins</th><th>Next Deadline</th><th>Owner</th></tr></thead><tbody>`;
  // Priority order in the client cell: name → readiness pill (in own column) → tier (compact, end of name).
  fl.forEach(c=>{const m=metricsCache[c.id];const dl=m.deadlines[0];const r=readinessFor(c.id);const t=tierFor(c.id);h+=`<tr style="cursor:pointer" data-client="${c.id}"><td style="font-weight:700;color:var(--text-primary);min-width:160px"><span style="display:inline-flex;align-items:center;gap:6px">${esc(c.name)}${t?tierBadgeMini(t):''}</span></td><td>${r?readinessPill(r.state):'<span style="font-size:10px;color:var(--text-muted)">—</span>'}</td><td>${badgeHTML(m.overallStatus,1)}</td><td>${progressHTML(m.totalPct)}</td><td>${badgeHTML(m.acctStatus,1)}</td><td>${badgeHTML(m.vatStatus,1)}</td><td>${badgeHTML(m.ctStatus,1)}</td><td>${badgeHTML(m.docsStatus,1)}</td><td>${badgeHTML(m.loginsStatus,1)}</td><td style="font-size:12px;white-space:nowrap">${dl?`<span style="color:${dl.days<0?'var(--red)':dl.days<=7?'var(--amber)':'var(--text-muted)'}">${esc(dl.label)} · ${dl.days<0?Math.abs(dl.days)+'d overdue':dl.days+'d'}</span>`:'—'}</td><td style="font-size:12px;color:var(--text-muted)">${esc(c.assignedTeam)}</td></tr>`;});
  h+=`</tbody></table>`;if(!fl.length)h+=`<div style="padding:40px;text-align:center;color:var(--text-muted)">No clients match</div>`;h+=`</div>`;

  const aw=state.clients.flatMap(c=>(metricsCache[c.id]?.warnings||[]).map(w=>({client:c.name,warning:w})));
  if(aw.length)h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title">⚠ Warnings</div>${aw.slice(0,15).map(w=>`<div style="display:flex;gap:12px;padding:6px 12px;background:var(--red-bg);border-radius:var(--radius);margin-bottom:4px;font-size:12px"><span style="font-weight:700;color:var(--red);min-width:180px">${esc(w.client)}</span><span style="color:var(--amber)">${esc(w.warning)}</span></div>`).join("")}</div>`;
  return h;
}

function renderClientsList(){

  let h=renderReadinessCountsStrip();

  fl.forEach(c=>{const m=metricsCache[c.id];const r=readinessFor(c.id);const t=tierFor(c.id);h+=`<div class="card" data-client="${c.id}" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px"><div style="flex:1;min-width:0"><div style="font-weight:700;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px">${esc(c.name)}${t?tierBadgeMini(t):''}</div><div style="font-size:11px;color:var(--text-muted)">${esc(c.entityType)} · ${esc(c.assignedTeam)}</div></div>${badgeHTML(m.overallStatus,1)}</div><div style="margin-bottom:10px">${r?readinessPill(r.state):''}</div>${progressHTML(m.totalPct)}</div>`;});
  h+=`</div>`;return h;
}

// ----- Readiness UI helpers (counts strip + filter select) -----
function renderReadinessCountsStrip(){
  const data=state.clientReadiness;
  if(!data){ setTimeout(ensureReadinessLoaded,0); return `<div style="padding:8px 0;font-size:12px;color:var(--text-muted)">Loading readiness…</div>`; }
  const counts=data.counts||{};
  // Order matches priority — most critical first.
  const order=['high_risk','blocked','filing_due','awaiting_client_approval','awaiting_documents','awaiting_review','partially_ready','ready','idle'];
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px 0">`;
  // "All" reset chip
  const allActive=!state.filterReadiness||state.filterReadiness==='All';
  h+=`<button class="btn btn-sm ${allActive?'btn-primary':''}" data-readiness="All">All (${(data.clients||[]).length})</button>`;
  order.forEach(s=>{
    const n=counts[s]||0;
    if(!n) return; // hide empty buckets
    const m=READINESS_STATE_META[s];
    const active=state.filterReadiness===s;
    h+=`<button class="btn btn-sm" data-readiness="${s}" style="border-left:3px solid ${m.color};${active?'background:var(--bg-elevated);font-weight:700':''}">${esc(m.label)}: ${n}</button>`;
  });
  h+=`</div>`;
  setTimeout(()=>{ document.querySelectorAll('[data-readiness]').forEach(b=>{ b.onclick=()=>{ state.filterReadiness=b.dataset.readiness; render(); }; }); },0);
  return h;
}
function renderReadinessFilterSelect(){
  const opts=['All'].concat(['high_risk','blocked','filing_due','awaiting_client_approval','awaiting_documents','awaiting_review','partially_ready','ready','idle']);
  const labels=Object.assign({All:'All Readiness'}, Object.fromEntries(Object.entries(READINESS_STATE_META).map(([k,v])=>[k,v.label])));
  const cur=state.filterReadiness||'All';
  let h=`<select class="form-input" data-action="filterReadiness" style="min-width:170px">`;
  opts.forEach(o=>{ h+=`<option value="${o}" ${o===cur?'selected':''}>${esc(labels[o])}</option>`; });
  h+=`</select>`;
  return h;
}

function renderDeadlines(){
  const vc=getVisibleClients();
  if(!vc.length)return`<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">No Deadlines</div></div>`;
  const all=vc.flatMap(c=>(metricsCache[c.id]?.deadlines||[]).map(d=>({...d,cn:c.name,cid:c.id})));
  all.sort((a,b)=>(a.days??999)-(b.days??999));
  const sec=(t,items,col)=>{if(!items.length)return"";return`<div style="margin-bottom:24px"><div class="form-label" style="color:${col};font-size:12px;margin-bottom:8px">${t} (${items.length})</div>${items.map(d=>`<div class="deadline-item" data-client="${d.cid}" data-detail="${d.type}"><span style="font-weight:700;color:var(--text-primary);min-width:180px">${esc(d.cn)}</span><span style="font-size:12px;color:var(--text-muted);min-width:130px">${esc(d.label)}</span><span style="font-size:12px;color:var(--text-muted)">${fmtDate(d.date)}</span><span style="font-size:12px;font-weight:700;margin-left:auto;color:${d.days<0?'var(--red)':d.days<=7?'var(--amber)':'var(--blue)'}">${d.days<0?Math.abs(d.days)+'d overdue':d.days+'d'}</span></div>`).join("")}</div>`;};
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:20px">Upcoming Deadlines</h2>`;
  h+=sec("OVERDUE",all.filter(d=>d.days!=null&&d.days<0),"var(--red)");
  h+=sec("DUE WITHIN 30 DAYS",all.filter(d=>d.days!=null&&d.days>=0&&d.days<=30),"var(--amber)");
  h+=sec("LATER",all.filter(d=>d.days==null||d.days>30),"var(--blue)");
  if(!all.length)h+=`<div style="padding:40px;text-align:center;color:var(--text-muted)">No pending deadlines</div>`;
  return h;
}

function renderTeamView(){
  if(!getAssignableUsers().length)return`<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-title">No people yet</div>${isSuperAdmin()?`<button class="btn btn-primary" data-nav="users">👤 Set up people</button>`:`<div style="font-size:12px;color:var(--text-muted)">Ask a Super Admin to add people.</div>`}</div>`;
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="font-size:18px;font-weight:800">Team Workload</h2><button class="btn" data-nav="users">Manage people</button></div>`;
  const ua=state.clients.filter(c=>c.assignedTeam==="Unassigned");
  if(ua.length)h+=`<div class="alert alert-warning" style="margin-bottom:16px">⚠ ${ua.length} client${ua.length!==1?'s':''} unassigned</div>`;
  // A team lead sees their own people, not the whole firm. The server already
  // scoped state.clients to their branch, so the owners appearing in it are
  // exactly their team. Somebody with no clients yet won't show until they
  // have one — which is also the honest answer to "what is my team carrying".
  const roster=isSuperAdmin()
    ? getAssignableUsers()
    : getAssignableUsers().filter(m=>m===currentUser.name||state.clients.some(c=>c.assignedTeam===m));
  if(!isSuperAdmin()&&!roster.length)h+=`<div class="alert alert-warning" style="margin-bottom:16px">No clients are assigned to your team yet.</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">`;
  roster.forEach(member=>{
    const mc=state.clients.filter(c=>c.assignedTeam===member);
    const avg=mc.length?Math.round(mc.reduce((s,c)=>s+(metricsCache[c.id]?.totalPct||0),0)/mc.length):0;
    h+=`<div class="team-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-weight:700;font-size:15px;color:var(--text-primary)">${esc(member)}</div><div style="font-size:11px;color:var(--text-muted)">${mc.length} client${mc.length!==1?'s':''}</div></div></div>${progressHTML(avg)}<div style="margin-top:12px">${mc.length?mc.map(c=>`<div data-client="${c.id}" style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer"><span style="font-size:13px;color:var(--text-secondary)">${esc(c.name)}</span>${badgeHTML(metricsCache[c.id]?.overallStatus||"Not Started",1)}</div>`).join(""):'<div style="padding:12px 0;font-size:12px;color:var(--text-muted);text-align:center">No clients</div>'}</div></div>`;
  });
  h+=`</div>`;return h;
}

function renderDetail(sc,scm){
  switch(state.detailTab){
