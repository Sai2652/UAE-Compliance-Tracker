<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign up — BCL</title>
<script>
  // The Cognito signup flow lives entirely inside login.html now: sign in
  // with the temp password from the invite email, then the NEW_PASSWORD_REQUIRED
  // pane handles setting the real password. This shim page just hands off.
  var url = new URL(window.location.href);
  var target = '/login';
  if (url.searchParams.get('token')) target += '?legacy_signup_token=' + url.searchParams.get('token');
  window.location.replace(target);
</script>
</head>
<body>
  <p style="font-family:system-ui;padding:24px">Redirecting to <a href="/login">the sign-in page</a>…</p>
</body>
</html>
