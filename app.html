// ═══════════════════════════════════════════════════════════════
// EVENT BINDING
// ═══════════════════════════════════════════════════════════════
function bindEvents(){
  // Instant tab highlight — flip .active before the full re-render fires, so
  // the click feels immediate even if the async data hasn't loaded yet.
  document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{
    document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    state.activeTab=el.dataset.nav;state.selectedClientId=null;state.insightsMenuOpen=false;
    render();
  });
  document.querySelectorAll("[data-insight-nav]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.activeTab=el.dataset.insightNav;state.selectedClientId=null;state.insightsMenuOpen=false;
    render();
  });
  // Close Insights dropdown when clicking outside it.
  // bindEvents runs on every render, so if we naively added a listener each
  // time the menu was open, a new one would stack up on every background
  // re-render and the click handler would fire N times on outside-click.
  // Track the single listener at module scope, remove-then-add so we always
  // have exactly one attached while the menu is open, and remove it as soon
  // as the menu closes.
  if(window._insightsOutsideHandler){
    document.removeEventListener('click', window._insightsOutsideHandler);
    window._insightsOutsideHandler=null;
  }
  if(state.insightsMenuOpen){
    setTimeout(()=>{
      const closeOnOutside=(e)=>{
        if(!e.target.closest('#insights-menu') && !e.target.closest('[data-action="toggleInsights"]')){
          state.insightsMenuOpen=false;
          document.removeEventListener('click', closeOnOutside);
          window._insightsOutsideHandler=null;
          render();
        }
      };
      window._insightsOutsideHandler=closeOnOutside;
      document.addEventListener('click', closeOnOutside);
    },0);
  }
  document.querySelectorAll("[data-client]").forEach(el=>el.onclick=(e)=>{if(e.target.closest("select,input,button,.tm-remove"))return;state.selectedClientId=el.dataset.client;state.detailTab=el.dataset.detail||"overview";render();});
  document.querySelectorAll("[data-detail-nav]").forEach(el=>el.onclick=()=>{state.detailTab=el.dataset.detailNav;render();});

  document.querySelectorAll("[data-action]").forEach(el=>{
    const a=el.dataset.action;
    if(a==="openAddClient")el.onclick=()=>{state.showModal="addClient";state.bulkClients=[];render();};
    // ---- User Management
    if(a==="reloadUsers")el.onclick=()=>loadOrgPeople(true);
    if(a==="toggleInvite")el.onclick=()=>{usersState.inviteOpen=!usersState.inviteOpen;render();};
    if(a==="inviteName")el.onclick=()=>{
      // Pre-fill the invite from a name that already holds clients, so the
      // spelling matches and their existing clients stay with them.
      usersState.inviteOpen=true;render();
      setTimeout(()=>{const f=document.getElementById("invName");if(f){f.value=el.dataset.name;f.focus();}},0);
    };
    if(a==="sendInvite")el.onclick=()=>{
      const name=document.getElementById("invName")?.value?.trim();
      const email=document.getElementById("invEmail")?.value?.trim();
      const role=document.getElementById("invRole")?.value||"user";
      const reports_to=document.getElementById("invReports")?.value||null;
      if(!name||!email){alert("Name and email are both needed.");return;}
      userAction(async()=>{
        await apiJSON('/api/invite',{method:'POST',body:JSON.stringify({name,email,role,reports_to:reports_to||null})});
        usersState.inviteOpen=false;
        alert('Invite sent to '+email+'.');
      },'Sending the invite…');
    };
    if(a==="resetPwd")el.onclick=()=>{
      if(!confirm('Send a password reset to '+el.dataset.name+'?'))return;
      userAction(async()=>{ await apiJSON('/api/users/'+el.dataset.id+'/reset-password',{method:'POST',body:JSON.stringify({})}); alert('Reset sent.'); },'Sending the reset…');
    };
    if(a==="toggleActive")el.onclick=()=>{
      const on=el.dataset.active==='1';
      if(!confirm((on?'Deactivate ':'Reactivate ')+el.dataset.name+'?'+(on?'\n\nThey keep their clients — move those in Workload if somebody else should pick them up.':'')))return;
      userAction(async()=>{ await apiJSON('/api/users/'+el.dataset.id+'/'+(on?'deactivate':'activate'),{method:'PUT',body:JSON.stringify({})}); },on?'Deactivating…':'Reactivating…');
    };
    if(a==="deleteUser")el.onclick=()=>{
      const name=el.dataset.name, held=parseInt(el.dataset.clients||'0',10);
      // Deleting is permanent and there's no undo, so make the person type the
      // name. A yes/no box is too easy to click past on the wrong row.
      const typed=prompt(
        'Delete '+name+' permanently?\n\n'+
        'This removes the account and their sign-in. It cannot be undone —\n'+
        'use Deactivate instead if they might come back.\n\n'+
        (held?('They hold '+held+' client'+(held===1?'':'s')+'. Deleting leaves those\nclients with an owner who no longer exists — reassign them in\nWorkload first if you can.\n\n'):'')+
        'Type the name to confirm:');
      if(typed===null) return;
      if(typed.trim()!==name.trim()){ alert('That did not match "'+name+'" — nothing was deleted.'); return; }
      userAction(async()=>{
        let r;
        try{
          r=await apiJSON('/api/users/'+el.dataset.id,{method:'DELETE'});
        }catch(e){
          // The server refuses a delete that would strand clients unless we say
          // we accept it. Ask once more, naming the number, then repeat.
          if(String(e&&e.message||'').indexOf('holds_clients')<0) throw e;
          if(!confirm(name+' still holds clients.\n\nDelete anyway and leave them unassigned?')) return;
          r=await apiJSON('/api/users/'+el.dataset.id+'?orphanClients=yes',{method:'DELETE'});
        }
        if(r&&r.clientsOrphaned) alert(name+' deleted. '+r.clientsOrphaned+' client'+(r.clientsOrphaned===1?' is':'s are')+' now unassigned — reassign in Workload.');
      },'Deleting…');
    };

    // ---- Workload
    if(a==="wlReload")el.onclick=()=>loadWorkload(true);
    if(a==="wlSuggest")el.onclick=()=>loadWorkloadSuggestions();
    if(a==="wlClearSuggest")el.onclick=()=>{wlState.suggestions=null;wlState.selected=new Set();render();};
    if(a==="wlApply")el.onclick=()=>applyWorkloadMoves();

    if(a==="openOpsMkt")el.onclick=()=>{state.showModal="opsMkt";opsState.preview=null;opsState.error='';render();loadOpsMkt();};
    if(a==="opsPreview")el.onclick=()=>previewOpsMkt();
    if(a==="opsFetch")el.onclick=()=>runOpsMktFetch();
    if(a==="opsRefresh")el.onclick=()=>runOpsMktRefresh();
    if(a==="openAddVatReturn")el.onclick=()=>{state.showModal="addVatReturn";render();};
    if(a==="openAddCredential")el.onclick=()=>{state.showModal="addCredential";render();};
    if(a==="closeModal")el.onclick=()=>{state.showModal=null;render();};
    if(a==="backToList")el.onclick=()=>{state.selectedClientId=null;render();};
    if(a==="logout")el.onclick=()=>{logout();};
    if(a==="applyUpdate")el.onclick=()=>{
      // Remember what we're moving to, so the next boot doesn't immediately
      // announce the same update again before its first poll lands.
      try{ localStorage.setItem(versionState.seenKey, (versionState.latest&&versionState.latest.sha)||''); }catch(e){}
      location.reload();
    };
    if(a==="checkUpdate")el.onclick=async()=>{
      el.disabled=true; el.textContent='Checking…';
      await checkVersion();
      render();
      if(!versionState.updateAvailable){ el.disabled=false; el.textContent='Check again'; }
    };
    if(a==="toggleTheme")el.onclick=()=>{
      const isLight=document.documentElement.classList.toggle('theme-light');
      try{ localStorage.setItem('theme', isLight?'light':'dark'); }catch(e){}
      // Re-render so the sidebar label ("Light theme"/"Dark theme") updates.
      render();
    };
    // Search input — updates state.search immediately on every keystroke, but
    // only re-renders after 150ms of quiet. Two reasons for that split:
    //   1. If a background loader triggers a render mid-typing, the input is
    //      rebuilt from state.search — if state.search were stale, everything
    //      the user just typed would be silently wiped.
    //   2. Filtering the client list on every keystroke would be wasteful.
    // Focus + caret position are preserved by _restoreFocus in the render loop.
    if(a==="search")el.oninput=(e)=>{
      state.search = e.target.value;
      clearTimeout(window._searchDebounce);
      window._searchDebounce=setTimeout(render, 150);
    };
    if(a==="filterStatus")el.onchange=(e)=>{state.filterStatus=e.target.value;render();};
    if(a==="filterTeam")el.onchange=(e)=>{state.filterTeam=e.target.value;render();};
    if(a==="filterReadiness")el.onchange=(e)=>{state.filterReadiness=e.target.value;render();};
    if(a==="filterClientTier")el.onchange=(e)=>{state.filterClientTier=e.target.value;render();};
    if(a==="toggleSortTier")el.onclick=()=>{state.sortByTier=!state.sortByTier;render();};
    if(a==="toggleInsights")el.onclick=(e)=>{e.stopPropagation();state.insightsMenuOpen=!state.insightsMenuOpen;render();};
    if(a==="removeClient")el.onclick=()=>{if(!confirm("Remove?"))return;state.clients=state.clients.filter(c=>c.id!==el.dataset.id);state.selectedClientId=null;updateAndSave();};

    // Bulk add
    if(a==="addToList")el.onclick=()=>{
      const n=document.getElementById("bcName")?.value?.trim();if(!n){alert("Enter client name");return;}
      if(state.bulkClients.some(c=>c.name.toLowerCase()===n.toLowerCase())){alert("Already in list");return;}
      state.bulkClients.push({name:n,entityType:document.getElementById("bcEntity")?.value,businessNature:document.getElementById("bcNature")?.value||"Not Recorded",assignedTeam:document.getElementById("bcTeam")?.value||"Unassigned",vatApplicable:document.getElementById("bcVAT")?.value||"Yes",ctApplicable:document.getElementById("bcCT")?.checked??true});
      render();setTimeout(()=>{const i=document.getElementById("bcName");if(i)i.focus();},0);
    };
    if(a==="removeBulkItem")el.onclick=()=>{state.bulkClients.splice(parseInt(el.dataset.idx),1);render();};
    if(a==="clearBulkList")el.onclick=()=>{state.bulkClients=[];render();};
    if(a==="saveBulkClients")el.onclick=()=>{
      if(!state.bulkClients.length)return;
      state.bulkClients.forEach(bc=>{const c=createBlankClient(bc);if(bc.ctDueDate)c.ct.dueDate=bc.ctDueDate;state.clients.push(c);});
      state.bulkClients=[];state.showModal=null;updateAndSave();
    };
    if(a==="downloadTemplate")el.onclick=(e)=>{e.preventDefault();generateTemplateXLSX();};

    // Team

    // 5) VAT Return
    if(a==="saveVatReturn")el.onclick=()=>{
      const fy=document.getElementById("vrFY")?.value||"";
      const label=document.getElementById("vrLabel")?.value?.trim();
      const due=document.getElementById("vrDueDate")?.value;
      if(!label||!due){alert("Enter both label and date");return;}
      const sc=getClient(state.selectedClientId);if(!sc)return;
      sc.vat.returnDates.push({id:uid(),period:label,dueDate:due,fy:fy,filingStatus:"Not Started",paymentStatus:"Not Started"});
      sc.vat.returnDates.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
      markUpdated(sc);state.showModal=null;updateAndSave();
    };
    if(a==="removeVatReturn")el.onclick=()=>{const sc=getClient(el.dataset.cid);if(!sc)return;sc.vat.returnDates.splice(parseInt(el.dataset.idx),1);markUpdated(sc);updateAndSave();};

    // 3) Add credential
    if(a==="saveCredential")el.onclick=()=>{
      const nm=document.getElementById("credName")?.value?.trim();if(!nm){alert("Enter portal name");return;}
      const sc=getClient(state.selectedClientId);if(!sc)return;
      sc.logins.push({id:uid(),name:nm,enabled:false,username:"",password:"",createdAt:"",lastModified:""});
      markUpdated(sc);state.showModal=null;updateAndSave();
    };
    if(a==="removeCredential")el.onclick=()=>{const sc=getClient(el.dataset.cid);if(!sc)return;const idx=parseInt(el.dataset.idx);if(DEFAULT_PORTALS.includes(sc.logins[idx]?.name))return;sc.logins.splice(idx,1);markUpdated(sc);updateAndSave();};

    // 4) Change FY
    if(a==="changeFY")el.onchange=(e)=>{
      const sc=getClient(el.dataset.cid);if(!sc)return;
      const newFY=e.target.value;sc.accounting.financialYear=newFY;
      const newMS={};MONTHS.forEach((m,i)=>{const key=`${newFY}-${String(i+1).padStart(2,'0')}`;newMS[key]=sc.accounting.monthlyStatus[key]||"Not Started";});
      sc.accounting.monthlyStatus=newMS;markUpdated(sc);updateAndSave();
    };
    if(a==="changeScopeStart")el.onchange=(e)=>{
      const sc=getClient(el.dataset.cid);if(!sc)return;
      // Just record the date. Nothing else to do — every derived view reads
      // through isBeforeScope(), so this is fully reversible.
      sc.scopeStart=e.target.value;
      markUpdated(sc);updateAndSave();
    };

    // VAT FY switcher — syncs with accounting FY
    if(a==="changeVatFY")el.onchange=(e)=>{
      const sc=getClient(el.dataset.cid);if(!sc)return;
      const newFY=e.target.value;sc.accounting.financialYear=newFY;
      const newMS={};MONTHS.forEach((m,i)=>{const key=`${newFY}-${String(i+1).padStart(2,'0')}`;newMS[key]=sc.accounting.monthlyStatus[key]||"Not Started";});
      sc.accounting.monthlyStatus=newMS;markUpdated(sc);updateAndSave();
    };

    // Password toggle
    if(a==="togglePwd")el.onclick=()=>{const idx=el.dataset.idx;const inp=document.querySelector(`[data-login-field="password"][data-login-idx="${idx}"]`);if(inp)inp.type=inp.type==="password"?"text":"password";};
    if(a==="launchPortal")el.onclick=()=>launchPortal(el.dataset.cid,parseInt(el.dataset.idx));
  });

  // Enter keys
  const bcI=document.getElementById("bcName");if(bcI)bcI.onkeydown=(e)=>{if(e.key==="Enter"){e.preventDefault();document.querySelector('[data-action="addToList"]')?.click();}};

  // Role and reporting line are saved together — the endpoint takes both, and
  // promoting somebody to team lead without saying who reports to them makes
  // a lead with an empty team.
  document.querySelectorAll("[data-user-role]").forEach(el=>{el.onchange=()=>{
    const id=el.dataset.userRole;
    const rep=document.querySelector('[data-user-reports="'+id+'"]');
    userAction(async()=>{ await apiJSON('/api/users/'+id+'/role',{method:'PUT',body:JSON.stringify({role:el.value,reports_to:rep&&rep.value?rep.value:null})}); },'Saving the role…');
  };});
  document.querySelectorAll("[data-user-reports]").forEach(el=>{el.onchange=()=>{
    const id=el.dataset.userReports;
    const rl=document.querySelector('[data-user-role="'+id+'"]');
    userAction(async()=>{ await apiJSON('/api/users/'+id+'/role',{method:'PUT',body:JSON.stringify({role:rl?rl.value:undefined,reports_to:el.value||null})}); },'Saving the reporting line…');
  };});

  // Workload month picker and move ticks.
  const wlm=document.getElementById("wlMonth");
  if(wlm)wlm.onchange=()=>{wlState.month=wlm.value;loadWorkload(true);};
  document.querySelectorAll("[data-wl-move]").forEach(el=>{el.onchange=()=>{
    const i=parseInt(el.dataset.wlMove,10);
    if(el.checked)wlState.selected.add(i);else wlState.selected.delete(i);
    render();
  };});

  // Ops-Mkt fetch modal: POC ticks, the active-only filter and the nightly
  // switch. Ticking a POC clears any preview on screen — it described a
  // different selection, and leaving it up would invite fetching the wrong one.
  document.querySelectorAll("[data-ops-poc]").forEach(el=>{el.onchange=()=>{
    const p=el.dataset.opsPoc;
    if(el.checked)opsState.selected.add(p);else opsState.selected.delete(p);
    opsState.preview=null;render();
  };});
  const oao=document.getElementById("opsActiveOnly");
  if(oao)oao.onchange=()=>{opsState.activeOnly=oao.checked;opsState.preview=null;render();};
  const oat=document.getElementById("opsAuto");
  if(oat)oat.onchange=()=>setOpsMktAutoSync(oat.checked);

  // Entity-type guidance follows the selection. Swapped in place rather than
  // through render() so the half-typed client name in the form survives.
  const bcE=document.getElementById("bcEntity");
  if(bcE)bcE.onchange=()=>{const t=document.getElementById("bcEntityHint");if(t)t.textContent=entityHintFor(bcE.value);};
  document.querySelectorAll('[data-entity-hint-for]').forEach(sel=>{
    sel.onchange=()=>{const t=document.getElementById(sel.dataset.entityHintFor);if(t)t.textContent=entityHintFor(sel.value);};
  });

  // Excel file import
  const dz=document.getElementById("dropZone"),fi=document.getElementById("excelFileInput");
  if(dz&&fi){
    dz.onclick=()=>fi.click();
    fi.onchange=(e)=>{if(e.target.files[0])processExcelFile(e.target.files[0]);};
    dz.ondragover=(e)=>{e.preventDefault();dz.style.borderColor='var(--accent)';dz.style.background='var(--accent-soft)';};
    dz.ondragleave=(e)=>{e.preventDefault();dz.style.borderColor='var(--border)';dz.style.background='var(--bg-card)';};
    dz.ondrop=(e)=>{e.preventDefault();dz.style.borderColor='var(--border)';dz.style.background='var(--bg-card)';if(e.dataTransfer.files[0])processExcelFile(e.dataTransfer.files[0]);};
  }

  // VAT certificate upload
  const vatDz=document.getElementById("vatCertDrop"),vatFi=document.getElementById("vatCertInput");
  if(vatDz&&vatFi){
    vatDz.onclick=()=>vatFi.click();
    vatFi.onchange=(e)=>{if(e.target.files[0]&&state.selectedClientId)extractCertificateData(e.target.files[0],"vat",state.selectedClientId);};
    vatDz.ondragover=(e)=>{e.preventDefault();vatDz.style.borderColor='var(--accent)';vatDz.style.background='var(--accent-soft)';};
    vatDz.ondragleave=(e)=>{e.preventDefault();vatDz.style.borderColor='var(--border)';vatDz.style.background='var(--bg-card)';};
    vatDz.ondrop=(e)=>{e.preventDefault();vatDz.style.borderColor='var(--border)';vatDz.style.background='var(--bg-card)';if(e.dataTransfer.files[0]&&state.selectedClientId)extractCertificateData(e.dataTransfer.files[0],"vat",state.selectedClientId);};
  }

  // CT certificate upload
  const ctDz=document.getElementById("ctCertDrop"),ctFi=document.getElementById("ctCertInput");
  if(ctDz&&ctFi){
    ctDz.onclick=()=>ctFi.click();
    ctFi.onchange=(e)=>{if(e.target.files[0]&&state.selectedClientId)extractCertificateData(e.target.files[0],"ct",state.selectedClientId);};
    ctDz.ondragover=(e)=>{e.preventDefault();ctDz.style.borderColor='var(--accent)';ctDz.style.background='var(--accent-soft)';};
    ctDz.ondragleave=(e)=>{e.preventDefault();ctDz.style.borderColor='var(--border)';ctDz.style.background='var(--bg-card)';};
    ctDz.ondrop=(e)=>{e.preventDefault();ctDz.style.borderColor='var(--border)';ctDz.style.background='var(--bg-card)';if(e.dataTransfer.files[0]&&state.selectedClientId)extractCertificateData(e.dataTransfer.files[0],"ct",state.selectedClientId);};
  }

  // Client fields
  document.querySelectorAll("[data-client-field]").forEach(el=>{el.onchange=(e)=>{const c=getClient(el.dataset.clientField);if(c){c.assignedTeam=e.target.value;markUpdated(c);updateAndSave();}};});
  document.querySelectorAll("[data-client-vatapp]").forEach(el=>{el.onchange=(e)=>{const c=getClient(el.dataset.clientVatapp);if(c){c.vatApplicable=e.target.value;if(e.target.value==="Yes"&&!c.vat.returnDates.length){}if(e.target.value==="No")c.documents["VAT Registration"]="N/A";else if(c.documents["VAT Registration"]==="N/A")c.documents["VAT Registration"]="Pending";markUpdated(c);updateAndSave();}};});
  // Entity type and nature. Picking an entity type by hand clears the
  // "guessed" flag — a person has now looked at it, which is the whole point
  // of the warning, so the warning goes away.
  // This select also carries data-entity-hint-for, and this assignment runs
  // after that one — so the hint has to be refreshed here or it would never
  // update, the later onchange having replaced the earlier handler.
  document.querySelectorAll("[data-client-entity]").forEach(el=>{el.onchange=(e)=>{
    const t=el.dataset.entityHintFor?document.getElementById(el.dataset.entityHintFor):null;
    if(t)t.textContent=entityHintFor(e.target.value);
    const c=getClient(el.dataset.clientEntity);
    if(c){c.entityType=e.target.value;c.entityTypeGuessed=false;markUpdated(c);updateAndSave();}
  };});
  document.querySelectorAll("[data-client-nature]").forEach(el=>{el.onchange=(e)=>{const c=getClient(el.dataset.clientNature);if(c){c.businessNature=e.target.value;markUpdated(c);updateAndSave();}};});
  // Blocked reasons (per-item)
  document.querySelectorAll("[data-blocked-reason]").forEach(el=>{el.onchange=(e)=>{const c=getClient(el.dataset.cid);if(c){if(!c.blockedReasons)c.blockedReasons={};c.blockedReasons[el.dataset.blockedReason]=e.target.value;markUpdated(c);updateAndSave();}};});

  // Accounting
  document.querySelectorAll("[data-acct-key]").forEach(el=>{el.onchange=(e)=>{const c=getClient(el.dataset.cid);if(c){c.accounting.monthlyStatus[el.dataset.acctKey]=e.target.value;markUpdated(c);updateAndSave();}};});
  document.querySelectorAll("[data-mis-key]").forEach(el=>{el.onchange=(e)=>{
    const c=getClient(el.dataset.cid);if(!c)return;
    const key=el.dataset.misKey;
    // A report can't honestly be marked issued while the month it reports on is
    // still open. Say why rather than silently accepting it.
    if(e.target.value==="Issued"&&c.accounting.monthlyStatus[key]!=="Completed"){
      alert(`Cannot mark the ${formatMonthKey(key)} MIS as issued.\n\nThe books for that month are not closed yet.`);
      e.target.value=((c.mis&&c.mis.monthlyStatus)||{})[key]||"Not Issued";
      return;
    }
    if(!c.mis)c.mis={monthlyStatus:{}};
    if(!c.mis.monthlyStatus)c.mis.monthlyStatus={};
    c.mis.monthlyStatus[key]=e.target.value;
    markUpdated(c);updateAndSave();
  };});

  // VAT
  document.querySelectorAll("[data-vat-field]").forEach(el=>{el.onchange=(e)=>{const c=getClient(el.dataset.cid);if(!c)return;const idx=parseInt(el.dataset.vatIdx);const f=el.dataset.vatField;const v=e.target.value;if(f==="filingStatus"&&v==="Completed"){const r=c.vat.returnDates[idx];if(r){const chk=checkPeriodAccounting(c,r.period);if(!chk.complete){const pendingMonths=chk.pending.map(formatMonthKey).join(", ");alert(`⚠ Cannot complete VAT filing for ${r.period}.\n\nAccounting is not completed for: ${pendingMonths}\n\nPlease complete accounting for these months first.`);e.target.value=c.vat.returnDates[idx].filingStatus;return;}}}c.vat.returnDates[idx][f]=v;markUpdated(c);updateAndSave();};});

  // CT
  document.querySelectorAll("[data-ct-field]").forEach(el=>{const handler=(e)=>{const c=getClient(el.dataset.cid);if(!c)return;const f=el.dataset.ctField;const v=e.target.value;if(f==="status"&&v==="Completed"){const m=calcMetrics(c);if(m.acctPct<100){alert("⚠ Cannot complete CT before accounting.");e.target.value=c.ct.status;return;}}c.ct[f]=v;if(f==="dueDate"&&v){c.ct.financialYear=String(parseInt(v.substring(0,4))-1);}markUpdated(c);updateAndSave();};if(el.tagName==="TEXTAREA")el.onblur=handler;else el.onchange=handler;});

  // Documents
  document.querySelectorAll("[data-doc]").forEach(el=>{el.onclick=()=>{const c=getClient(el.dataset.cid);if(c){c.documents[el.dataset.doc]=el.dataset.docVal;markUpdated(c);updateAndSave();}};});

  // Data toggles
  document.querySelectorAll("[data-toggle]").forEach(el=>{const n=el.dataset.toggle;el.onchange=(e)=>{
    if(n.startsWith("login_")){
      const parts=n.split("_");const idx=parseInt(parts[1]);const cid=parts.slice(2).join("_");
      const c=getClient(cid);if(c&&c.logins[idx]){c.logins[idx].enabled=e.target.checked;if(e.target.checked&&!c.logins[idx].createdAt)c.logins[idx].createdAt=nowISO();markUpdated(c);updateAndSave();}
    }
  };});

  // Login fields — username & password with timestamp tracking
  document.querySelectorAll("[data-login-field]").forEach(el=>{el.onchange=(e)=>{
    const c=getClient(el.dataset.cid);if(!c)return;
    const idx=parseInt(el.dataset.loginIdx);const f=el.dataset.loginField;
    if(c.logins[idx]){
      c.logins[idx][f]=e.target.value;
      // Created/Modified track the credential itself, so that a rotation is
      // visible. Correcting a portal address isn't a credential change.
      if(f!=="url"){
        c.logins[idx].lastModified=nowISO();
        if(!c.logins[idx].createdAt)c.logins[idx].createdAt=nowISO();
      }
      markUpdated(c);updateAndSave();
    }
  };});
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD NAVIGATION
// ═══════════════════════════════════════════════════════════════
// Ordered to follow the real client lifecycle: you onboard (KYC docs) before you
// can do any bookkeeping, and you close books before you can file VAT or CT.
// Login credentials sit last — a reference you dip into, not a step in the flow.
const DETAIL_TABS=["overview","documents","accounting","vat","ct","logins"];
// Visible top-level tabs only (Insights items + legacy routes still navigable, but not in keyboard cycle).
const HEADER_TABS=["morning","priority","dashboard","calendar","tasks","aiAssist","team"];

document.addEventListener("keydown",(e)=>{
  // Skip if user is typing in an input, select, or textarea
  const tag=document.activeElement?.tagName;
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;

  // Escape — close modal or go back
  if(e.key==="Escape"){
    if(state.showModal){state.showModal=null;render();return;}
    if(state.selectedClientId){state.selectedClientId=null;render();return;}
    return;
  }

  // Arrow Up / Down — navigate detail tabs (when client is open)
  if(state.selectedClientId && (e.key==="ArrowUp"||e.key==="ArrowDown")){
    e.preventDefault();
    const idx=DETAIL_TABS.indexOf(state.detailTab);
    if(idx===-1) return;
    if(e.key==="ArrowDown"&&idx<DETAIL_TABS.length-1){state.detailTab=DETAIL_TABS[idx+1];render();}
    else if(e.key==="ArrowUp"&&idx>0){state.detailTab=DETAIL_TABS[idx-1];render();}
    return;
  }

  // Arrow Left / Right — navigate header tabs (when no client is open)
  if(!state.selectedClientId && !state.showModal && (e.key==="ArrowLeft"||e.key==="ArrowRight")){
    e.preventDefault();
    const idx=HEADER_TABS.indexOf(state.activeTab);
    if(idx===-1) return;
    if(e.key==="ArrowRight"&&idx<HEADER_TABS.length-1){state.activeTab=HEADER_TABS[idx+1];render();}
    else if(e.key==="ArrowLeft"&&idx>0){state.activeTab=HEADER_TABS[idx-1];render();}
    return;
  }

  // Enter on dashboard/clients — open first or focused client
  if(!state.selectedClientId && e.key==="Enter"){
    const firstClient=document.querySelector("[data-client]");
    if(firstClient){state.selectedClientId=firstClient.dataset.client;state.detailTab="overview";render();}
    return;
  }

  // Backspace — go back (when no input focused)
  if(e.key==="Backspace" && state.selectedClientId){
    e.preventDefault();
    state.selectedClientId=null;render();
    return;
  }
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
// Load user and data from server
(async()=>{
  await loadCurrentUser();
  refreshMetrics();render();
  try{
    const s=await loadData();
    if(s&&typeof s==="object"){
      // teamMembers is still read and written back untouched so the old list
      // is not destroyed, but nothing in the UI uses it any more — people come
      // from the login users below.
      if(Array.isArray(s.teamMembers))state.teamMembers=s.teamMembers;
      if(Array.isArray(s.clients))state.clients=s.clients;
      refreshMetrics();render();
    }
  }catch(e){console.warn("Load error:",e);}
  // Who clients can be assigned to. Every assignment dropdown reads this, so
  // it loads at boot rather than when User Management is first opened.
  if(isAdmin()){ try{ await loadOrgPeople(true); }catch(e){ console.warn("People load error:",e); } }
  // Establishes which build this page is, then watches for a newer one.
  startVersionWatch();
})();
</script>
