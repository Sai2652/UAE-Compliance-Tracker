<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — UAE Compliance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#080b12;color:#e8ecf4;min-height:100vh;line-height:1.5}
.header{background:#111722;border-bottom:1px solid #1c2538;padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3d7aed,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#080b12}
.header-nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.header-nav a{color:#8a95aa;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px;transition:0.2s}
.header-nav a:hover{background:#1a2234;color:#e8ecf4}
.header-nav a.active{background:#1a2234;color:#3d7aed}
.main{max-width:900px;margin:0 auto;padding:24px}
.card{background:#111722;border:1px solid #1c2538;border-radius:12px;padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #1c2538;background:#1a2234;color:#8a95aa;font-size:12px;font-weight:600;cursor:pointer;transition:0.2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{border-color:#243048;color:#e8ecf4}
.btn-primary{background:#3d7aed;border-color:#3d7aed;color:#fff}
.btn-primary:hover{background:#2d6adc}
.btn-danger{color:#ef4444;border-color:rgba(239,68,68,0.3)}
.btn-sm{padding:4px 10px;font-size:11px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:10px;font-weight:700;color:#5a6578;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
.form-input{width:100%;background:#0e1420;color:#e8ecf4;border:1px solid #1c2538;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;font-family:inherit}
.form-input:focus{border-color:#3d7aed}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:#5a6578;text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid #1c2538}
td{padding:12px 14px;border-bottom:1px solid #1c2538;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-admin{background:rgba(61,122,237,0.15);color:#3d7aed}
.badge-member{background:rgba(100,116,139,0.15);color:#64748b}
.badge-active{background:rgba(34,197,94,0.15);color:#22c55e}
.badge-inactive{background:rgba(239,68,68,0.15);color:#ef4444}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}
.alert-success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#22c55e}
.alert-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444}
.alert-info{background:rgba(61,122,237,0.1);border:1px solid rgba(61,122,237,0.2);color:#3d7aed}
.invite-link{background:#0e1420;border:1px solid #1c2538;border-radius:8px;padding:10px 14px;font-size:12px;color:#8a95aa;word-break:break-all;margin-top:8px}
.activity-item{padding:8px 0;border-bottom:1px solid #1c2538;font-size:12px;display:flex;gap:12px}
.activity-item:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-mark">CT</div><div style="font-weight:800;font-size:15px">Admin Panel</div></div>
  <div class="header-nav">
    <a href="/">← Back to Tracker</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="main">
  <div id="alerts"></div>

  <!-- Invite Section -->
  <div class="card">
    <div class="card-title">📧 Invite Team Member</div>
    <form id="inviteForm" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div class="form-label">Email</div>
        <input class="form-input" type="email" id="inviteEmail" placeholder="team@yourfirm.com" required>
      </div>
      <div style="flex:1;min-width:150px">
        <div class="form-label">Name</div>
        <input class="form-input" type="text" id="inviteName" placeholder="Full name" required>
      </div>
      <button class="btn btn-primary" type="submit">Send Invite</button>
    </form>
    <div id="inviteResult" style="margin-top:12px"></div>
  </div>

  <!-- Users Table -->
  <div class="card">
    <div class="card-title">👥 Team Members</div>
    <div id="usersTable">Loading...</div>
  </div>

  <!-- Activity Log -->
  <div class="card">
    <div class="card-title">📋 Recent Activity</div>
    <div id="activityLog">Loading...</div>
  </div>
</div>

<script>
async function api(url, opts = {}) {
  const res = await fetch('/api' + url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { window.location.href = '/login'; return null; }
  return await res.json();
}

function showAlert(msg, type = 'success') {
  document.getElementById('alerts').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => document.getElementById('alerts').innerHTML = '', 5000);
}

async function loadUsers() {
  const data = await api('/users');
  if (!data) return;
  let html = '<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>';
  data.users.forEach(u => {
    html += `<tr>
      <td style="font-weight:600">${u.name}</td>
      <td style="color:#8a95aa">${u.email}</td>
      <td><span class="badge badge-${u.role}">${u.role}</span></td>
      <td><span class="badge badge-${u.active ? 'active' : 'inactive'}">${u.active ? 'Active' : 'Inactive'}</span></td>
      <td style="font-size:12px;color:#5a6578">${u.last_login ? new Date(u.last_login).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'Never'}</td>
      <td>
        <button class="btn btn-sm" onclick="resetUserPassword(${u.id},'${u.name}')" style="margin-right:4px">🔑 Reset PW</button>
        ${u.role !== 'admin' ? `
          <button class="btn btn-sm" onclick="toggleRole(${u.id},'${u.role === 'admin' ? 'member' : 'admin'}')">${u.role === 'admin' ? 'Demote' : 'Make Admin'}</button>
          <button class="btn btn-sm ${u.active ? 'btn-danger' : ''}" onclick="${u.active ? `deactivateUser(${u.id})` : `activateUser(${u.id})`}">${u.active ? 'Disable' : 'Enable'}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id},'${u.name}')">🗑 Delete</button>
        ` : '<span style="color:#5a6578;font-size:11px">Primary Admin</span>'}
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('usersTable').innerHTML = html;
}

async function loadActivity() {
  const data = await api('/activity?limit=30');
  if (!data) return;
  let html = '';
  data.activities.forEach(a => {
    html += `<div class="activity-item">
      <span style="color:#5a6578;min-width:130px">${new Date(a.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
      <span style="font-weight:600;min-width:100px;color:#3d7aed">${a.user_name || 'System'}</span>
      <span style="color:#8a95aa">${a.action}</span>
      <span style="color:#5a6578">${a.details || ''}</span>
    </div>`;
  });
  document.getElementById('activityLog').innerHTML = html || '<div style="color:#5a6578;text-align:center;padding:20px">No activity yet</div>';
}

// Invite form
document.getElementById('inviteForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('inviteEmail').value;
  const name = document.getElementById('inviteName').value;

  const data = await api('/invite', { method: 'POST', body: JSON.stringify({ email, name }) });
  if (!data) return;

  if (data.ok) {
    let html = `<div class="alert alert-success">${data.message}</div>`;
    if (data.manualLink) {
      html += `<div class="invite-link"><strong>Share this link:</strong><br>${data.manualLink}</div>`;
    }
    document.getElementById('inviteResult').innerHTML = html;
    document.getElementById('inviteEmail').value = '';
    document.getElementById('inviteName').value = '';
    loadUsers();
  } else {
    document.getElementById('inviteResult').innerHTML = `<div class="alert alert-error">${data.error}</div>`;
  }
};

async function toggleRole(id, newRole) {
  await api(`/users/${id}/role`, { method: 'PUT', body: JSON.stringify({ role: newRole }) });
  showAlert('Role updated'); loadUsers();
}

async function deactivateUser(id) {
  if (!confirm('Disable this user? They will not be able to log in.')) return;
  await api(`/users/${id}/deactivate`, { method: 'PUT' });
  showAlert('User disabled'); loadUsers();
}

async function activateUser(id) {
  await api(`/users/${id}/activate`, { method: 'PUT' });
  showAlert('User enabled'); loadUsers();
}

async function resetUserPassword(id, name) {
  const pw = prompt(`Enter new password for ${name} (min 6 chars):`);
  if (!pw || pw.length < 6) { if(pw) alert('Password must be at least 6 characters'); return; }
  const data = await api(`/users/${id}/reset-password`, { method: 'PUT', body: JSON.stringify({ password: pw }) });
  if (data && data.ok) showAlert(`Password reset for ${name}`);
  else showAlert('Failed to reset password', 'error');
}

async function deleteUser(id, name) {
  if (!confirm(`Permanently delete ${name}? This cannot be undone.`)) return;
  const data = await api(`/users/${id}`, { method: 'DELETE' });
  if (data && data.ok) { showAlert(`${name} deleted`); loadUsers(); }
  else showAlert('Failed to delete user', 'error');
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

// Init
loadUsers();
loadActivity();
</script>
</body>
</html>
