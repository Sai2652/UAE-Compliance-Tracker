const phase3={ command:null, analyticsTab:'capacity', range:'30',
  capacity:null, workloadRecs:null, productivity:null, kpis:null, forecast:null,
  reviewQueue:null, communication:null };

function trendArrow(delta){
  if(delta===null||delta===undefined) return '<span style="color:var(--text-muted)">—</span>';
  if(delta===0) return '<span style="color:var(--text-muted)">→ 0%</span>';
  const c=delta>0?'var(--green)':'var(--red)';
  const arrow=delta>0?'▲':'▼';
  return `<span style="color:${c};font-weight:700">${arrow} ${Math.abs(delta)}%</span>`;
}
function bandPill(band){
  const c={healthy:'var(--green)',balanced:'var(--green)',watch:'var(--blue)',underutilized:'var(--blue)',at_risk:'var(--amber)',overloaded:'var(--red)',critical:'var(--red)',unknown:'var(--text-muted)'}[band]||'var(--text-muted)';
  return `<span style="padding:2px 8px;border-radius:10px;background:var(--bg-elevated);color:${c};font-weight:700;font-size:11px">${(band||'').replace(/_/g,' ')}</span>`;
}

// ----- Command Center -----
async function loadCommand(){ try{ phase3.command=await apiJSON('/api/ops/command-center'); render(); }catch(e){ console.error(e);} }
function renderCommandCenter(){
  if(!phase3.command){ setTimeout(loadCommand,0); return `<div class="empty-state"><div class="empty-state-icon">⚡</div><div class="empty-state-title">Loading command center…</div></div>`; }
  if(!state.clientReadiness){ setTimeout(ensureReadinessLoaded,0); }
  if(!reportsState.attention){ setTimeout(loadReportAttention,0); }
  const x=phase3.command;
  let h=`<div class="card-title" style="margin-bottom:12px">⚡ Manager Command Center</div>`;
  if(x.insights && x.insights.length){
    h+=`<div class="card" style="border-color:var(--accent-soft);margin-bottom:16px"><div class="card-title">Actionable Insights</div><ul style="margin:8px 0 0 18px;padding:0;font-size:13px;line-height:1.7">`+x.insights.map(i=>`<li>${esc(i)}</li>`).join('')+`</ul></div>`;
  }
  // Top Attention Required Clients — the most-used management report, embedded here.
  if(reportsState.attention && (reportsState.attention.rows||[]).length){
    h+=`<div class="card" style="border-color:var(--red-border);margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="card-title" style="color:var(--red);margin:0">🎯 Top Attention Required Clients</div><div style="display:flex;gap:6px"><button class="btn btn-sm" data-rt="attention">View All</button><button class="btn btn-sm" onclick="window.location.href='${reportsExportUrl('/api/reports/attention-required?limit=50')}'">⬇ CSV</button></div></div><div style="overflow:auto">${attentionTableHtml((reportsState.attention.rows||[]).slice(0,10))}</div></div>`;
    setTimeout(()=>{ document.querySelectorAll('[data-rt="attention"]').forEach(b=>{ b.onclick=()=>{ state.activeTab='reports'; reportsState.subTab='attention'; render(); }; }); },0);
  }
  // Readiness chips — reuses the Risk Center filter state so it carries across screens.
  h+=readinessFilterStrip();

  // Client-name lookup for items that don't carry clientId (review bottlenecks).
  const byName={}; (state.clientReadiness&&state.clientReadiness.clients||[]).forEach(r=>{ byName[r.clientName]=r; });
  const matchByName=name=>{ if(!riskState.readinessFilter||riskState.readinessFilter==='All') return true; const r=byName[name]; return r && r.state===riskState.readinessFilter; };
  const matchById  =id  =>{ if(!riskState.readinessFilter||riskState.readinessFilter==='All') return true; if(id==null) return false; const r=readinessFor(id); return r && r.state===riskState.readinessFilter; };
  const pillForId  =id  => { const r=id!=null?readinessFor(id):null; return r?readinessPill(r.state):''; };
  const pillForName=name=> { const r=byName[name]; return r?readinessPill(r.state):''; };

  // Apply filters per card. Cards that have no client mapping pass through unchanged.
  const topPriority   = (x.topPriorityClients||[]).filter(c=>matchById(c.clientId));
  const criticalDL    = (x.criticalDeadlines||[]).filter(t=>matchById(t.client_external_id));
  const escalationRisks=(x.escalationRisks||[]); // no client mapping on raw event row
  const overloaded    = (x.overloadedEmployees||[]); // user-centric — never filtered by client readiness
  const stuckDocs     = (x.missingDocuments||[]).filter(d=>matchById(d.client_external_id));
  const highRisk      = (x.highRiskClients||[]).filter(c=>matchById(c.clientId));
  const reviewBottle  = (x.reviewBottlenecks||[]).filter(r=>matchByName(r.client));
  const capacityWarns = (x.capacityWarnings||[]);

  const taskMini=t=>`<div data-task="${t.id}" style="cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px"><span style="font-weight:600">${esc(t.client_name||'')}</span>${pillForId(t.client_external_id)}<span style="color:var(--text-muted)">${esc((t.task_type||'').replace(/_/g,' '))}</span><span>${priorityPill(t.priority_score)}</span><span style="color:var(--text-muted)">${t.due_date||'—'}</span></div>`;
  const clientMini=c=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px"><span style="font-weight:600;flex:1">${esc(c.clientName||'')}</span>${pillForId(c.clientId)}<span style="color:var(--text-muted)">${c.openTasks||0} open · prio ${c.totalPriority||0}</span></div>`;
  const userMini=u=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><span style="font-weight:600">${esc(u.userName||'')}</span><span>${u.openTasks||0}/${u.capacity||'—'} · ratio ${u.workloadRatio||'—'}</span>${bandPill(u.band)}</div>`;
  const card=(title,items,renderer,emptyMsg,color)=>{
    let inner=`<div class="card-title" style="color:${color||'var(--text-primary)'}">${title} (${items.length})</div>`;
    if(!items.length) return `<div class="card">${inner}<div style="padding:8px;font-size:12px;color:var(--text-muted)">${emptyMsg||'None.'}</div></div>`;
    inner+=`<div style="max-height:260px;overflow:auto">${items.slice(0,12).map(renderer).join('')}</div>`;
    return `<div class="card">${inner}</div>`;
  };
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px">`;
  h+=card('🔥 Top Priority Clients',     topPriority, clientMini, 'No priority clients.');
  h+=card('⏰ Critical Deadlines (7d)',   criticalDL,  taskMini, 'No urgent deadlines.');
  h+=card('🚨 Escalation Risks',         escalationRisks, e=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px">Task #${e.task_id} · ${esc(e.rule_name||'')} · sev ${e.severity}</div>`, 'No open escalations.');

// PHASE 2 — Calendar, Exceptions, Health, Compliance Settings
// ═══════════════════════════════════════════════════════════════
const phase2={ calendar:null, exceptions:null, health:null, calFilter:{ from:null, to:null, type:'' } };

function healthBadge(score, band){
  const c=band==='healthy'?'var(--green)':band==='watch'?'var(--blue)':band==='at_risk'?'var(--amber)':'var(--red)';
  return `<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;background:var(--bg-elevated);font-weight:700;color:${c}">●&nbsp;${score}</span>`;
}
function slaChip(s){
  const map={on_track:['var(--green)','On Track'],at_risk:['var(--amber)','At Risk'],likely_breach:['var(--red)','Likely Breach'],breached:['var(--red)','Breached'],met:['var(--green)','Met']};
  const [c,l]=map[s]||['var(--text-muted)',s||'—'];
  return `<span style="font-size:10px;padding:2px 6px;border-radius:4px;color:${c};background:var(--bg-elevated)">${l}</span>`;
}

async function loadCalendar(){
  try{
    const today=new Date(); const to=new Date(today.getTime()+90*86400000);
    const from=phase2.calFilter.from||today.toISOString().slice(0,10);
    const toStr=phase2.calFilter.to||to.toISOString().slice(0,10);
    const params=new URLSearchParams({from,to:toStr});
    if(phase2.calFilter.type) params.set('types',phase2.calFilter.type);
    const j=await apiJSON('/api/calendar?'+params.toString());
    phase2.calendar=j; render();
  }catch(e){ console.error(e); }
}
function renderCalendar(){
  if(!phase2.calendar){ setTimeout(loadCalendar,0); return `<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">Loading calendar…</div></div>`; }
  const ev=phase2.calendar.events||[];
  // Group by month
  const groups={};
  ev.forEach(e=>{ const k=(e.date||'').slice(0,7)||'unknown'; (groups[k]=groups[k]||[]).push(e); });
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title">📅 Compliance Calendar (${ev.length} events)</div><div style="display:flex;gap:6px"><select class="form-input" id="calType" style="width:auto"><option value="">All types</option><option value="VAT_Return">VAT</option><option value="CT_Return">CT</option><option value="Audit">Audit</option><option value="Management_Report">Mgmt Report</option></select><button class="btn" id="calRefresh">Refresh</button></div></div>`;
  if(!ev.length) h+=`<div class="empty-state"><div class="empty-state-icon">✨</div><div class="empty-state-title">No upcoming events in this window</div></div>`;
  Object.keys(groups).sort().forEach(month=>{
    h+=`<div class="card"><div class="card-title">${month}</div><table style="width:100%"><tbody>`;
    groups[month].forEach(e=>{
      const kindColor=e.kind==='obligation'?'var(--accent)':'var(--blue)';
      h+=`<tr><td style="padding:4px 6px;font-size:12px;color:var(--text-muted);width:90px">${e.date}</td><td style="padding:4px 6px"><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg-elevated);color:${kindColor}">${e.kind}</span></td><td style="padding:4px 6px;font-weight:600">${esc(e.client||'')}</td><td style="padding:4px 6px;font-size:12px">${esc(e.title)}</td><td style="padding:4px 6px">${e.status?statusBadge(e.status):''}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  });
  // Wire up filters after render
  setTimeout(()=>{
    const t=document.getElementById('calType'); if(t){ t.value=phase2.calFilter.type||''; t.onchange=()=>{ phase2.calFilter.type=t.value; phase2.calendar=null; render(); }; }
    const r=document.getElementById('calRefresh'); if(r) r.onclick=()=>{ phase2.calendar=null; render(); };
  },0);
  return h;
}

async function loadExceptions(){ try{ phase2.exceptions=await apiJSON('/api/exceptions'); render(); }catch(e){ console.error(e); } }
function renderExceptions(){
  if(!phase2.exceptions){ setTimeout(loadExceptions,0); return `<div class="empty-state"><div class="empty-state-icon">🚨</div><div class="empty-state-title">Loading exceptions…</div></div>`; }
  const x=phase2.exceptions;
  const card=(title,rows,renderer,color)=>{
    let inner=`<div class="card-title" style="color:${color||'var(--text-primary)'}">${title} (${rows.length})</div>`;
    if(!rows.length) return `<div class="card">${inner}<div style="padding:8px;font-size:12px;color:var(--text-muted)">None — good news.</div></div>`;

  const docRow=d=>{ const pending=Math.floor((Date.now()-new Date(d.requested_date))/86400000); return `<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px"><b>${esc(d.client_name)}</b> — ${esc(d.document_name)} <span style="color:var(--red)">(${pending}d)</span></div>`; };
  const clientRow=h=>`<div style="padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between"><b>${esc(h.clientName||h.client_name||'')}</b> ${healthBadge(h.score,h.band)}</div>`;

  h+=card('⚠ Overdue', x.overdue, taskRowMini, 'var(--red)');
  h+=card('⛔ Blocked', x.blocked, taskRowMini, 'var(--amber)');
  h+=card('🚀 Escalated', x.escalated, taskRowMini, 'var(--red)');

  h+=card('💔 High-Risk Clients', x.highRiskClients, clientRow, 'var(--red)');
  h+=`</div>`;
  return h;
}

// TASK ENGINE — Priority queue, Tasks, Documents, Manager Dashboard
// ═══════════════════════════════════════════════════════════════
const TASK_STATUSES=["not_started","waiting_documents","documents_received","in_progress","ready_for_review","reviewed","completed","blocked","escalated"];
const TASK_TYPES=["Accounting_Bookkeeping","VAT_Filing","VAT_Registration","VAT_Deregistration","CT_Filing","CT_Registration","CT_Deregistration","Audit","Document_Request","Client_Followup","Management_Report","Review","Amendment","Refund","Other"];
const taskState={ priority:[], tasks:[], documents:[], ops:null, loading:false };

async function apiJSON(url, opts){
  const r=await fetch(url, Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}}, opts||{}));
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||('HTTP '+r.status)); }
  return r.json();
}

function statusBadge(s){
  const colors={not_started:'var(--text-muted)',waiting_documents:'var(--amber)',documents_received:'var(--blue)',in_progress:'var(--blue)',ready_for_review:'var(--accent)',reviewed:'var(--green)',completed:'var(--green)',blocked:'var(--red)',escalated:'var(--red)'};
  return `<span style="display:inline-block;padding:2px 8px;border-radius:4px;background:var(--bg-elevated);color:${colors[s]||'var(--text-muted)'};font-size:11px;font-weight:600">${s.replace(/_/g,' ')}</span>`;
}
function priorityPill(score){
  const c=score>=120?'var(--red)':score>=60?'var(--amber)':'var(--text-muted)';
  return `<span style="font-weight:700;color:${c}">${score||0}</span>`;
}
// fmtDate and daysUntil already defined at top of file — re-use globals.

function taskRow(t){
  const du=daysUntil(t.due_date);
  const dueStr=t.due_date?`${fmtDate(t.due_date)} (${du<0?Math.abs(du)+'d overdue':du+'d'})`:'—';
  const dueColor=du!=null&&du<0?'var(--red)':du!=null&&du<=7?'var(--amber)':'var(--text-muted)';
  return `<tr data-task="${t.id}" style="cursor:pointer"><td>${priorityPill(t.priority_score)}</td><td style="font-weight:600">${esc(t.client_name)}</td><td>${esc(t.task_type.replace(/_/g,' '))}</td><td>${statusBadge(t.status)}</td><td style="font-size:12px;color:${dueColor}">${dueStr}</td><td style="font-size:12px;color:var(--text-muted)">${esc(t.assigned_user_name||'Unassigned')}</td></tr>`;
}

// Tiny in-flight guard — prevents the same loader from being fired on every
// render while the previous fetch is still pending.
const _inflight={};
function _once(key, fn){
  if(_inflight[key]) return _inflight[key];
  const p = Promise.resolve().then(fn).finally(()=>{ delete _inflight[key]; });
  _inflight[key] = p; return p;
}
async function loadPriorityQueue(){ return _once('priority', async()=>{ try{ const j=await apiJSON('/api/my/priority-queue'); taskState.priority=j.tasks||[]; render(); }catch(e){ console.error(e); } }); }
function renderPriorityQueue(){
  if(!taskState.priority.length && !taskState.loading){ setTimeout(loadPriorityQueue,0); return `<div class="empty-state"><div class="empty-state-icon">⚡</div><div class="empty-state-title">Loading your priority work…</div></div>`; }
  if(!taskState.priority.length) return `<div class="empty-state"><div class="empty-state-icon">✅</div><div class="empty-state-title">All caught up</div><div class="empty-state-text">No open tasks assigned to you.</div></div>`;
  let h=`<div class="card-title" style="margin-bottom:12px">⚡ My Next Priority Work — ${taskState.priority.length} open</div>`;
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:800px"><thead><tr><th style="width:60px">Priority</th><th>Client</th><th>Type</th><th>Status</th><th>Due</th><th>Owner</th></tr></thead><tbody>`;
  taskState.priority.forEach(t=>{ h+=taskRow(t); });
  h+=`</tbody></table></div>`;
  return h;
}

async function loadTasks(){ return _once('tasks', async()=>{ try{ const j=await apiJSON('/api/tasks'); taskState.tasks=j.tasks||[]; render(); }catch(e){ console.error(e); } }); }
function renderTasksBoard(){
  if(!taskState.tasks.length){ setTimeout(loadTasks,0); }
  const byStatus={};
  TASK_STATUSES.forEach(s=>byStatus[s]=[]);
  taskState.tasks.forEach(t=>{ (byStatus[t.status]||(byStatus[t.status]=[])).push(t); });
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title">Tasks (${taskState.tasks.length})</div>`;
  if(isAdmin()) h+=`<div style="display:flex;gap:8px"><button class="btn" data-action="runGeneration">↻ Run Generation</button><button class="btn btn-primary" data-action="openNewTask">+ New Task</button></div>`;
  h+=`</div>`;
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:900px"><thead><tr><th style="width:60px">Priority</th><th>Client</th><th>Type</th><th>Status</th><th>Due</th><th>Owner</th></tr></thead><tbody>`;
  taskState.tasks.slice().sort((a,b)=>b.priority_score-a.priority_score).forEach(t=>{ h+=taskRow(t); });
  h+=`</tbody></table></div>`;
  return h;
}

async function loadDocuments(){ return _once('documents', async()=>{ try{ const j=await apiJSON('/api/documents?status=pending'); taskState.documents=j.documents||[]; render(); }catch(e){ console.error(e); } }); }
function renderDocumentsView(){
  if(!taskState.documents.length){ setTimeout(loadDocuments,0); }
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="card-title">📎 Missing Documents (${taskState.documents.length})</div><button class="btn btn-primary" data-action="openNewDoc">+ Request Document</button></div>`;
  if(!taskState.documents.length) return h+`<div class="empty-state"><div class="empty-state-icon">📎</div><div class="empty-state-title">No pending documents</div></div>`;
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:900px"><thead><tr><th>Client</th><th>Document</th><th>Requested</th><th>Last Reminder</th><th>Pending (days)</th><th>Actions</th></tr></thead><tbody>`;
  taskState.documents.forEach(d=>{
    const pending=Math.floor((Date.now()-new Date(d.requested_date))/86400000);
    h+=`<tr><td style="font-weight:600">${esc(d.client_name)}</td><td>${esc(d.document_name)}</td><td style="font-size:12px;color:var(--text-muted)">${fmtDate(d.requested_date)}</td><td style="font-size:12px;color:var(--text-muted)">${d.last_reminder_date?fmtDate(d.last_reminder_date):'—'}</td><td style="color:${pending>7?'var(--red)':'var(--text-muted)'}">${pending}</td><td><button class="btn btn-sm" data-doc-remind="${d.id}">Remind</button> <button class="btn btn-sm" data-doc-receive="${d.id}">Received</button></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

async function loadOps(){ return _once('ops', async()=>{ try{ const j=await apiJSON('/api/manager/dashboard'); taskState.ops=j; render(); }catch(e){ console.error(e); } }); }
function renderManagerDashboard(){
  if(!taskState.ops){ setTimeout(loadOps,0); return `<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">Loading manager dashboard…</div></div>`; }
  const o=taskState.ops;
  const card=(title,rows,emptyMsg)=>{
    let inner=`<div class="card-title">${title} (${rows.length})</div>`;
    if(!rows.length) return `<div class="card">${inner}<div style="padding:12px;color:var(--text-muted);font-size:12px">${emptyMsg||'Nothing here.'}</div></div>`;
    inner+=`<div style="max-height:280px;overflow:auto"><table style="width:100%"><tbody>`;
    rows.slice(0,12).forEach(t=>{ inner+=`<tr><td style="padding:4px 6px;font-weight:600">${esc(t.client_name)}</td><td style="padding:4px 6px;font-size:12px">${esc(t.task_type.replace(/_/g,' '))}</td><td style="padding:4px 6px">${statusBadge(t.status)}</td><td style="padding:4px 6px;font-size:12px;color:var(--text-muted)">${fmtDate(t.due_date)}</td></tr>`; });
    inner+=`</tbody></table></div>`;
    return `<div class="card">${inner}</div>`;
  };
  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px">`;
  h+=card("🔥 Today's Critical Work", o.criticalToday, "Nothing critical today.");
  h+=card("📅 Upcoming Deadlines (7d)", o.upcomingDeadlines);
  h+=card("⚠ Overdue Tasks", o.overdue, "No overdue tasks.");
  h+=card("⛔ Blocked / Escalated", o.blocked);
  h+=card("👀 Awaiting Review", o.awaitingReview);
  h+=`<div class="card"><div class="card-title">👥 Team Workload</div><table style="width:100%"><tbody>${o.workload.map(w=>`<tr><td style="padding:4px 6px;font-weight:600">${esc(w.user)}</td><td style="padding:4px 6px;text-align:right">${w.openTasks}</td></tr>`).join('')}</tbody></table></div>`;
  h+=card("📎 Pending Documents", o.pendingDocuments.map(d=>({client_name:d.client_name,task_type:d.document_name,status:'waiting_documents',due_date:d.requested_date})), "No pending documents.");
  h+=`</div>`;
  return h;
}

// Action wiring for new tabs — additive, hooks into existing data-action dispatcher if present.
document.addEventListener('click', async function(e){
  const t=e.target.closest('[data-action]'); if(!t) return;

  try{
    if(action==='runGeneration'){ await apiJSON('/api/tasks/generate',{method:'POST'}); await loadTasks(); }

    if(action==='openNewDoc'){ await promptNewDocument(); }
  }catch(err){ alert(err.message); }
});
document.addEventListener('click', async function(e){
  const r=e.target.closest('[data-doc-remind]'); const v=e.target.closest('[data-doc-receive]');
  try{
    if(r){ await apiJSON('/api/documents/'+r.dataset.docRemind+'/remind',{method:'POST'}); await loadDocuments(); }
    if(v){ await apiJSON('/api/documents/'+v.dataset.docReceive+'/receive',{method:'POST'}); await loadDocuments(); }
  }catch(err){ alert(err.message); }
});
document.addEventListener('click', async function(e){
  const row=e.target.closest('[data-task]'); if(!row) return;

  await openTaskDetail(id);
});

async function openTaskDetail(id){
  try{
    const j=await apiJSON('/api/tasks/'+id);
    const t=j.task;
    const opts=TASK_STATUSES.map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('');
    const adminBtns=isAdmin()?`<button class="btn" data-task-review="approve">Approve Review</button> <button class="btn" data-task-review="reject">Reject</button> <button class="btn btn-primary" data-task-complete>Mark Completed</button>`:`<button class="btn btn-primary" data-task-submit>Submit for Review</button>`;
    const html=`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000" id="taskModal"><div style="background:var(--bg-card);padding:24px;border-radius:8px;max-width:640px;width:90%;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>Task #${t.id}</h3><button class="btn btn-sm" id="taskModalClose">✕</button></div><div style="display:grid;gap:10px;font-size:13px"><div><b>Client:</b> ${esc(t.client_name)}</div><div><b>Type:</b> ${t.task_type.replace(/_/g,' ')}</div><div><b>Due:</b> ${fmtDate(t.due_date)} · <b>Deadline:</b> ${fmtDate(t.compliance_deadline)}</div><div><b>Owner:</b> ${esc(t.assigned_user_name||'Unassigned')}</div><div><b>Priority:</b> ${priorityPill(t.priority_score)}</div><div><b>Status:</b> <select id="taskStatusSel">${opts}</select></div><div><b>Review:</b> ${t.review_status}</div><div style="margin-top:8px"><b>Comments</b><div id="taskComments" style="max-height:200px;overflow:auto;background:var(--bg-deep);padding:8px;border-radius:6px;margin-top:6px">${(j.comments||[]).map(c=>`<div style="margin-bottom:6px"><b>${esc(c.user_name||'?')}</b> <span style="color:var(--text-muted);font-size:11px">${fmtDate(c.created_at)}</span><div>${esc(c.body)}</div></div>`).join('')||'<div style="color:var(--text-muted)">No comments</div>'}</div><div style="display:flex;gap:6px;margin-top:6px"><input id="newCommentBody" class="form-input" placeholder="Add a comment..." style="flex:1"><button class="btn" id="addCommentBtn">Add</button></div></div><div style="display:flex;gap:8px;margin-top:14px">${adminBtns}</div></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('taskModalClose').onclick=()=>document.getElementById('taskModal').remove();
    document.getElementById('taskStatusSel').onchange=async function(){
      try{ await apiJSON('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({status:this.value})}); document.getElementById('taskModal').remove(); await loadTasks(); await loadPriorityQueue(); }
      catch(err){ alert(err.message); }
    };
    document.getElementById('addCommentBtn').onclick=async function(){
      const body=document.getElementById('newCommentBody').value.trim(); if(!body) return;
      await apiJSON('/api/tasks/'+t.id+'/comments',{method:'POST',body:JSON.stringify({body})});
      document.getElementById('taskModal').remove(); openTaskDetail(t.id);
    };
    const submitBtn=document.querySelector('[data-task-submit]'); if(submitBtn) submitBtn.onclick=async function(){ await apiJSON('/api/tasks/'+t.id+'/submit-review',{method:'POST'}); document.getElementById('taskModal').remove(); await loadTasks(); await loadPriorityQueue(); };
    const completeBtn=document.querySelector('[data-task-complete]'); if(completeBtn) completeBtn.onclick=async function(){ await apiJSON('/api/tasks/'+t.id+'/complete',{method:'POST'}); document.getElementById('taskModal').remove(); await loadTasks(); };
    document.querySelectorAll('[data-task-review]').forEach(b=>{ b.onclick=async function(){ await apiJSON('/api/tasks/'+t.id+'/review',{method:'POST',body:JSON.stringify({decision:this.dataset.taskReview})}); document.getElementById('taskModal').remove(); await loadTasks(); }; });
  }catch(err){ alert(err.message); }
}

async function promptNewTask(){
  const clientOpts=state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const typeOpts=TASK_TYPES.map(t=>`<option value="${t}">${t.replace(/_/g,' ')}</option>`).join('');
  const userOpts=(state.teamMembers||[]).map(m=>`<option value="${esc(m.name||m)}">${esc(m.name||m)}</option>`).join('');
  const html=`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000" id="nt"><div style="background:var(--bg-card);padding:24px;border-radius:8px;max-width:480px;width:90%"><h3>New Task</h3><div style="display:grid;gap:8px;margin-top:10px"><select id="ntClient" class="form-input">${clientOpts}</select><select id="ntType" class="form-input">${typeOpts}</select><input id="ntTitle" class="form-input" placeholder="Title (optional)"><input id="ntDue" type="date" class="form-input"><input id="ntDeadline" type="date" class="form-input" placeholder="Compliance deadline"><select id="ntOwner" class="form-input"><option value="">— Unassigned —</option>${userOpts}</select></div><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn" id="ntCancel">Cancel</button><button class="btn btn-primary" id="ntSave">Create</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('ntCancel').onclick=()=>document.getElementById('nt').remove();
  document.getElementById('ntSave').onclick=async function(){
    try{
      const body={ clientId:document.getElementById('ntClient').value, taskType:document.getElementById('ntType').value, title:document.getElementById('ntTitle').value, dueDate:document.getElementById('ntDue').value||null, complianceDeadline:document.getElementById('ntDeadline').value||null, assignedUserName:document.getElementById('ntOwner').value||null };
      await apiJSON('/api/tasks',{method:'POST',body:JSON.stringify(body)});
      document.getElementById('nt').remove(); await loadTasks();
    }catch(err){ alert(err.message); }
  };
}

async function promptNewDocument(){
  const clientOpts=state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const html=`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000" id="nd"><div style="background:var(--bg-card);padding:24px;border-radius:8px;max-width:480px;width:90%"><h3>Request Document</h3><div style="display:grid;gap:8px;margin-top:10px"><select id="ndClient" class="form-input">${clientOpts}</select><input id="ndName" class="form-input" placeholder="Document name (e.g. Trade License copy)"><textarea id="ndNotes" class="form-input" placeholder="Notes (optional)"></textarea></div><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn" id="ndCancel">Cancel</button><button class="btn btn-primary" id="ndSave">Request</button></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('ndCancel').onclick=()=>document.getElementById('nd').remove();
  document.getElementById('ndSave').onclick=async function(){
    try{
      const body={ clientId:document.getElementById('ndClient').value, documentName:document.getElementById('ndName').value, notes:document.getElementById('ndNotes').value };
      if(!body.documentName) throw new Error('Document name required');
      await apiJSON('/api/documents',{method:'POST',body:JSON.stringify(body)});
      document.getElementById('nd').remove(); await loadDocuments();
    }catch(err){ alert(err.message); }
  };
}

function renderDashboard(){
  const vc=getVisibleClients();
  const total=vc.length;
  if(!total&&isAdmin()&&!state.teamMembers.length)return`<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">Welcome to UAE Compliance Tracker</div><div class="empty-state-text">Set up your team, then add clients.</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn" data-action="openManageTeam">👥 Set Up Team</button><button class="btn btn-primary" data-action="openAddClient">+ Add Client</button></div></div>`;
  if(!total&&isAdmin())return`<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No Clients Yet</div><button class="btn btn-primary" data-action="openAddClient">+ Add First Client</button></div>`;
  if(!total&&!isAdmin())return`<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No Clients Assigned</div><div class="empty-state-text">Your admin hasn't assigned any clients to you yet. Contact your admin for access.</div></div>`;

  const completed=vc.filter(c=>metricsCache[c.id]?.overallStatus==="Completed").length;
  const blocked=vc.filter(c=>metricsCache[c.id]?.overallStatus==="Blocked").length;
  const allDL=vc.flatMap(c=>metricsCache[c.id]?.deadlines||[]);
  const urgent=allDL.filter(d=>d.days!=null&&d.days>=0&&d.days<=7).length;
  const overdue=allDL.filter(d=>d.days!=null&&d.days<0).length;
  const avgPct=Math.round(vc.reduce((s,c)=>s+(metricsCache[c.id]?.totalPct||0),0)/total);

  let h=`<div class="stat-grid cols-6">${[{l:"Total Clients",v:total,c:"var(--blue)"},{l:"Completed",v:completed,c:"var(--green)"},{l:"Blocked",v:blocked,c:"var(--red)"},{l:"Due ≤7 Days",v:urgent,c:"var(--amber)"},{l:"Overdue",v:overdue,c:"var(--red)"},{l:"Avg Completion",v:avgPct+"%",c:"var(--accent)"}].map(s=>`<div class="stat-card"><div class="stat-value" style="color:${s.c}">${s.v}</div><div class="stat-label">${s.l}</div></div>`).join("")}</div>`;

  // Readiness counts strip — clickable to filter, plus an "All" reset chip.
  h+=renderReadinessCountsStrip();

  h+=`<div class="filter-bar"><input class="form-input search-input" placeholder="Search clients..." value="${esc(state.search)}" data-action="search">${selectHTML("fs",state.filterStatus,["All",...STATUSES],'data-action="filterStatus"')}${selectHTML("ft",state.filterTeam,["All",...getTeamOptions()],'data-action="filterTeam"')}${renderReadinessFilterSelect()}${renderClientTierFilterSelect()}<button class="btn btn-sm ${state.sortByTier?'btn-primary':''}" data-action="toggleSortTier">Sort by Tier</button></div>`;

  const fl=getFilteredClients();
  h+=`<div class="card" style="padding:0;overflow:auto"><table style="min-width:1000px"><thead><tr><th>Client</th><th>Readiness</th><th>Overall</th><th style="min-width:120px">Completion</th><th>Accounting</th><th>VAT</th><th>Corp Tax</th><th>Documents</th><th>Logins</th><th>Next Deadline</th><th>Owner</th></tr></thead><tbody>`;
  // Priority order in the client cell: name → readiness pill (in own column) → tier (compact, end of name).
  fl.forEach(c=>{const m=metricsCache[c.id];const dl=m.deadlines[0];const r=readinessFor(c.id);const t=tierFor(c.id);h+=`<tr style="cursor:pointer" data-client="${c.id}"><td style="font-weight:700;color:var(--text-primary);min-width:160px"><span style="display:inline-flex;align-items:center;gap:6px">${esc(c.name)}${t?tierBadgeMini(t):''}</span></td><td>${r?readinessPill(r.state):'<span style="font-size:10px;color:var(--text-muted)">—</span>'}</td><td>${badgeHTML(m.overallStatus,1)}</td><td>${progressHTML(m.totalPct)}</td><td>${badgeHTML(m.acctStatus,1)}</td><td>${badgeHTML(m.vatStatus,1)}</td><td>${badgeHTML(m.ctStatus,1)}</td><td>${badgeHTML(m.docsStatus,1)}</td><td>${badgeHTML(m.loginsStatus,1)}</td><td style="font-size:12px;white-space:nowrap">${dl?`<span style="color:${dl.days<0?'var(--red)':dl.days<=7?'var(--amber)':'var(--text-muted)'}">${esc(dl.label)} · ${dl.days<0?Math.abs(dl.days)+'d overdue':dl.days+'d'}</span>`:'—'}</td><td style="font-size:12px;color:var(--text-muted)">${esc(c.assignedTeam)}</td></tr>`;});
  h+=`</tbody></table>`;if(!fl.length)h+=`<div style="padding:40px;text-align:center;color:var(--text-muted)">No clients match</div>`;h+=`</div>`;

  const aw=state.clients.flatMap(c=>(metricsCache[c.id]?.warnings||[]).map(w=>({client:c.name,warning:w})));
  if(aw.length)h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title">⚠ Warnings</div>${aw.slice(0,15).map(w=>`<div style="display:flex;gap:12px;padding:6px 12px;background:var(--red-bg);border-radius:var(--radius);margin-bottom:4px;font-size:12px"><span style="font-weight:700;color:var(--red);min-width:180px">${esc(w.client)}</span><span style="color:var(--amber)">${esc(w.warning)}</span></div>`).join("")}</div>`;
  return h;
}

function renderClientsList(){
  if(!state.clients.length)return`<div class="empty-state"><div class="empty-state-icon">📁</div><div class="empty-state-title">No Clients</div><button class="btn btn-primary" data-action="openAddClient">+ Add Client</button></div>`;

  fl.forEach(c=>{const m=metricsCache[c.id];const r=readinessFor(c.id);const t=tierFor(c.id);h+=`<div class="card" data-client="${c.id}" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px"><div style="flex:1;min-width:0"><div style="font-weight:700;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px">${esc(c.name)}${t?tierBadgeMini(t):''}</div><div style="font-size:11px;color:var(--text-muted)">${esc(c.entityType)} · ${esc(c.assignedTeam)}</div></div>${badgeHTML(m.overallStatus,1)}</div><div style="margin-bottom:10px">${r?readinessPill(r.state):''}</div>${progressHTML(m.totalPct)}</div>`;});
  h+=`</div>`;return h;

// ----- Readiness UI helpers (counts strip + filter select) -----
function renderReadinessCountsStrip(){
  const data=state.clientReadiness;
  if(!data){ setTimeout(ensureReadinessLoaded,0); return `<div style="padding:8px 0;font-size:12px;color:var(--text-muted)">Loading readiness…</div>`; }
  const counts=data.counts||{};
  // Order matches priority — most critical first.
  const order=['high_risk','blocked','filing_due','awaiting_client_approval','awaiting_documents','awaiting_review','partially_ready','ready','idle'];
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px 0">`;
  // "All" reset chip
  const allActive=!state.filterReadiness||state.filterReadiness==='All';
  h+=`<button class="btn btn-sm ${allActive?'btn-primary':''}" data-readiness="All">All (${(data.clients||[]).length})</button>`;
  order.forEach(s=>{
    const n=counts[s]||0;
    if(!n) return; // hide empty buckets
    const m=READINESS_STATE_META[s];
    const active=state.filterReadiness===s;
    h+=`<button class="btn btn-sm" data-readiness="${s}" style="border-left:3px solid ${m.color};${active?'background:var(--bg-elevated);font-weight:700':''}">${esc(m.label)}: ${n}</button>`;
  });
  h+=`</div>`;
  setTimeout(()=>{ document.querySelectorAll('[data-readiness]').forEach(b=>{ b.onclick=()=>{ state.filterReadiness=b.dataset.readiness; render(); }; }); },0);
  return h;
}
function renderReadinessFilterSelect(){
  const opts=['All'].concat(['high_risk','blocked','filing_due','awaiting_client_approval','awaiting_documents','awaiting_review','partially_ready','ready','idle']);
  const labels=Object.assign({All:'All Readiness'}, Object.fromEntries(Object.entries(READINESS_STATE_META).map(([k,v])=>[k,v.label])));
  const cur=state.filterReadiness||'All';
  let h=`<select class="form-input" data-action="filterReadiness" style="min-width:170px">`;
  opts.forEach(o=>{ h+=`<option value="${o}" ${o===cur?'selected':''}>${esc(labels[o])}</option>`; });
  h+=`</select>`;
  return h;
}

function renderDeadlines(){
  const vc=getVisibleClients();
  if(!vc.length)return`<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-title">No Deadlines</div></div>`;
  const all=vc.flatMap(c=>(metricsCache[c.id]?.deadlines||[]).map(d=>({...d,cn:c.name,cid:c.id})));
  all.sort((a,b)=>(a.days??999)-(b.days??999));
  const sec=(t,items,col)=>{if(!items.length)return"";return`<div style="margin-bottom:24px"><div class="form-label" style="color:${col};font-size:12px;margin-bottom:8px">${t} (${items.length})</div>${items.map(d=>`<div class="deadline-item" data-client="${d.cid}" data-detail="${d.type}"><span style="font-weight:700;color:var(--text-primary);min-width:180px">${esc(d.cn)}</span><span style="font-size:12px;color:var(--text-muted);min-width:130px">${esc(d.label)}</span><span style="font-size:12px;color:var(--text-muted)">${fmtDate(d.date)}</span><span style="font-size:12px;font-weight:700;margin-left:auto;color:${d.days<0?'var(--red)':d.days<=7?'var(--amber)':'var(--blue)'}">${d.days<0?Math.abs(d.days)+'d overdue':d.days+'d'}</span></div>`).join("")}</div>`;};
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:20px">Upcoming Deadlines</h2>`;
  h+=sec("OVERDUE",all.filter(d=>d.days!=null&&d.days<0),"var(--red)");
  h+=sec("DUE WITHIN 30 DAYS",all.filter(d=>d.days!=null&&d.days>=0&&d.days<=30),"var(--amber)");
  h+=sec("LATER",all.filter(d=>d.days==null||d.days>30),"var(--blue)");
  if(!all.length)h+=`<div style="padding:40px;text-align:center;color:var(--text-muted)">No pending deadlines</div>`;
  return h;
}

function renderTeamView(){
  if(!state.teamMembers.length)return`<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-title">No Team Members</div><button class="btn btn-primary" data-action="openManageTeam">👥 Set Up Team</button></div>`;
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="font-size:18px;font-weight:800">Team Workload</h2><button class="btn" data-action="openManageTeam">Manage Team</button></div>`;
  const ua=state.clients.filter(c=>c.assignedTeam==="Unassigned");
  if(ua.length)h+=`<div class="alert alert-warning" style="margin-bottom:16px">⚠ ${ua.length} client${ua.length!==1?'s':''} unassigned</div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">`;
  state.teamMembers.forEach(member=>{
    const mc=state.clients.filter(c=>c.assignedTeam===member);
    const avg=mc.length?Math.round(mc.reduce((s,c)=>s+(metricsCache[c.id]?.totalPct||0),0)/mc.length):0;
    h+=`<div class="team-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-weight:700;font-size:15px;color:var(--text-primary)">${esc(member)}</div><div style="font-size:11px;color:var(--text-muted)">${mc.length} client${mc.length!==1?'s':''}</div></div></div>${progressHTML(avg)}<div style="margin-top:12px">${mc.length?mc.map(c=>`<div data-client="${c.id}" style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer"><span style="font-size:13px;color:var(--text-secondary)">${esc(c.name)}</span>${badgeHTML(metricsCache[c.id]?.overallStatus||"Not Started",1)}</div>`).join(""):'<div style="padding:12px 0;font-size:12px;color:var(--text-muted);text-align:center">No clients</div>'}</div></div>`;
  });
  h+=`</div>`;return h;
}

function renderSidebar(sc,scm){
  const nav=[["overview","Overview"],["accounting","Accounting"],["vat","VAT Returns"],["ct","Corporate Tax"],["documents","Documents / KYC"],["logins","Login Credentials"]];
  return`<div class="sidebar"><div class="sidebar-header"><button class="btn" style="width:100%;margin-bottom:12px" data-action="backToList">← Back</button><div style="font-weight:700;font-size:15px;color:var(--text-primary);margin-bottom:3px">${esc(sc.name)}</div><div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">${esc(sc.entityType)} · ${esc(sc.assignedTeam)}</div>${badgeHTML(scm.overallStatus)}<div style="margin-top:10px">${progressHTML(scm.totalPct,8)}</div></div><div class="detail-nav">${nav.map(([k,l])=>`<button class="detail-nav-btn ${state.detailTab===k?'active':''}" data-detail-nav="${k}">${l}</button>`).join("")}<div style="padding:8px 12px;margin-top:8px;font-size:10px;color:var(--text-muted);border-top:1px solid var(--border)">⌨ Use <kbd style="background:var(--bg-elevated);padding:1px 5px;border-radius:3px;font-size:10px;border:1px solid var(--border)">↑</kbd> <kbd style="background:var(--bg-elevated);padding:1px 5px;border-radius:3px;font-size:10px;border:1px solid var(--border)">↓</kbd> to switch tabs · <kbd style="background:var(--bg-elevated);padding:1px 5px;border-radius:3px;font-size:10px;border:1px solid var(--border)">Esc</kbd> to go back</div></div><div class="sidebar-footer">${isAdmin()?`<button class="btn btn-danger" style="width:100%;font-size:11px" data-action="removeClient" data-id="${sc.id}">Remove Client</button>`:''}</div></div>`;
}

function renderDetail(sc,scm){
  switch(state.detailTab){
    case"overview":return renderOverview(sc,scm);
    case"accounting":return renderAccounting(sc,scm);
    case"vat":return renderVAT(sc,scm);
    case"ct":return renderCT(sc,scm);
    case"documents":return renderDocuments(sc,scm);
    case"logins":return renderLogins(sc,scm);
    default:return renderOverview(sc,scm);
  }
}

function renderOverview(sc,scm){
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px">${esc(sc.name)} <span id="cli-tier-${sc.id}"></span> <span style="font-size:13px;font-weight:400;color:var(--text-muted)">— Overview</span></h2>`;
  // Phase 7: Service Governance card (tier, scores, risk profile, partner owner).
  h+=`<div id="cli-portfolio-${sc.id}" style="margin-bottom:12px"></div>`;
  // Phase 4/5: compliance lifecycle section — populated async, see loadClientLifecycle.
  h+=`<div id="cli-lifecycle-${sc.id}" style="margin-bottom:16px"><div class="card" style="border-color:var(--accent-soft)"><div style="padding:8px;font-size:12px;color:var(--text-muted)">Loading compliance lifecycle…</div></div></div>`;
  // Phase 7: client history timeline (collapsible)
  h+=`<div id="cli-timeline-${sc.id}" style="margin-bottom:16px"></div>`;
  setTimeout(function(){ loadClientLifecycle(sc.id); loadClientPortfolio(sc.id); loadClientTimeline(sc.id); }, 0);
  h+=`<div class="stat-grid" style="grid-template-columns:repeat(5,1fr)">${[{l:"Accounting",p:scm.acctPct,s:scm.acctStatus},{l:"VAT",p:scm.vatPct,s:scm.vatStatus},{l:"Corp Tax",p:scm.ctPct,s:scm.ctStatus},{l:"Documents",p:scm.docsPct,s:scm.docsStatus},{l:"Logins",p:scm.loginsPct,s:scm.loginsStatus}].map(i=>`<div class="stat-card"><div class="form-label" style="margin-bottom:6px">${i.l}</div><div class="stat-value" style="font-size:22px">${i.p}%</div><div style="margin-top:6px">${badgeHTML(i.s,1)}</div></div>`).join("")}</div>`;
  h+=`<div class="card"><div class="card-title">Client Details</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px"><div><div class="form-label">Entity Type</div><div>${esc(sc.entityType)}</div></div><div><div class="form-label">Financial Year</div><div>FY ${esc(sc.accounting.financialYear)}</div></div><div><div class="form-label">Assigned To</div>${isAdmin()?selectHTML("at",sc.assignedTeam,getTeamOptions(),`data-client-field="${sc.id}"`):`<div style="font-weight:600">${esc(sc.assignedTeam)}</div>`}</div><div><div class="form-label">VAT Status</div>${isAdmin()?selectHTML("vs",sc.vatApplicable,VAT_OPTIONS,`data-client-vatapp="${sc.id}"`):`<div>${esc(sc.vatApplicable)}</div>`}</div><div><div class="form-label">CT Applicable</div><div style="color:${sc.ctApplicable?'var(--green)':'var(--red)'};font-weight:600">${sc.ctApplicable?"Yes":"No"}</div></div><div><div class="form-label">Last Updated</div><div style="font-size:12px;color:var(--text-muted)">${fmtDate(sc.lastUpdated)} ${sc.lastUpdatedBy?'by '+esc(sc.lastUpdatedBy):''}</div></div></div></div>`;
  if(scm.warnings.length)h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title" style="color:var(--red)">⚠ Warnings</div>${scm.warnings.map(w=>`<div style="padding:5px 0;font-size:13px;color:var(--amber);border-bottom:1px solid var(--border)">• ${esc(w)}</div>`).join("")}</div>`;
  // Blocked reasons summary — specific per module
  const brs=sc.blockedReasons||{};
  const allBlocked=[];

  // Accounting blocked months
  Object.entries(sc.accounting.monthlyStatus).forEach(([k,v])=>{if(v==="Blocked"){const p=k.split("-");const lbl=MONTHS[parseInt(p[1])-1]+" "+p[0];allBlocked.push({area:"Accounting",item:lbl,reason:brs[`acct_${k}`]||""});}});

  // VAT blocked returns
  (sc.vat.returnDates||[]).forEach((r,i)=>{if(r.filingStatus==="Blocked"||r.paymentStatus==="Blocked")allBlocked.push({area:"VAT",item:r.period,reason:brs[`vat_${i}`]||""});});

  // CT blocked
  if(sc.ct.status==="Blocked")allBlocked.push({area:"Corp Tax",item:`FY ${sc.ct.financialYear}`,reason:brs.ct||""});

  // Missing mandatory documents
  const mandDocs=DOCS_LIST.filter(d=>d.mandatory);
  mandDocs.forEach(doc=>{
    const val=sc.documents[doc.name];
    if(val!=="Received"&&val!=="N/A"){
      const reason=brs[`doc_${doc.name}`]||"";
      allBlocked.push({area:"Document",item:doc.name,reason:reason||"Not received"});
    }
  });

  // VAT Pending status
  if(sc.vatApplicable&&sc.vatApplicable.startsWith("Pending")){
    allBlocked.push({area:"VAT Status",item:sc.vatApplicable,reason:brs.vat_pending||""});
  }

  if(allBlocked.length){
    h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title" style="color:var(--red)">🚫 Blocked Items &amp; Pending Reasons</div>`;
    const grouped={};
    allBlocked.forEach(b=>{if(!grouped[b.area])grouped[b.area]=[];grouped[b.area].push(b);});
    Object.entries(grouped).forEach(([area,items])=>{
      h+=`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;padding-top:8px;border-top:1px solid var(--border)">${esc(area)}</div>`;
      items.forEach(b=>{
        h+=`<div style="display:flex;gap:10px;padding:6px 0;font-size:13px;align-items:center"><span style="color:var(--text-primary);min-width:160px;font-weight:500">${esc(b.item)}</span><span style="color:${b.reason&&b.reason!=='Not received'?'var(--amber)':'var(--text-muted)'};flex:1;font-size:12px;font-style:${b.reason?'normal':'italic'}">${esc(b.reason)||'No reason specified'}</span></div>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  if(scm.deadlines.length)h+=`<div class="card"><div class="card-title">Upcoming Deadlines</div>${scm.deadlines.map(d=>`<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="font-weight:600;min-width:140px">${esc(d.label)}</span><span style="color:var(--text-muted)">${fmtDate(d.date)}</span><span style="margin-left:auto;font-weight:700;font-family:var(--mono);color:${d.days<0?'var(--red)':d.days<=7?'var(--amber)':'var(--blue)'}">${d.days<0?Math.abs(d.days)+'d overdue':d.days+'d'}</span></div>`).join("")}</div>`;
  return h;
}

// 4) ACCOUNTING — Financial Year based
function renderAccounting(sc,scm){
  const fy=sc.accounting.financialYear;
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:16px">Accounting — FY ${esc(fy)}</h2>`;
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><span style="color:var(--text-muted)">Financial Year: </span>${selectHTML("fy",fy,FY_OPTIONS,`data-action="changeFY" data-cid="${sc.id}"`)}</div><div><span style="color:var(--text-muted)">Completion: </span><span style="font-weight:700;font-family:var(--mono)">${scm.acctPct}%</span></div></div>${progressHTML(scm.acctPct,10)}</div>`;

  const months=getFYMonths(fy);
  h+=`<div class="month-grid">`;
  months.forEach(m=>{
    const s=sc.accounting.monthlyStatus[m.key]||"Not Started";
    const br=(sc.blockedReasons||{})[`acct_${m.key}`]||"";
    const bc=s==="Completed"?"var(--green-border)":s==="Blocked"?"var(--red-border)":s==="In Progress"?"var(--accent-soft)":"var(--border)";
    h+=`<div class="month-cell" style="border-color:${bc}"><div class="month-name">${m.label}</div>${badgeHTML(s,1)}<div style="margin-top:8px">${selectHTML(`a_${m.key}`,s,ACCT_STATUSES,`data-acct-key="${m.key}" data-cid="${sc.id}"`)}</div>${s==="Blocked"?`<input class="form-input" style="margin-top:6px;font-size:11px;padding:4px 8px;border-color:var(--red-border)" value="${esc(br)}" placeholder="Reason..." data-blocked-reason="acct_${m.key}" data-cid="${sc.id}">`:''}</div>`;

let pdfjsLoaded=false;
function loadPdfJs(){
  return new Promise((res,rej)=>{
    if(pdfjsLoaded){res();return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";pdfjsLoaded=true;res();};
    s.onerror=()=>rej(new Error("Failed to load PDF library"));
    document.head.appendChild(s);
  });
}

function parseDMY(s){if(!s)return null;const m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(!m)return null;return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}

function parseDateRange(s){if(!s)return null;const parts=s.split(/\s*[-–]\s*/);if(parts.length===2)return{from:parseDMY(parts[0].trim()),to:parseDMY(parts[1].trim())};return null;}

function parseTaxPeriods(text){
  const periods=[];
  const mMap={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,june:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const re=/(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|june|jul|aug|sep|oct|nov|dec)\w*\s+to\s+(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|june|jul|aug|sep|oct|nov|dec)\w*/gi;
  let m;
  while((m=re.exec(text))!==null){
    const sm=mMap[m[2].toLowerCase().substring(0,3)];
    const em=mMap[m[4].toLowerCase().substring(0,3)];
    const ed=parseInt(m[3]);
    if(sm&&em)periods.push({startMonth:sm,endMonth:em,endDay:ed});
  }
  return periods;
}

// UAE public holidays (fixed dates — approximate, some shift yearly)
function getUAEPublicHolidays(year){
  return [
    `${year}-01-01`, // New Year
    `${year}-12-02`, // National Day
    `${year}-12-03`, // National Day
    // Eid Al Fitr (approx — shifts ~11 days each year)
    // Eid Al Adha (approx)
    // Islamic New Year, Prophet's Birthday (approx)
    // These are approximate — exact dates change with lunar calendar
  ];
}

// Get next UAE business day (UAE weekend = Sat & Sun since 2022)
function nextBusinessDay(dateStr){
  let d=new Date(dateStr);
  const holidays=new Set([...getUAEPublicHolidays(d.getFullYear()),...getUAEPublicHolidays(d.getFullYear()+1)]);
  // Keep moving forward if weekend (Sat=6, Sun=0) or public holiday
  while(d.getDay()===6||d.getDay()===0||holidays.has(d.toISOString().slice(0,10))){
    d.setDate(d.getDate()+1);
  }
  return d.toISOString().slice(0,10);
}

// Determine Financial Year for a period
// UAE default: FY = calendar year of the period START month
// If period crosses year boundary (e.g., Dec-Feb), FY = year of the start month
function getPeriodFY(startMonth, year){
  return String(year);
}

function generateReturnDates(taxPeriods, regDate, yearsAhead=2){
  const results=[];
  const mn=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const regD=new Date(regDate);
  const endDate=new Date(new Date().getFullYear()+yearsAhead,11,31);

  taxPeriods.forEach(tp=>{
    for(let yr=regD.getFullYear();yr<=endDate.getFullYear();yr++){
      let ed=tp.endDay;
      // Handle Feb end day
      if(tp.endMonth===2&&ed>28)ed=new Date(yr,1,29).getDate()===29?29:28;

      // For cross-year periods (Dec-Feb), end year is next year
      let endYr=yr;
      if(tp.endMonth<tp.startMonth) endYr=yr+1;

      const pEnd=new Date(endYr,tp.endMonth-1,ed);
      const pStart=new Date(yr,tp.startMonth-1,1);

      if(pEnd<regD||pStart>endDate)continue;

      // Due date = 28th of month after period end
      let dueMonth=tp.endMonth+1;
      let dueYear=endYr;
      if(dueMonth>12){dueMonth=1;dueYear++;}

      // Base due date: 28th
      const baseDue=`${dueYear}-${String(dueMonth).padStart(2,'0')}-28`;
      // Adjust to next business day
      const actualDue=nextBusinessDay(baseDue);

      // Financial year = year when period starts
      const fy=getPeriodFY(tp.startMonth,yr);

      // Period label
      const label=`${mn[tp.startMonth]}-${mn[tp.endMonth]} ${tp.endMonth<tp.startMonth?yr+'/'+(endYr%100):yr}`;

      results.push({
        period:label,
        dueDate:actualDue,
        fy:fy,
        filingStatus:"Not Started",
        paymentStatus:"Not Started"
      });
    }
  });

  results.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  return results;
}

async function extractCertificateData(file,type,clientId){
  const sid=type==="vat"?"vatCertStatus":"ctCertStatus";
  const el=document.getElementById(sid);
  if(el){el.style.display="block";el.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Reading ${esc(file.name)}...</div>`;}

  try{
    let text="";
    if(file.type==="application/pdf"){
      if(el)el.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Loading PDF parser...</div>`;
      await loadPdfJs();
      const ab=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:ab}).promise;
      if(el)el.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Extracting text from ${pdf.numPages} page(s)...</div>`;
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();text+=c.items.map(it=>it.str).join(" ")+"\n";}
    }else{
      if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">⚠ Please upload the PDF version of the certificate.</div>`;
      return;
    }

    if(!text.trim()){if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">⚠ No text found in PDF. It may be a scanned image — try a text-based PDF.</div>`;return;}

    const sc=getClient(clientId);if(!sc)return;

    if(type==="vat"){
      // Normalize: collapse multiple whitespace/newlines
      const t=text.replace(/\r\n/g,"\n");

      let trn=null;
      // TRN: handle "Tax Registration Number\n105332551800003" or inline
      const trnM=t.match(/Tax\s*Registration\s*Number[\s\n]+(\d{15})/i)||t.match(/(\d{15})/);
      if(trnM)trn=trnM[1];

      let regDate=null;
      // Handle "Effective Registration Date\n01/03/2026" with possible Arabic text after
      const regM=t.match(/Effective\s*Registration\s*Date[\s\n]+(\d{1,2}\/\d{1,2}\/\d{4})/i);
      if(regM)regDate=parseDMY(regM[1]);

      let firstPeriod=null;
      // Handle "First VAT Return Period\n01/03/2026 - 31/05/2026"
      const fpM=t.match(/First\s*VAT\s*Return\s*Period[\s\n]+([\d\/]+\s*[-–]\s*[\d\/]+)/i);
      if(fpM)firstPeriod=parseDateRange(fpM[1]);

      let firstDue=null;
      // Handle "VAT Return due date\n29/06/2026"
      const ddM=t.match(/VAT\s*Return\s*due\s*date[\s\n]+(\d{1,2}\/\d{1,2}\/\d{4})/i);
      if(ddM)firstDue=parseDMY(ddM[1]);

      // Extract tax periods pattern — handle multi-line
      let pText="";
      const tpM=t.match(/Start\s*and\s*end\s*dates?\s*of\s*Tax\s*periods?[\s\n]+([\s\S]*?)(?:List\s*of|قامئة|قائمة|licenses|\n\s*\n|Legal\s*Name)/i);
      if(tpM)pText=tpM[1];
      if(!pText){const t2=t.match(/((?:\d{1,2}(?:st|nd|rd|th)?\s+\w+\s+to\s+\d{1,2}(?:st|nd|rd|th)?\s+\w+[\s,]*)+)/i);if(t2)pText=t2[1];}

      const taxPeriods=parseTaxPeriods(pText);

      if(taxPeriods.length>0&&regDate){
        const rds=generateReturnDates(taxPeriods,regDate,2);
        let added=0;
        rds.forEach(rd=>{if(!sc.vat.returnDates.some(e=>e.period===rd.period)){sc.vat.returnDates.push({id:uid(),period:rd.period,dueDate:rd.dueDate,fy:rd.fy||"",filingStatus:"Not Started",paymentStatus:"Not Started"});added++;}});
        sc.vat.returnDates.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
        markUpdated(sc);
        let msg=`✅ Extracted <b>${added}</b> VAT return period${added!==1?'s':''}`;
        if(trn)msg+=` · TRN: <b>${esc(trn)}</b>`;
        if(regDate)msg+=` · Registered: <b>${fmtDate(regDate)}</b>`;
        msg+=` · <b>${taxPeriods.length===4?'Quarterly':taxPeriods.length===12?'Monthly':taxPeriods.length+' periods/yr'}</b>`;
        if(el)el.innerHTML=`<div class="alert" style="margin:0;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">${msg}</div>`;
        updateUI();
      }else if(firstDue&&firstPeriod){
        const lbl=`First Return (${fmtDate(firstPeriod.from)} - ${fmtDate(firstPeriod.to)})`;
        if(!sc.vat.returnDates.some(e=>e.dueDate===firstDue)){sc.vat.returnDates.push({id:uid(),period:lbl,dueDate:firstDue,filingStatus:"Not Started",paymentStatus:"Not Started"});sc.vat.returnDates.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));markUpdated(sc);}
        let msg=`✅ First VAT return extracted · Due: <b>${fmtDate(firstDue)}</b>`;
        if(trn)msg+=` · TRN: <b>${esc(trn)}</b>`;
        msg+=`<br><span style="font-size:11px;color:var(--amber)">⚠ Could not parse full period pattern — add remaining periods manually.</span>`;
        if(el)el.innerHTML=`<div class="alert" style="margin:0;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">${msg}</div>`;
        updateUI();
      }else{
        let msg=`⚠ Could not extract return dates.`;if(trn)msg+=` TRN: ${trn}.`;msg+=` Add periods manually.`;
        if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">${msg}</div>`;
      }
    }
    else if(type==="ct"){
      const t=text.replace(/\r\n/g,"\n");

      // TRN
      let trn=null;
      const ctTrn=t.match(/Tax\s*Registration\s*Number[\s\n]+(\d{15})/i)||t.match(/(\d{15})/);
      if(ctTrn)trn=ctTrn[1];

      let fpFrom=null,fpTo=null,ctDue=null;

      // PRIMARY: Look for the CT period table row pattern
      // Format: "January - December" followed by 3 dates (Start, End, Due)
      // Works for both pdf.js (space-joined) and newline-separated text
      const monthNames="January|February|March|April|May|June|July|August|September|October|November|December";
      const rowPattern=new RegExp(`(?:${monthNames})\\s*[-–]\\s*(?:${monthNames})[\\s\\S]*?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})[\\s\\S]*?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})[\\s\\S]*?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})`,"i");
      const rowMatch=t.match(rowPattern);
      if(rowMatch){
        fpFrom=parseDMY(rowMatch[1]);
        fpTo=parseDMY(rowMatch[2]);
        ctDue=parseDMY(rowMatch[3]);
      }

      // FALLBACK 1: Look for "Filing Due Date" with a date
      if(!ctDue){
        const duePatterns=[
          /(?:Filing\s*Due\s*Date|Return\s*Filing\s*Due\s*Date)[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
          /(?:CT|Corporate\s*Tax)\s*Return\s*due\s*date[\s\n]+(\d{1,2}\/\d{1,2}\/\d{4})/i,
          /due\s*date[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
        ];
        for(const pat of duePatterns){
          const m=t.match(pat);
          if(m){ctDue=parseDMY(m[1]);if(ctDue)break;}
        }
      }

      // FALLBACK 2: Look for date range as period
      if(!fpFrom||!fpTo){
        const periodPatterns=[
          /First\s*Corporate\s*Tax\s*Period[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
          /(?:Period\s*Start)[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})[\s\S]*?(?:Period\s*End)[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
        ];
        for(const pat of periodPatterns){
          const m=t.match(pat);
          if(m){fpFrom=fpFrom||parseDMY(m[1]);fpTo=fpTo||parseDMY(m[2]);if(fpFrom&&fpTo)break;}
        }
      }

      // FALLBACK 3: If we have period end but no due date, calculate (9 months after FY end)
      if(!ctDue&&fpTo){
        const d=new Date(fpTo);d.setMonth(d.getMonth()+9);
        ctDue=nextBusinessDay(d.toISOString().slice(0,10));
      }

      // FALLBACK 4: Check for CT Registration Application (no dates, just submission)
      let isApplication=false;
      let submissionDate=null;
      let entityName=null;
      let refNumber=null;
      if(!ctDue&&!fpFrom){
        const appMatch=t.match(/Application\s*Submitted\s*Successfully/i);
        if(appMatch)isApplication=true;
        const subMatch=t.match(/Submission\s*Date[\s\S]*?(\d{1,2}\s+\w+\s+\d{4})/i);
        if(subMatch)submissionDate=subMatch[1];
        const entMatch=t.match(/Entity\s*Name[\s\S]*?:\s*(.+?)(?:\n|Applicant)/i);
        if(entMatch)entityName=entMatch[1].trim();
        const refMatch=t.match(/Reference\s*Number[\s\S]*?:\s*(\d+)/i);
        if(refMatch)refNumber=refMatch[1];
      }

      // Derive Financial Year
      // FY = the year the tax period covers, NOT the filing year
      // Period 01/11/2025 to 31/12/2026 → FY end is 31/12/2026 → FY = 2025 (first year of the period)
      // Due date 30/09/2027 → FY = 2027 - 1 = 2026? No — check the period end year
      // Rule: FY = year derived from the period, or due_date_year - 1
      let ctFY=null;
      if(fpFrom&&fpTo){
        // The FY end year is in fpTo. For Jan-Dec calendar year, FY = fpTo year
        // But the "Financial Year" is the year the period ends
        // Due is always 9 months after fpTo
        // So FY = fpTo year - but we label it as the ASSESSMENT year
        // Actually: if period is 01/11/2025 to 31/12/2026, FY = 2026 (year of period end)
        // But filing is due 30/09/2027
        // In UAE: FY = year the financial period ends
        // The CT FY label should match what FTA shows: the year it ends
        // For due date display: filing in 2027 is FOR FY ending 2026
        ctFY=fpTo.substring(0,4);
      } else if(ctDue){
        ctFY=String(parseInt(ctDue.substring(0,4))-1);
      }

      // Apply extracted data
      if(ctDue)sc.ct.dueDate=ctDue;
      if(ctFY)sc.ct.financialYear=ctFY;
      markUpdated(sc);

      // Build result message
      let msg="";
      if(isApplication){
        msg=`ℹ This is a CT <b>Registration Application</b> (not the certificate). No due dates available yet.`;
        if(entityName)msg+=`<br>Entity: <b>${esc(entityName)}</b>`;
        if(refNumber)msg+=` · Ref: <b>${esc(refNumber)}</b>`;
        if(submissionDate)msg+=` · Submitted: <b>${esc(submissionDate)}</b>`;
        msg+=`<br><span style="font-size:11px">Upload the actual CT Registration Certificate once issued to auto-extract dates.</span>`;
        if(el)el.innerHTML=`<div class="alert alert-info" style="margin:0">${msg}</div>`;
      } else if(ctDue){
        msg=`✅ CT extracted`;
        msg+=` · Due: <b>${fmtDate(ctDue)}</b>`;
        if(ctFY)msg+=` · FY: <b>${ctFY}</b>`;
        if(trn)msg+=` · TRN: <b>${esc(trn)}</b>`;
        if(fpFrom&&fpTo)msg+=` · Period: ${fmtDate(fpFrom)} to ${fmtDate(fpTo)}`;
        if(el)el.innerHTML=`<div class="alert" style="margin:0;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">${msg}</div>`;
        updateUI();
      } else {
        msg=`⚠ Could not extract CT dates.`;
        if(trn)msg+=` TRN: <b>${esc(trn)}</b>.`;
        msg+=` Enter due date manually.`;
        if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">${msg}</div>`;
      }
    }
  }catch(err){
    console.error(err);
    const el=document.getElementById(type==="vat"?"vatCertStatus":"ctCertStatus");
    if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">❌ ${esc(err.message)}</div>`;
  }
}

function processExcelFile(file){
  const statusEl=document.getElementById("importStatus");
  if(!statusEl)return;
  statusEl.style.display="block";
  statusEl.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Reading: ${esc(file.name)}...</div>`;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let headerIdx=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].some(c=>String(c).toLowerCase().includes("client name"))){headerIdx=i;break;}}
      if(headerIdx===-1){statusEl.innerHTML=`<div class="alert alert-warning" style="margin:0">⚠ "Client Name" header not found in first 10 rows.</div>`;return;}
      const hdr=rows[headerIdx].map(h=>String(h).toLowerCase().trim());
      const col={name:hdr.findIndex(h=>h.includes("client name")),entity:hdr.findIndex(h=>h.includes("entity")),team:hdr.findIndex(h=>h.includes("assigned")||h.includes("team")),vat:hdr.findIndex(h=>h.includes("vat")),ct:hdr.findIndex(h=>h.includes("ct")||h.includes("corporate")),fy:hdr.findIndex(h=>h.includes("year start")||h.includes("financial")),ctdue:hdr.findIndex(h=>h.includes("due date")||h.includes("ct due"))};
      let imported=0,skipped=0,dupes=0;const errors=[];
      const existing=new Set([...state.clients.map(c=>c.name.toLowerCase()),...state.bulkClients.map(c=>c.name.toLowerCase())]);
      const validEntities=ENTITY_TYPES;
      const parseBool=v=>{const s=String(v||"").toLowerCase().trim();return s===""||s==="yes"||s==="y"||s==="true"||s==="1";};
      const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s).getTime());
      for(let i=headerIdx+1;i<rows.length;i++){
        const r=rows[i];const rn=i+1;const name=String(r[col.name]||"").trim();
        if(!name){skipped++;continue;}
        if(existing.has(name.toLowerCase())){dupes++;continue;}
        const eRaw=col.entity>=0?String(r[col.entity]||"").trim():"";
        let entity="Mainland LLC";
        if(eRaw){if(validEntities.includes(eRaw))entity=eRaw;else errors.push(`Row ${rn}: Unknown entity "${eRaw}" → Mainland LLC`);}
        const team=col.team>=0?String(r[col.team]||"").trim()||"Unassigned":"Unassigned";
        let vat="Yes";
        if(col.vat>=0){const vr=String(r[col.vat]||"").trim().toLowerCase();if(!vr||vr==="yes")vat="Yes";else if(vr==="no")vat="No";else if(vr.includes("pending")||vr.includes("await"))vat="Pending - Documents Awaited";else if(vr.includes("registration")||vr.includes("progress"))vat="Pending - Registration in Progress";else{errors.push(`Row ${rn}: Unknown VAT "${r[col.vat]}" → Yes`);}}
        let ct=true;if(col.ct>=0)ct=parseBool(r[col.ct]);
        state.bulkClients.push({name,entityType:entity,assignedTeam:team,vatApplicable:vat,ctApplicable:ct});
        existing.add(name.toLowerCase());imported++;
      }
      let msg=imported?`<div class="alert" style="margin:0 0 6px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">✅ Imported <b>${imported}</b> client${imported!==1?'s':''}${dupes?` · ${dupes} dupes skipped`:''}${skipped?` · ${skipped} empty rows`:''}</div>`:`<div class="alert alert-warning" style="margin:0 0 6px">No valid clients found</div>`;
      if(errors.length)msg+=`<div style="padding:6px 10px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);font-size:11px;max-height:80px;overflow-y:auto;margin-top:4px"><div style="font-weight:700;color:var(--amber);margin-bottom:2px">${errors.length} warning${errors.length!==1?'s':''}:</div>${errors.map(e=>`<div style="color:var(--text-secondary)">• ${esc(e)}</div>`).join("")}</div>`;
      statusEl.innerHTML=msg;render();
    }catch(err){statusEl.innerHTML=`<div class="alert alert-warning" style="margin:0">❌ ${esc(err.message)}</div>`;}
  };
  reader.onerror=()=>{statusEl.innerHTML=`<div class="alert alert-warning" style="margin:0">❌ Read failed</div>`;};
  reader.readAsArrayBuffer(file);
}

function generateTemplateXLSX(){
  const wb=XLSX.utils.book_new();
  const wsData=[
    ["UAE Compliance Tracker — Client Import Template"],
    ["Fill details. * = required. VAT: Yes/No/Pending - Documents Awaited/Pending - Registration in Progress. CT: Yes/No. Dates: YYYY-MM-DD"],
    [],
    ["Client Name *","Entity Type *","Assigned Team Member","VAT Applicable","CT Applicable"],
    ["Al Noor Trading","Mainland LLC","","Yes","Yes"],
    ["Gulf Star","FZE (Free Zone)","","Pending - Documents Awaited","Yes"],
    ["Horizon","FZCO (Free Zone)","","No","No"],
  ];
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols']=[{wch:36},{wch:24},{wch:26},{wch:34},{wch:18}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}},{s:{r:1,c:0},e:{r:1,c:4}}];
  XLSX.utils.book_append_sheet(wb,ws,"Client Import");
  XLSX.writeFile(wb,"client_import_template.xlsx");
}
