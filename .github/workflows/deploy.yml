name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_stack:
        description: 'Also update CloudFormation stack (template.yaml)? Set to "true" for infra changes.'
        required: false
        default: 'false'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # don't cancel mid-deploy — could leave stack half-updated

permissions:
  id-token: write   # for AWS OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  STACK_NAME: uae-compliance-tracker
  ARTIFACT_BUCKET: uct-tracker-state-333973504173
  ARTIFACT_KEY: deploy/app.zip
  # Ops-Mkt master client list, read-only. These ARNs are identifiers, not
  # credentials — the IAM policy in template.yaml is what grants the SELECT,
  # and services/opsMktSync.js refuses anything that is not one.
  OPSMKT_CLUSTER_ARN: arn:aws:rds:ap-south-1:333973504173:cluster:opsmkt-pg
  OPSMKT_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:333973504173:secret:rds!cluster-bdb2320a-ca0f-405d-b2e6-15ade5fcf6f6-oG3I26

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Checkout is shallow by default, which leaves git log with a single
          # commit — the Updates page then shows one line however much shipped.
          # 60 is enough history for the changelog without cloning everything.
          fetch-depth: 60

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install prod dependencies
        run: npm ci --omit=dev --omit=optional

      # Stamp the build so the app can tell it is running an old copy and offer
      # to reload. Written into the zip, so every deploy mints a new value.
      # Merge commits are dropped — they say nothing a person wants to read.
      - name: Stamp version.json
        run: |
          node -e "
            const cp = require('child_process');
            const log = cp.execSync('git log -40 --no-merges --pretty=format:%H%x1f%s%x1f%aI').toString();
            const commits = log.split('\n').filter(Boolean).map(function (l) {
              const p = l.split('\x1f');
              return { sha: p[0], subject: p[1], date: p[2] };
            });
            const sha = cp.execSync('git rev-parse HEAD').toString().trim();
            require('fs').writeFileSync('version.json', JSON.stringify({
              sha: sha,
              shortSha: sha.slice(0, 7),
              deployedAt: new Date().toISOString(),
              commits: commits
            }, null, 2));
            console.log('stamped ' + sha.slice(0, 7) + ' with ' + commits.length + ' commit(s)');
          "

      - name: Package Lambda zip
        run: |
          zip -r app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".build/*" \
            -x "db/*" \
            -x "extension/*" \
            -x "scripts/migrate-supabase-to-aws.js" \
            -x ".env*" \
            -x "samconfig.toml*" \
            -x "*.md"
          ls -lh app.zip

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333973504173:role/gha-uct-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        run: aws s3 cp app.zip s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_KEY }}

      - name: Update Lambda code (fast path)
        if: github.event.inputs.full_stack != 'true'
        run: |
          for FN in ApiFunction TaskCronFunction ObligationCronFunction EscalationCronFunction SlaCronFunction OpsMktSyncCronFunction; do
            FULL_NAME=$(aws cloudformation describe-stack-resource \
              --stack-name ${{ env.STACK_NAME }} \
              --logical-resource-id "$FN" \
              --query 'StackResourceDetail.PhysicalResourceId' \
              --output text)
            echo "Updating $FULL_NAME"
            aws lambda update-function-code \
              --function-name "$FULL_NAME" \
              --s3-bucket ${{ env.ARTIFACT_BUCKET }} \
              --s3-key ${{ env.ARTIFACT_KEY }} \
              --publish >/dev/null
          done
          echo "All 6 Lambdas updated."

      - name: Full CloudFormation deploy (when template changes)
        if: github.event.inputs.full_stack == 'true'
        run: |
          # Regenerate packaged template pointing at the uploaded artifact
          sed "s|CodeUri: \.|CodeUri: s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_KEY }}|g" template.yaml > .build-template.yaml
          aws cloudformation deploy \
            --template-file .build-template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AdminEmail=${{ secrets.ADMIN_EMAIL }} \
              AdminPassword='${{ secrets.ADMIN_PASSWORD }}' \
              AdminName='${{ secrets.ADMIN_NAME }}' \
              JwtSecret='${{ secrets.JWT_SECRET }}' \
              S3Bucket=${{ env.ARTIFACT_BUCKET }} \
              DdbPrefix=Uct \
              AppUrl='${{ secrets.APP_URL }}' \
              OpsMktClusterArn=${{ env.OPSMKT_CLUSTER_ARN }} \
              OpsMktSecretArn=${{ env.OPSMKT_SECRET_ARN }}

      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "API URL: $API_URL"
          # Wait a moment for Lambda to settle after code update
          sleep 3
          curl -fsS "$API_URL/health" && echo ""
