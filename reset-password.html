<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — UAE Compliance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#080b12;color:#e8ecf4;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#111722;border:1px solid #1c2538;border-radius:16px;padding:40px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}
.logo-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3d7aed,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#080b12}
.subtitle{text-align:center;color:#5a6578;font-size:13px;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:11px;font-weight:700;color:#5a6578;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px}
.form-input{width:100%;background:#0e1420;color:#e8ecf4;border:1px solid #1c2538;border-radius:8px;padding:12px 14px;font-size:14px;outline:none;font-family:inherit}
.form-input:focus{border-color:#3d7aed}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:#3d7aed;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:#2d6adc}.btn:disabled{opacity:0.5;cursor:not-allowed}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.alert-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444}
.hint{font-size:12px;color:#5a6578;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-mark">CT</div><div style="font-weight:800;font-size:18px">UAE Compliance Tracker</div></div>
  <div class="subtitle">Set your new password</div>
  <div id="error" class="alert alert-error"></div>

  <div id="loading" style="text-align:center;padding:20px;color:#5a6578">Verifying reset link...</div>

  <form id="resetForm" style="display:none">
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="email" disabled></div>
    <div class="form-group"><label class="form-label">New Password</label><input class="form-input" type="password" id="password" placeholder="Min 6 characters" required minlength="6"><div class="hint">At least 6 characters</div></div>
    <div class="form-group"><label class="form-label">Confirm Password</label><input class="form-input" type="password" id="password2" placeholder="Repeat password" required></div>
    <button class="btn" type="submit" id="resetBtn">Reset Password</button>
  </form>

  <div id="invalidLink" style="display:none;text-align:center;padding:20px">
    <div style="font-size:32px;margin-bottom:12px">❌</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:8px">Invalid or Expired Link</div>
    <div style="color:#5a6578;font-size:13px">This reset link has expired or is invalid. Please request a new one.</div>
    <a href="/login" style="display:inline-block;margin-top:16px;color:#3d7aed;font-size:13px;text-decoration:none;font-weight:600">Go to Login →</a>
  </div>
</div>
<script>
const token=new URLSearchParams(window.location.search).get('token');
async function init(){
  if(!token){showInvalid();return;}
  try{const r=await fetch(`/api/auth/reset-password/verify/${token}`);if(!r.ok){showInvalid();return;}const d=await r.json();document.getElementById('email').value=d.email;document.getElementById('loading').style.display='none';document.getElementById('resetForm').style.display='block';document.getElementById('password').focus();}catch(e){showInvalid();}
}
function showInvalid(){document.getElementById('loading').style.display='none';document.getElementById('invalidLink').style.display='block';}

document.getElementById('resetForm').onsubmit=async(e)=>{e.preventDefault();
const pw=document.getElementById('password').value,pw2=document.getElementById('password2').value,err=document.getElementById('error');
if(pw!==pw2){err.textContent='Passwords do not match';err.style.display='block';return;}
err.style.display='none';const btn=document.getElementById('resetBtn');btn.disabled=true;btn.textContent='Resetting...';
try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});const d=await r.json();
if(r.ok){window.location.href='/login?reset=success';}else{err.textContent=d.error||'Reset failed';err.style.display='block';}}catch(ex){err.textContent='Connection error';err.style.display='block';}
btn.disabled=false;btn.textContent='Reset Password';};
init();
</script>
</body>
</html>
