AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UAE Compliance Tracker — API Lambda + 4 EventBridge scheduled Lambdas

# Deploy with:
#   sam build
#   sam deploy --guided     (first time)
#   sam deploy              (subsequent)

Parameters:
  AdminEmail:
    Type: String
    Description: Initial admin email seeded on first boot
  AdminPassword:
    Type: String
    NoEcho: true
    Description: Initial admin password
  AdminName:
    Type: String
    Default: Admin
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (any long random string)
  S3Bucket:
    Type: String
    Description: Existing S3 bucket for tracker_state.json (create via npm run bootstrap-aws first)
  DdbPrefix:
    Type: String
    Default: Uct
  AppUrl:
    Type: String
    Default: ''
    Description: Public URL of the deployed API (fill in after first deploy)
  # ---- Ops-Mkt link (read-only) ----
  # The firm's master client register lives in the Ops-Mkt tool's Aurora
  # Postgres database, reached over the RDS Data API. This tracker only ever
  # SELECTs from it — see services/opsMktSync.js, which refuses any other
  # statement — so the policy below grants no write action on that database.
  OpsMktClusterArn:
    Type: String
    Default: 'arn:aws:rds:ap-south-1:333973504173:cluster:opsmkt-pg'
    Description: Aurora cluster ARN holding the Ops-Mkt master client list
  OpsMktSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for the Ops-Mkt Aurora credentials (blank disables the client sync)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        AWS_REGION_APP: !Ref AWS::Region
        UCT_S3_BUCKET: !Ref S3Bucket
        UCT_DDB_TABLE_PREFIX: !Ref DdbPrefix
        JWT_SECRET: !Ref JwtSecret
        ADMIN_EMAIL: !Ref AdminEmail
        ADMIN_PASSWORD: !Ref AdminPassword
        ADMIN_NAME: !Ref AdminName
        APP_URL: !Ref AppUrl
        IS_LAMBDA: 'true'
        OPSMKT_CLUSTER_ARN: !Ref OpsMktClusterArn
        OPSMKT_SECRET_ARN: !Ref OpsMktSecretArn
        # Cognito wiring — read by auth.js (verifier + admin SDK calls) and by
        # api.js /invite (AdminCreateUser). Populated at deploy time from the
        # UserPool + Client resources below.
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        COGNITO_REGION: !Ref AWS::Region

Resources:
  # ---------- Cognito User Pool ----------
  # Fresh-app assumption: no legacy users to migrate. Cognito owns identity;
  # DynamoDB Users table is retired in Batch C6 once every reader has been
  # ported to Cognito's ListUsers / GetUser. Custom attributes carry the
  # firm's own concepts (role + reporting line) so the JWT claims are enough
  # to authorise on the server without a second lookup.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: uct-users
      # Email is the sign-in handle; usernames stay auto-generated so a
      # user can change their email later without breaking the audit trail.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        # Standard email + name attributes: declared here only to mark them
        # required. Cognito complains if we also try to list them in the
        # client's WriteAttributes when they conflict with UsernameAttributes,
        # so keep the Schema minimal and let the client's default attribute
        # policy handle read/write.
        - Name: email
          Required: true
          Mutable: true
          AttributeDataType: String
        - Name: name
          Required: true
          Mutable: true
          AttributeDataType: String
        # Custom attributes carry firm-specific data (role + reporting line).
        # Prefixed with custom: on the wire — Cognito adds that automatically.
        - Name: role
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints: { MinLength: '1', MaxLength: '32' }
        - Name: reports_to
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints: { MinLength: '1', MaxLength: '128' }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # No self sign-up; invites only
        InviteMessageTemplate:
          EmailSubject: 'You are invited to BCL — Accounting & Compliance Tracker'
          EmailMessage: |
            <div style="font-family:Inter,sans-serif;max-width:520px;margin:0 auto">
              <div style="background:#2f2a55;padding:22px;border-radius:12px 12px 0 0;text-align:center">
                <div style="color:#fff;font-weight:800;font-size:20px;letter-spacing:0.04em">BCL</div>
                <div style="color:rgba(255,255,255,0.75);font-size:11px;margin-top:4px">Accounting &amp; Compliance Tracker</div>
              </div>
              <div style="background:#f8f9fc;padding:22px;border:1px solid #e2e2ea;border-top:none;border-radius:0 0 12px 12px">
                <p>You have been invited to BCL Accounting &amp; Compliance Tracker.</p>
                <p><strong>Username:</strong> {username}</p>
                <p><strong>Temporary password:</strong> {####}</p>
                <p>Open the app and sign in. You will be asked to set your own password on first login.</p>
                <p style="font-size:11px;color:#8b8ca3;margin-top:24px">If you did not expect this invite, ignore this email — the temporary password expires in 7 days.</p>
              </div>
            </div>
      MfaConfiguration: 'OFF'
      # Cognito default sender is used for now (no SES domain verified yet).
      # Deliverable but capped at 50 emails/day — enough for internal firm
      # invites. Move to SES once bcl.ae / bclworkspace.in is verified.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        Project: uae-compliance-tracker
        ManagedBy: CloudFormation

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: uct-web
      GenerateSecret: false  # Public browser client
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH        # Login (SRP is what amazon-cognito-identity-js uses)
        - ALLOW_ADMIN_USER_PASSWORD_AUTH  # For the server-side admin flow (first-login password change)
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      PreventUserExistenceErrors: ENABLED
      # Explicit ReadAttributes / WriteAttributes were rejected on first
      # apply ("Invalid write attributes"). Leaving them unset makes Cognito
      # use the default policy: the client can read + write every attribute
      # declared as Mutable in the Schema (email, name, custom:role,
      # custom:reports_to). Role attribute writes are still admin-only
      # because the frontend never has admin credentials — only server-side
      # invite/promote paths in cognito.js do.

  # Cognito groups mirror the three roles. Group membership drives
  # authorisation server-side (auth.js reads cognito:groups from the JWT)
  # while custom:role carries the same value for convenience in the client.
  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super_admin
      UserPoolId: !Ref UserPool
      Description: Firm-wide admin. Can invite anyone; sees every team.
      Precedence: 1

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Team lead. Can invite users; sees their own reports and clients.
      Precedence: 5

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref UserPool
      Description: Staff. Sees only the clients assigned to them.
      Precedence: 10

  # ---------- API Lambda (Express via serverless-express) ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda.handler
      Timeout: 30
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Users' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ActivityLog' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Tasks' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Obligations' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Documents' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}TaskComments' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}TaskGenerationRules' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ReviewEvents' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}EscalationEvents' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}EscalationRules' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}SlaPolicies' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}PriorityConfig' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}HealthWeights' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}WorkloadConfig' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}UserCapacity' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Workflows' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}WorkflowSteps' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ClientSettings' }
        - S3CrudPolicy: { BucketName: !Ref S3Bucket }
        # Read the Ops-Mkt master client list. ExecuteStatement is the only
        # Data API action granted, and no BatchExecuteStatement or
        # CommitTransaction, so this role cannot write to that database even
        # if the SELECT-only guard in services/opsMktSync.js were removed.
        # The secret is scoped to RDS-managed cluster secrets rather than
        # named outright, so a blank OpsMktSecretArn still deploys.
        - Statement:
            - Effect: Allow
              Action: ['rds-data:ExecuteStatement']
              Resource: !Ref OpsMktClusterArn
            - Effect: Allow
              Action: ['secretsmanager:GetSecretValue']
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!cluster-*'
        # Cognito admin actions — invite (AdminCreateUser), promote/demote
        # (AdminAddUserToGroup / AdminRemoveUserFromGroup), deactivate
        # (AdminDisableUser), password reset (AdminResetUserPassword),
        # listing (ListUsers / ListUsersInGroup). Scoped to this pool only.
        - Statement:
            - Effect: Allow
              Action:
                - 'cognito-idp:AdminCreateUser'
                - 'cognito-idp:AdminGetUser'
                - 'cognito-idp:AdminUpdateUserAttributes'
                - 'cognito-idp:AdminDeleteUser'
                - 'cognito-idp:AdminDisableUser'
                - 'cognito-idp:AdminEnableUser'
                - 'cognito-idp:AdminResetUserPassword'
                - 'cognito-idp:AdminSetUserPassword'
                - 'cognito-idp:AdminAddUserToGroup'
                - 'cognito-idp:AdminRemoveUserFromGroup'
                - 'cognito-idp:AdminListGroupsForUser'
                - 'cognito-idp:AdminInitiateAuth'
                - 'cognito-idp:AdminRespondToAuthChallenge'
                - 'cognito-idp:ListUsers'
                - 'cognito-idp:ListUsersInGroup'
              Resource: !GetAtt UserPool.Arn
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Any:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # ---------- Scheduled Lambdas ----------
  # Pulls clients signed in Ops-Mkt since the last look, for the First POCs
  # this tracker follows. Additions only — it never edits or removes a client.
  # Runs before the obligation sweep at 02:30 so a client added tonight gets
  # its VAT and CT deadlines seeded in the same night.
  OpsMktSyncCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers/opsMktSyncCron.handler
      Timeout: 600
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Obligations' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Tasks' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Users' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ActivityLog' }
        # Writes the client list back to tracker_state.json, and its own
        # opsmkt_sync.json, so this one needs Crud rather than Read.
        - S3CrudPolicy: { BucketName: !Ref S3Bucket }
        - Statement:
            - Effect: Allow
              Action: ['rds-data:ExecuteStatement']
              Resource: !Ref OpsMktClusterArn
            - Effect: Allow
              Action: ['secretsmanager:GetSecretValue']
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!cluster-*'
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 * * ? *)  # daily 02:00 UTC, ahead of the obligation sweep

  TaskCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers/taskCron.handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Tasks' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}TaskGenerationRules' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Users' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ActivityLog' }
        # recomputeAllPriorities() reads both of these on every rescore:
        # config.getAll() scans PriorityConfig, documents.list() scans Documents.
        # Neither was granted, so every hourly run died on AccessDeniedException.
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}PriorityConfig' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Documents' }
        - S3ReadPolicy: { BucketName: !Ref S3Bucket }
      Events:
        Rescore:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Input: '{"mode":"rescore"}'
        Generate:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 * * ? *)   # daily 02:00 UTC (~05:30 in Mumbai/UAE)
            Input: '{"mode":"generate"}'

  ObligationCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers/obligationCron.handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Obligations' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Tasks' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Users' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ActivityLog' }
        - S3ReadPolicy: { BucketName: !Ref S3Bucket }
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(30 2 * * ? *)  # daily 02:30 UTC

  EscalationCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers/escalationCron.handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Tasks' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Documents' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}EscalationRules' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}EscalationEvents' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Users' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}ActivityLog' }
        - S3ReadPolicy: { BucketName: !Ref S3Bucket }
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
        DailyDigest:
          Type: Schedule
          Properties:
            Schedule: cron(30 5 * * ? *)  # daily 05:30 UTC (~09:00 Mumbai/UAE)
            Input: '{"mode":"digest"}'

  SlaCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handlers/slaCron.handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Tasks' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}SlaPolicies' }
        - DynamoDBCrudPolicy: { TableName: !Sub '${DdbPrefix}Users' }
        - S3ReadPolicy: { BucketName: !Ref S3Bucket }
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)

Outputs:
  ApiUrl:
    Description: Public URL of the API (also serves the app HTML at /)
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  UserPoolId:
    Description: Cognito User Pool ID — feeds COGNITO_USER_POOL_ID env var and the browser client
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID — used by the browser to sign in
    Value: !Ref UserPoolClient
  CognitoRegion:
    Description: Region the User Pool lives in
    Value: !Ref AWS::Region
