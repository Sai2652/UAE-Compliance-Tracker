function renderOverview(sc,scm){
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px">${esc(sc.name)} <span id="cli-tier-${sc.id}"></span> <span style="font-size:13px;font-weight:400;color:var(--text-muted)">— Overview</span></h2>`;
  // Phase 7: Service Governance card (tier, scores, risk profile, partner owner).
  h+=`<div id="cli-portfolio-${sc.id}" style="margin-bottom:12px"></div>`;
  // Phase 4/5: compliance lifecycle section — populated async, see loadClientLifecycle.
  h+=`<div id="cli-lifecycle-${sc.id}" style="margin-bottom:16px"><div class="card" style="border-color:var(--accent-soft)"><div style="padding:8px;font-size:12px;color:var(--text-muted)">Loading compliance lifecycle…</div></div></div>`;
  // Phase 7: client history timeline (collapsible)
  h+=`<div id="cli-timeline-${sc.id}" style="margin-bottom:16px"></div>`;
  setTimeout(function(){ loadClientLifecycle(sc.id); loadClientPortfolio(sc.id); loadClientTimeline(sc.id); }, 0);
  h+=`<div class="stat-grid" style="grid-template-columns:repeat(5,1fr)">${[{l:"Accounting",p:scm.acctPct,s:scm.acctStatus},{l:"VAT",p:scm.vatPct,s:scm.vatStatus},{l:"Corp Tax",p:scm.ctPct,s:scm.ctStatus},{l:"Documents",p:scm.docsPct,s:scm.docsStatus},{l:"Logins",p:scm.loginsPct,s:scm.loginsStatus}].map(i=>`<div class="stat-card"><div class="form-label" style="margin-bottom:6px">${i.l}</div><div class="stat-value" style="font-size:22px">${i.p}%</div><div style="margin-top:6px">${badgeHTML(i.s,1)}</div></div>`).join("")}</div>`;
  h+=`<div class="card"><div class="card-title">Client Details</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px"><div><div class="form-label">Entity Type</div>${isAdmin()?entitySelectHtml("etSel_"+sc.id,sc.entityType,`data-client-entity="${sc.id}" data-entity-hint-for="etHint_${sc.id}" style="padding:5px 8px;font-size:12px;max-width:230px"`):`<div>${esc(sc.entityType)}</div>`}${sc.entityTypeGuessed?`<div style="font-size:10px;color:var(--amber);margin-top:3px;font-weight:600">⚠ Read off the company name — check the trade licence</div>`:''}<div id="etHint_${sc.id}" style="font-size:10px;color:var(--text-muted);line-height:1.45;margin-top:4px">${esc(entityHintFor(normalizeEntityType(sc.entityType)||sc.entityType))}</div></div><div><div class="form-label">Nature</div>${isAdmin()?selectHTML("bn",sc.businessNature||"Not Recorded",BUSINESS_NATURES,`data-client-nature="${sc.id}"`):`<div>${esc(sc.businessNature||"Not Recorded")}</div>`}</div><div><div class="form-label">Financial Year</div><div>FY ${esc(sc.accounting.financialYear)}</div></div><div><div class="form-label">Assigned To</div>${isAdmin()?selectHTML("at",sc.assignedTeam,getTeamOptions(),`data-client-field="${sc.id}"`):`<div style="font-weight:600">${esc(sc.assignedTeam)}</div>`}</div><div><div class="form-label">VAT Status</div>${isAdmin()?selectHTML("vs",sc.vatApplicable,VAT_OPTIONS,`data-client-vatapp="${sc.id}"`):`<div>${esc(sc.vatApplicable)}</div>`}</div><div><div class="form-label">CT Applicable</div><div style="color:${sc.ctApplicable?'var(--green)':'var(--red)'};font-weight:600">${sc.ctApplicable?"Yes":"No"}</div></div><div><div class="form-label">Last Updated</div><div style="font-size:12px;color:var(--text-muted)">${fmtDate(sc.lastUpdated)} ${sc.lastUpdatedBy?'by '+esc(sc.lastUpdatedBy):''}</div></div></div></div>`;
  if(scm.warnings.length)h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title" style="color:var(--red)">⚠ Warnings</div>${scm.warnings.map(w=>`<div style="padding:5px 0;font-size:13px;color:var(--amber);border-bottom:1px solid var(--border)">• ${esc(w)}</div>`).join("")}</div>`;
  // Blocked reasons summary — specific per module
  const brs=sc.blockedReasons||{};
  const allBlocked=[];

  // Accounting blocked months
  Object.entries(sc.accounting.monthlyStatus).forEach(([k,v])=>{if(v==="Blocked"){const p=k.split("-");const lbl=MONTHS[parseInt(p[1])-1]+" "+p[0];allBlocked.push({area:"Accounting",item:lbl,reason:brs[`acct_${k}`]||""});}});

  // VAT blocked returns
  (sc.vat.returnDates||[]).forEach((r,i)=>{if(r.filingStatus==="Blocked"||r.paymentStatus==="Blocked")allBlocked.push({area:"VAT",item:r.period,reason:brs[`vat_${i}`]||""});});

  // CT blocked
  if(sc.ct.status==="Blocked")allBlocked.push({area:"Corp Tax",item:`FY ${sc.ct.financialYear}`,reason:brs.ct||""});

  // Missing mandatory documents
  const mandDocs=DOCS_LIST.filter(d=>d.mandatory);
  mandDocs.forEach(doc=>{
    const val=sc.documents[doc.name];
    if(val!=="Received"&&val!=="N/A"){
      const reason=brs[`doc_${doc.name}`]||"";
      allBlocked.push({area:"Document",item:doc.name,reason:reason||"Not received"});
    }
  });

  // VAT Pending status
  if(sc.vatApplicable&&sc.vatApplicable.startsWith("Pending")){
    allBlocked.push({area:"VAT Status",item:sc.vatApplicable,reason:brs.vat_pending||""});
  }

  if(allBlocked.length){
    h+=`<div class="card" style="border-color:var(--red-border)"><div class="card-title" style="color:var(--red)">🚫 Blocked Items &amp; Pending Reasons</div>`;
    const grouped={};
    allBlocked.forEach(b=>{if(!grouped[b.area])grouped[b.area]=[];grouped[b.area].push(b);});
    Object.entries(grouped).forEach(([area,items])=>{
      h+=`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;padding-top:8px;border-top:1px solid var(--border)">${esc(area)}</div>`;
      items.forEach(b=>{
        h+=`<div style="display:flex;gap:10px;padding:6px 0;font-size:13px;align-items:center"><span style="color:var(--text-primary);min-width:160px;font-weight:500">${esc(b.item)}</span><span style="color:${b.reason&&b.reason!=='Not received'?'var(--amber)':'var(--text-muted)'};flex:1;font-size:12px;font-style:${b.reason?'normal':'italic'}">${esc(b.reason)||'No reason specified'}</span></div>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  if(scm.deadlines.length)h+=`<div class="card"><div class="card-title">Upcoming Deadlines</div>${scm.deadlines.map(d=>`<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="font-weight:600;min-width:140px">${esc(d.label)}</span><span style="color:var(--text-muted)">${fmtDate(d.date)}</span><span style="margin-left:auto;font-weight:700;font-family:var(--mono);color:${d.days<0?'var(--red)':d.days<=7?'var(--amber)':'var(--blue)'}">${d.days<0?Math.abs(d.days)+'d overdue':d.days+'d'}</span></div>`).join("")}</div>`;
  return h;
}

// 4) ACCOUNTING — Financial Year based
function renderAccounting(sc,scm){
  const fy=sc.accounting.financialYear;
  let h=`<h2 style="font-size:18px;font-weight:800;margin-bottom:16px">Accounting — FY ${esc(fy)}</h2>`;
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:16px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div><span style="color:var(--text-muted)">Financial Year: </span>${selectHTML("fy",fy,FY_OPTIONS,`data-action="changeFY" data-cid="${sc.id}"`)}</div><div><span style="color:var(--text-muted)">Our scope starts: </span>${scopeStartSelectHTML(sc,fy)}</div></div><div><span style="color:var(--text-muted)">Completion: </span><span style="font-weight:700;font-family:var(--mono)">${scm.acctPct}%</span></div></div>${progressHTML(scm.acctPct,10)}
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Months before the engagement start are marked N/A and left out of completion. Set this once per client during onboarding.</div></div>`;

  const months=getFYMonths(fy);
  h+=`<div class="month-grid">`;
  months.forEach(m=>{
    const out=isBeforeScope(sc,m.key);
    const s=out?"Not Applicable":(sc.accounting.monthlyStatus[m.key]||"Not Started");
    const br=(sc.blockedReasons||{})[`acct_${m.key}`]||"";
    const bc=s==="Completed"?"var(--green-border)":s==="Blocked"?"var(--red-border)":s==="In Progress"?"var(--accent-soft)":"var(--border)";
    if(out){
      // Out of scope: no dropdown at all. Showing a disabled one just invites
      // clicking; the scope-start selector above is the single control.
      h+=`<div class="month-cell" style="border-color:var(--border);opacity:0.5"><div class="month-name">${m.label}</div><span class="badge">N/A</span><div style="margin-top:8px;font-size:10px;color:var(--text-muted)">Before our scope</div></div>`;
    }else{
      // Two pieces of work per month: close the books, then issue the MIS.
      // The MIS control is shown greyed until the books are closed, because
      // issuing a report on open books isn't a thing you'd want to record.
      const misSt=((sc.mis&&sc.mis.monthlyStatus)||{})[m.key]||"Not Issued";
      const booksDone=s==="Completed";
      h+=`<div class="month-cell" style="border-color:${bc}"><div class="month-name">${m.label}</div>${badgeHTML(s,1)}<div style="margin-top:8px">${selectHTML(`a_${m.key}`,s,ACCT_STATUSES,`data-acct-key="${m.key}" data-cid="${sc.id}"`)}</div>${s==="Blocked"?`<input class="form-input" style="margin-top:6px;font-size:11px;padding:4px 8px;border-color:var(--red-border)" value="${esc(br)}" placeholder="Reason..." data-blocked-reason="acct_${m.key}" data-cid="${sc.id}">`:''}
        <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);${booksDone?'':'opacity:0.5'}">
          <div class="form-label" style="font-size:9px;margin-bottom:3px">MIS to client</div>
          ${selectHTML(`mis_${m.key}`,misSt,MIS_STATUSES,`data-mis-key="${m.key}" data-cid="${sc.id}"${booksDone?'':' title="Close the books for this month first"'}`)}
        </div>
      </div>`;
    }
  });
  h+=`</div>`;
  if(scm.acctPending.length)h+=`<div class="card" style="margin-top:12px"><div class="form-label">Pending Months</div><div style="color:var(--amber);font-size:13px">${scm.acctPending.join(", ")}</div></div>`;
  return h;
}

let pdfjsLoaded=false;
function loadPdfJs(){
  return new Promise((res,rej)=>{
    if(pdfjsLoaded){res();return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";pdfjsLoaded=true;res();};
    s.onerror=()=>rej(new Error("Failed to load PDF library"));
    document.head.appendChild(s);
  });
}

function parseDMY(s){if(!s)return null;const m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(!m)return null;return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}

// Format a Date built with new Date(y,m,d) — i.e. local midnight. toISOString()
// would convert to UTC first and, at UTC+4, hand back the previous day.
function fmtLocalDate(d){if(!d)return null;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function parseDateRange(s){if(!s)return null;const parts=s.split(/\s*[-–]\s*/);if(parts.length===2)return{from:parseDMY(parts[0].trim()),to:parseDMY(parts[1].trim())};return null;}

function parseTaxPeriods(text){
  const periods=[];
  const mMap={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,june:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const re=/(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|june|jul|aug|sep|oct|nov|dec)\w*\s+to\s+(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|june|jul|aug|sep|oct|nov|dec)\w*/gi;
  let m;
  while((m=re.exec(text))!==null){
    const sm=mMap[m[2].toLowerCase().substring(0,3)];
    const em=mMap[m[4].toLowerCase().substring(0,3)];
    const ed=parseInt(m[3]);
    if(sm&&em)periods.push({startMonth:sm,endMonth:em,endDay:ed});
  }
  return periods;
}

// UAE public holidays (fixed dates — approximate, some shift yearly)
function getUAEPublicHolidays(year){
  return [
    `${year}-01-01`, // New Year
    `${year}-12-02`, // National Day
    `${year}-12-03`, // National Day
    // Eid Al Fitr (approx — shifts ~11 days each year)
    // Eid Al Adha (approx)
    // Islamic New Year, Prophet's Birthday (approx)
    // These are approximate — exact dates change with lunar calendar
  ];
}

// Get next UAE business day (UAE weekend = Sat & Sun since 2022)
function nextBusinessDay(dateStr){
  let d=new Date(dateStr);
  const holidays=new Set([...getUAEPublicHolidays(d.getFullYear()),...getUAEPublicHolidays(d.getFullYear()+1)]);
  // Keep moving forward if weekend (Sat=6, Sun=0) or public holiday
  while(d.getDay()===6||d.getDay()===0||holidays.has(d.toISOString().slice(0,10))){
    d.setDate(d.getDate()+1);
  }
  return d.toISOString().slice(0,10);
}

// Determine Financial Year for a period
// UAE default: FY = calendar year of the period START month
// If period crosses year boundary (e.g., Dec-Feb), FY = year of the start month
function getPeriodFY(startMonth, year){
  return String(year);
}

function generateReturnDates(taxPeriods, regDate, yearsAhead=2){
  const results=[];
  const mn=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const regD=new Date(regDate);
  const endDate=new Date(new Date().getFullYear()+yearsAhead,11,31);

  taxPeriods.forEach(tp=>{
    for(let yr=regD.getFullYear();yr<=endDate.getFullYear();yr++){
      let ed=tp.endDay;

      // For cross-year periods (Dec-Feb), end year is next year
      let endYr=yr;
      if(tp.endMonth<tp.startMonth) endYr=yr+1;

      // A February-ending tax period ends on the last day of February — the
      // 29th in a leap year. Certificates state the recurring pattern as "28th
      // February" whatever the year, so normalise instead of taking it
      // literally. Checked against endYr, not yr: a Dec-Feb period starting
      // Dec 2027 ends in Feb 2028, and it's 2028 that decides the leap year.
      if(tp.endMonth===2&&ed>=28)ed=new Date(endYr,1,29).getDate()===29?29:28;

      const pEnd=new Date(endYr,tp.endMonth-1,ed);
      const pStart=new Date(yr,tp.startMonth-1,1);

      if(pEnd<regD||pStart>endDate)continue;

      // Due date = 28th of month after period end
      let dueMonth=tp.endMonth+1;
      let dueYear=endYr;
      if(dueMonth>12){dueMonth=1;dueYear++;}

      // Base due date: 28th
      const baseDue=`${dueYear}-${String(dueMonth).padStart(2,'0')}-28`;
      // Adjust to next business day
      const actualDue=nextBusinessDay(baseDue);

      // Financial year = year when period starts
      const fy=getPeriodFY(tp.startMonth,yr);

      // Period label
      const label=`${mn[tp.startMonth]}-${mn[tp.endMonth]} ${tp.endMonth<tp.startMonth?yr+'/'+(endYr%100):yr}`;

      results.push({
        period:label,
        // Store the period explicitly. The due date alone isn't enough to work
        // back from: it's the 28th pushed to the next business day, so it can
        // land on the 29th, 30th, 1st or 2nd, and the server would otherwise
        // have to guess the period from it.
        periodStart:fmtLocalDate(pStart),
        periodEnd:fmtLocalDate(pEnd),
        dueDate:actualDue,
        fy:fy,
        filingStatus:"Not Started",
        paymentStatus:"Not Started"
      });
    }
  });

  results.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  return results;
}

async function extractCertificateData(file,type,clientId){
  const sid=type==="vat"?"vatCertStatus":"ctCertStatus";
  const el=document.getElementById(sid);
  if(el){el.style.display="block";el.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Reading ${esc(file.name)}...</div>`;}

  try{
    let text="";
    if(file.type==="application/pdf"){
      if(el)el.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Loading PDF parser...</div>`;
      await loadPdfJs();
      const ab=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:ab}).promise;
      if(el)el.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Extracting text from ${pdf.numPages} page(s)...</div>`;
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();text+=c.items.map(it=>it.str).join(" ")+"\n";}
    }else{
      if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">⚠ Please upload the PDF version of the certificate.</div>`;
      return;
    }

    if(!text.trim()){if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">⚠ No text found in PDF. It may be a scanned image — try a text-based PDF.</div>`;return;}

    const sc=getClient(clientId);if(!sc)return;

    if(type==="vat"){
      // Normalize: collapse multiple whitespace/newlines
      const t=text.replace(/\r\n/g,"\n");

      let trn=null;
      // TRN: handle "Tax Registration Number\n105332551800003" or inline
      const trnM=t.match(/Tax\s*Registration\s*Number[\s\n]+(\d{15})/i)||t.match(/(\d{15})/);
      if(trnM)trn=trnM[1];

      let regDate=null;
      // Handle "Effective Registration Date\n01/03/2026" with possible Arabic text after
      const regM=t.match(/Effective\s*Registration\s*Date[\s\n]+(\d{1,2}\/\d{1,2}\/\d{4})/i);
      if(regM)regDate=parseDMY(regM[1]);

      let firstPeriod=null;
      // Handle "First VAT Return Period\n01/03/2026 - 31/05/2026"
      const fpM=t.match(/First\s*VAT\s*Return\s*Period[\s\n]+([\d\/]+\s*[-–]\s*[\d\/]+)/i);
      if(fpM)firstPeriod=parseDateRange(fpM[1]);

      let firstDue=null;
      // Handle "VAT Return due date\n29/06/2026"
      const ddM=t.match(/VAT\s*Return\s*due\s*date[\s\n]+(\d{1,2}\/\d{1,2}\/\d{4})/i);
      if(ddM)firstDue=parseDMY(ddM[1]);

      // Extract tax periods pattern — handle multi-line
      let pText="";
      const tpM=t.match(/Start\s*and\s*end\s*dates?\s*of\s*Tax\s*periods?[\s\n]+([\s\S]*?)(?:List\s*of|قامئة|قائمة|licenses|\n\s*\n|Legal\s*Name)/i);
      if(tpM)pText=tpM[1];
      if(!pText){const t2=t.match(/((?:\d{1,2}(?:st|nd|rd|th)?\s+\w+\s+to\s+\d{1,2}(?:st|nd|rd|th)?\s+\w+[\s,]*)+)/i);if(t2)pText=t2[1];}

      const taxPeriods=parseTaxPeriods(pText);

      if(taxPeriods.length>0&&regDate){
        const rds=generateReturnDates(taxPeriods,regDate,2);
        let added=0;
        rds.forEach(rd=>{if(!sc.vat.returnDates.some(e=>e.period===rd.period)){sc.vat.returnDates.push({id:uid(),period:rd.period,periodStart:rd.periodStart,periodEnd:rd.periodEnd,dueDate:rd.dueDate,fy:rd.fy||"",filingStatus:"Not Started",paymentStatus:"Not Started"});added++;}});
        sc.vat.returnDates.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
        markUpdated(sc);
        let msg=`✅ Extracted <b>${added}</b> VAT return period${added!==1?'s':''}`;
        if(trn)msg+=` · TRN: <b>${esc(trn)}</b>`;
        if(regDate)msg+=` · Registered: <b>${fmtDate(regDate)}</b>`;
        msg+=` · <b>${taxPeriods.length===4?'Quarterly':taxPeriods.length===12?'Monthly':taxPeriods.length+' periods/yr'}</b>`;
        if(el)el.innerHTML=`<div class="alert" style="margin:0;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">${msg}</div>`;
        updateUI();
      }else if(firstDue&&firstPeriod){
        const lbl=`First Return (${fmtDate(firstPeriod.from)} - ${fmtDate(firstPeriod.to)})`;
        // A first VAT return period is frequently not a standard length, so the
        // explicit dates matter here more than anywhere — they can't be inferred.
        if(!sc.vat.returnDates.some(e=>e.dueDate===firstDue)){sc.vat.returnDates.push({id:uid(),period:lbl,periodStart:firstPeriod.from,periodEnd:firstPeriod.to,dueDate:firstDue,filingStatus:"Not Started",paymentStatus:"Not Started"});sc.vat.returnDates.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));markUpdated(sc);}
        let msg=`✅ First VAT return extracted · Due: <b>${fmtDate(firstDue)}</b>`;
        if(trn)msg+=` · TRN: <b>${esc(trn)}</b>`;
        msg+=`<br><span style="font-size:11px;color:var(--amber)">⚠ Could not parse full period pattern — add remaining periods manually.</span>`;
        if(el)el.innerHTML=`<div class="alert" style="margin:0;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">${msg}</div>`;
        updateUI();
      }else{
        let msg=`⚠ Could not extract return dates.`;if(trn)msg+=` TRN: ${trn}.`;msg+=` Add periods manually.`;
        if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">${msg}</div>`;
      }
    }
    else if(type==="ct"){
      const t=text.replace(/\r\n/g,"\n");

      // TRN
      let trn=null;
      const ctTrn=t.match(/Tax\s*Registration\s*Number[\s\n]+(\d{15})/i)||t.match(/(\d{15})/);
      if(ctTrn)trn=ctTrn[1];

      let fpFrom=null,fpTo=null,ctDue=null;

      // PRIMARY: Look for the CT period table row pattern
      // Format: "January - December" followed by 3 dates (Start, End, Due)
      // Works for both pdf.js (space-joined) and newline-separated text
      const monthNames="January|February|March|April|May|June|July|August|September|October|November|December";
      const rowPattern=new RegExp(`(?:${monthNames})\\s*[-–]\\s*(?:${monthNames})[\\s\\S]*?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})[\\s\\S]*?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})[\\s\\S]*?(\\d{1,2}\\/\\d{1,2}\\/\\d{4})`,"i");
      const rowMatch=t.match(rowPattern);
      if(rowMatch){
        fpFrom=parseDMY(rowMatch[1]);
        fpTo=parseDMY(rowMatch[2]);
        ctDue=parseDMY(rowMatch[3]);
      }

      // FALLBACK 1: Look for "Filing Due Date" with a date
      if(!ctDue){
        const duePatterns=[
          /(?:Filing\s*Due\s*Date|Return\s*Filing\s*Due\s*Date)[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
          /(?:CT|Corporate\s*Tax)\s*Return\s*due\s*date[\s\n]+(\d{1,2}\/\d{1,2}\/\d{4})/i,
          /due\s*date[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
        ];
        for(const pat of duePatterns){
          const m=t.match(pat);
          if(m){ctDue=parseDMY(m[1]);if(ctDue)break;}
        }
      }

      // FALLBACK 2: Look for date range as period
      if(!fpFrom||!fpTo){
        const periodPatterns=[
          /First\s*Corporate\s*Tax\s*Period[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
          /(?:Period\s*Start)[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})[\s\S]*?(?:Period\s*End)[\s\S]*?(\d{1,2}\/\d{1,2}\/\d{4})/i,
        ];
        for(const pat of periodPatterns){
          const m=t.match(pat);
          if(m){fpFrom=fpFrom||parseDMY(m[1]);fpTo=fpTo||parseDMY(m[2]);if(fpFrom&&fpTo)break;}
        }
      }

      // FALLBACK 3: If we have period end but no due date, calculate (9 months after FY end)
      if(!ctDue&&fpTo){
        const d=new Date(fpTo);d.setMonth(d.getMonth()+9);
        ctDue=nextBusinessDay(d.toISOString().slice(0,10));
      }

      // FALLBACK 4: Check for CT Registration Application (no dates, just submission)
      let isApplication=false;
      let submissionDate=null;
      let entityName=null;
      let refNumber=null;
      if(!ctDue&&!fpFrom){
        const appMatch=t.match(/Application\s*Submitted\s*Successfully/i);
        if(appMatch)isApplication=true;
        const subMatch=t.match(/Submission\s*Date[\s\S]*?(\d{1,2}\s+\w+\s+\d{4})/i);
        if(subMatch)submissionDate=subMatch[1];
        const entMatch=t.match(/Entity\s*Name[\s\S]*?:\s*(.+?)(?:\n|Applicant)/i);
        if(entMatch)entityName=entMatch[1].trim();
        const refMatch=t.match(/Reference\s*Number[\s\S]*?:\s*(\d+)/i);
        if(refMatch)refNumber=refMatch[1];
      }

      // Derive Financial Year
      // FY = the year the tax period covers, NOT the filing year
      // Period 01/11/2025 to 31/12/2026 → FY end is 31/12/2026 → FY = 2025 (first year of the period)
      // Due date 30/09/2027 → FY = 2027 - 1 = 2026? No — check the period end year
      // Rule: FY = year derived from the period, or due_date_year - 1
      let ctFY=null;
      if(fpFrom&&fpTo){
        // The FY end year is in fpTo. For Jan-Dec calendar year, FY = fpTo year
        // But the "Financial Year" is the year the period ends
        // Due is always 9 months after fpTo
        // So FY = fpTo year - but we label it as the ASSESSMENT year
        // Actually: if period is 01/11/2025 to 31/12/2026, FY = 2026 (year of period end)
        // But filing is due 30/09/2027
        // In UAE: FY = year the financial period ends
        // The CT FY label should match what FTA shows: the year it ends
        // For due date display: filing in 2027 is FOR FY ending 2026
        ctFY=fpTo.substring(0,4);
      } else if(ctDue){
        ctFY=String(parseInt(ctDue.substring(0,4))-1);
      }

      // Apply extracted data
      if(ctDue)sc.ct.dueDate=ctDue;
      if(ctFY)sc.ct.financialYear=ctFY;
      markUpdated(sc);

      // Build result message
      let msg="";
      if(isApplication){
        msg=`ℹ This is a CT <b>Registration Application</b> (not the certificate). No due dates available yet.`;
        if(entityName)msg+=`<br>Entity: <b>${esc(entityName)}</b>`;
        if(refNumber)msg+=` · Ref: <b>${esc(refNumber)}</b>`;
        if(submissionDate)msg+=` · Submitted: <b>${esc(submissionDate)}</b>`;
        msg+=`<br><span style="font-size:11px">Upload the actual CT Registration Certificate once issued to auto-extract dates.</span>`;
        if(el)el.innerHTML=`<div class="alert alert-info" style="margin:0">${msg}</div>`;
      } else if(ctDue){
        msg=`✅ CT extracted`;
        msg+=` · Due: <b>${fmtDate(ctDue)}</b>`;
        if(ctFY)msg+=` · FY: <b>${ctFY}</b>`;
        if(trn)msg+=` · TRN: <b>${esc(trn)}</b>`;
        if(fpFrom&&fpTo)msg+=` · Period: ${fmtDate(fpFrom)} to ${fmtDate(fpTo)}`;
        if(el)el.innerHTML=`<div class="alert" style="margin:0;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">${msg}</div>`;
        updateUI();
      } else {
        msg=`⚠ Could not extract CT dates.`;
        if(trn)msg+=` TRN: <b>${esc(trn)}</b>.`;
        msg+=` Enter due date manually.`;
        if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">${msg}</div>`;
      }
    }
  }catch(err){
    console.error(err);
    const el=document.getElementById(type==="vat"?"vatCertStatus":"ctCertStatus");
    if(el)el.innerHTML=`<div class="alert alert-warning" style="margin:0">❌ ${esc(err.message)}</div>`;
  }
}

// ═══════════════════════════════════════════════════════════════
// EXCEL IMPORT / EXPORT
// ═══════════════════════════════════════════════════════════════
function processExcelFile(file){
  const statusEl=document.getElementById("importStatus");
  if(!statusEl)return;
  statusEl.style.display="block";
  statusEl.innerHTML=`<div class="alert alert-info" style="margin:0">⏳ Reading: ${esc(file.name)}...</div>`;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let headerIdx=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].some(c=>String(c).toLowerCase().includes("client name"))){headerIdx=i;break;}}
      if(headerIdx===-1){statusEl.innerHTML=`<div class="alert alert-warning" style="margin:0">⚠ "Client Name" header not found in first 10 rows.</div>`;return;}
      const hdr=rows[headerIdx].map(h=>String(h).toLowerCase().trim());
      const col={name:hdr.findIndex(h=>h.includes("client name")),entity:hdr.findIndex(h=>h.includes("entity")),team:hdr.findIndex(h=>h.includes("assigned")||h.includes("team")),vat:hdr.findIndex(h=>h.includes("vat")),nature:hdr.findIndex(h=>h.includes("nature")),ct:hdr.findIndex(h=>h.includes("ct")||h.includes("corporate")),fy:hdr.findIndex(h=>h.includes("year start")||h.includes("financial")),ctdue:hdr.findIndex(h=>h.includes("due date")||h.includes("ct due"))};
      let imported=0,skipped=0,dupes=0;const errors=[];
      const existing=new Set([...state.clients.map(c=>c.name.toLowerCase()),...state.bulkClients.map(c=>c.name.toLowerCase())]);
      const parseBool=v=>{const s=String(v||"").toLowerCase().trim();return s===""||s==="yes"||s==="y"||s==="true"||s==="1";};
      const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s).getTime());
      for(let i=headerIdx+1;i<rows.length;i++){
        const r=rows[i];const rn=i+1;const name=String(r[col.name]||"").trim();
        if(!name){skipped++;continue;}
        if(existing.has(name.toLowerCase())){dupes++;continue;}
        const eRaw=col.entity>=0?String(r[col.entity]||"").trim():"";
        // An unrecognised entity parks at Not Recorded, not at a guessed
        // "Mainland LLC". A wrong-but-plausible label is worse than a blank
        // one, because nobody comes back to correct it.
        let entity="Not Recorded";
        if(eRaw){const norm=normalizeEntityType(eRaw);if(norm)entity=norm;else errors.push(`Row ${rn}: Unknown entity "${eRaw}" → Not Recorded`);}
        const nRaw=col.nature>=0?String(r[col.nature]||"").trim():"";
        let nature="Not Recorded";
        if(nRaw){const nn=BUSINESS_NATURES.find(b=>b.toLowerCase()===nRaw.toLowerCase());if(nn)nature=nn;else if(/^trad/i.test(nRaw))nature="Trading";else if(/^serv/i.test(nRaw))nature="Service";else errors.push(`Row ${rn}: Unknown nature "${nRaw}" → Not Recorded`);}
        const team=col.team>=0?String(r[col.team]||"").trim()||"Unassigned":"Unassigned";
        let vat="Yes";
        if(col.vat>=0){const vr=String(r[col.vat]||"").trim().toLowerCase();if(!vr||vr==="yes")vat="Yes";else if(vr==="no")vat="No";else if(vr.includes("pending")||vr.includes("await"))vat="Pending - Documents Awaited";else if(vr.includes("registration")||vr.includes("progress"))vat="Pending - Registration in Progress";else{errors.push(`Row ${rn}: Unknown VAT "${r[col.vat]}" → Yes`);}}
        let ct=true;if(col.ct>=0)ct=parseBool(r[col.ct]);
        state.bulkClients.push({name,entityType:entity,businessNature:nature,assignedTeam:team,vatApplicable:vat,ctApplicable:ct});
        existing.add(name.toLowerCase());imported++;
      }
      let msg=imported?`<div class="alert" style="margin:0 0 6px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)">✅ Imported <b>${imported}</b> client${imported!==1?'s':''}${dupes?` · ${dupes} dupes skipped`:''}${skipped?` · ${skipped} empty rows`:''}</div>`:`<div class="alert alert-warning" style="margin:0 0 6px">No valid clients found</div>`;
      if(errors.length)msg+=`<div style="padding:6px 10px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);font-size:11px;max-height:80px;overflow-y:auto;margin-top:4px"><div style="font-weight:700;color:var(--amber);margin-bottom:2px">${errors.length} warning${errors.length!==1?'s':''}:</div>${errors.map(e=>`<div style="color:var(--text-secondary)">• ${esc(e)}</div>`).join("")}</div>`;
      statusEl.innerHTML=msg;render();
    }catch(err){statusEl.innerHTML=`<div class="alert alert-warning" style="margin:0">❌ ${esc(err.message)}</div>`;}
  };
  reader.onerror=()=>{statusEl.innerHTML=`<div class="alert alert-warning" style="margin:0">❌ Read failed</div>`;};
  reader.readAsArrayBuffer(file);
}

// ═══════════════════════════════════════════════════════════════
// USER MANAGEMENT
// ═══════════════════════════════════════════════════════════════
// One list of people, replacing two.
//
// Before this there was a "Team (11)" list of bare names that clients were
// assigned to, and a separate /admin page holding the three people who
// actually had logins. Nothing joined them, so a client could be assigned to
// somebody who could not open the tool, and no workload figure meant
// anything. The name list is gone; clients are assigned to users.
//
// The /admin page this replaces was also unreachable: its route checked for
// the role 'admin', so a Super Admin got redirected away from their own admin
// panel — which is why the gear appeared to do nothing.
const usersState={loading:false,error:'',people:null,orphans:[],working:'',inviteOpen:false};

async function loadOrgPeople(force){
  if(usersState.loading) return;
  if(state.orgPeople && !force) return;
  usersState.loading=true;
  try{
    const j=await apiJSON('/api/users/org');
    state.orgPeople=j.people||[];
    usersState.people=j.people||[];
    usersState.orphans=j.orphanOwners||[];
    usersState.error='';
  }catch(e){ usersState.error=e.message; }
  usersState.loading=false;
  render();
}

async function userAction(fn,label){
  usersState.working=label; usersState.error=''; render();
  try{ await fn(); await loadOrgPeople(true); }
  catch(e){ usersState.error=e.message; }
  usersState.working=''; render();
}

function renderUserManagement(){
  if(!isSuperAdmin())return`<div class="empty-state"><div class="empty-state-icon">🔒</div><div class="empty-state-title">Super Admin only</div></div>`;
  if(!state.orgPeople&&!usersState.loading){ setTimeout(()=>loadOrgPeople(true),0); }

  const people=usersState.people||[];
  const orphans=usersState.orphans||[];
  const stranded=strandedOwners();

  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div><h2 style="font-size:20px;font-weight:800;margin:0">👤 User Management</h2>
    <div style="font-size:12px;color:var(--text-muted);margin-top:3px">Everyone who can sign in. Clients are assigned to these people — there is no separate team list any more.</div></div>
    <div style="display:flex;gap:8px"><button class="btn" data-action="reloadUsers">↻ Refresh</button><button class="btn btn-primary" data-action="toggleInvite">${usersState.inviteOpen?'Cancel':'+ Invite person'}</button></div>
  </div>`;

  if(usersState.error)h+=`<div class="alert" style="margin-bottom:12px;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)">${esc(usersState.error)}</div>`;
  if(usersState.working)h+=`<div class="alert" style="margin-bottom:12px;background:var(--bg-elevated);border:1px solid var(--border)">⏳ ${esc(usersState.working)}</div>`;

  if(usersState.inviteOpen){
    h+=`<div class="card" style="margin-bottom:14px;border-color:var(--accent-soft)"><div class="card-title">Invite someone</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end">
        <div><div class="form-label">Name</div><input class="form-input" id="invName" placeholder="e.g., Lavanya"></div>
        <div><div class="form-label">Email</div><input class="form-input" id="invEmail" placeholder="name@bcl.ae"></div>
        <div><div class="form-label">Role</div><select class="form-input" id="invRole"><option value="user">User</option><option value="admin">Admin (team lead)</option><option value="super_admin">Super Admin</option></select></div>
        <div><div class="form-label">Reports to</div><select class="form-input" id="invReports"><option value="">— nobody —</option>${people.filter(p=>p.role!=='user').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
        <button class="btn btn-primary" data-action="sendInvite">Send invite</button>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5">A User sees only their own clients. An Admin is a team lead and sees everyone who reports to them — so give an Admin their reports, or they will see only their own work.</div>
    </div>`;
  }

  // Anyone holding clients without an account. This is the loose end left by
  // folding the two lists into one, so it is stated plainly here rather than
  // left for somebody to discover when a filing is missed.
  const strandedNames=[...new Set([...stranded,...orphans.map(o=>o.name)])];
  if(strandedNames.length){
    h+=`<div class="card" style="margin-bottom:14px;border-color:var(--amber-border)">
      <div class="card-title" style="color:var(--amber)">⚠ Holding clients but cannot sign in</div>
      <div style="font-size:12px;color:var(--text-muted);line-height:1.6;margin-bottom:10px">These names have clients against them but no login, so they cannot see or do that work. Invite them, or move their clients to someone in Workload.</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${strandedNames.map(n=>{
        const cnt=(state.clients||[]).filter(c=>c.assignedTeam===n).length;
        return `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;font-size:12px"><b>${esc(n)}</b><span style="color:var(--text-muted)">${cnt} client${cnt===1?'':'s'}</span><button class="btn btn-sm" data-action="inviteName" data-name="${esc(n)}" style="font-size:10px;padding:2px 8px">Invite</button></span>`;
      }).join('')}</div></div>`;
  }

  if(usersState.loading&&!people.length)h+=`<div style="padding:28px;text-align:center;color:var(--text-muted);font-size:13px">Loading people…</div>`;
  else if(!people.length)h+=`<div class="empty-state"><div class="empty-state-icon">👤</div><div class="empty-state-title">No users yet</div></div>`;
  else{
    h+=`<div class="card" style="overflow-x:auto"><table><thead><tr>
      <th style="text-align:left">Name</th><th style="text-align:left">Email</th><th style="text-align:left">Role</th>
      <th style="text-align:left">Reports to</th><th style="text-align:right">Clients</th><th style="text-align:left">Last login</th><th></th></tr></thead><tbody>`;
    people.forEach(p=>{
      const isMe=currentUser&&String(currentUser.id)===String(p.id);
      h+=`<tr${p.active===false?' style="opacity:0.5"':''}>
        <td style="font-weight:600">${esc(p.name||'(no name set)')}${isMe?' <span style="font-size:10px;color:var(--text-muted)">(you)</span>':''}${p.active===false?' <span style="font-size:10px;color:var(--red)">deactivated</span>':''}</td>
        <td style="color:var(--text-muted)">${esc(p.email||'—')}</td>
        <td><select class="form-input" data-user-role="${p.id}" style="padding:3px 6px;font-size:11px;max-width:150px"${isMe?' disabled title="You cannot change your own role"':''}>
          ${[['user','User'],['admin','Admin (team lead)'],['super_admin','Super Admin']].map(function(r){return `<option value="${r[0]}"${p.role===r[0]?' selected':''}>${r[1]}</option>`;}).join('')}
        </select></td>
        <td><select class="form-input" data-user-reports="${p.id}" style="padding:3px 6px;font-size:11px;max-width:140px">
          <option value="">— nobody —</option>
          ${people.filter(x=>String(x.id)!==String(p.id)&&x.role!=='user').map(x=>`<option value="${x.id}"${String(p.reports_to)===String(x.id)?' selected':''}>${esc(x.name)}</option>`).join('')}
        </select>${(p.role==='admin'&&!people.some(x=>String(x.reports_to)===String(p.id)))?`<div style="font-size:10px;color:var(--amber);margin-top:2px">no reports — sees only own clients</div>`:''}</td>
        <td style="text-align:right;font-weight:700">${p.clientCount||0}</td>
        <td style="color:var(--text-muted);font-size:11px">${p.last_login?fmtDate(String(p.last_login).slice(0,10)):'never'}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm" data-action="resetPwd" data-id="${p.id}" data-name="${esc(p.name)}" style="font-size:10px">Reset password</button>
          ${isMe?'':`<button class="btn btn-sm" data-action="toggleActive" data-id="${p.id}" data-name="${esc(p.name)}" data-active="${p.active===false?'0':'1'}" style="font-size:10px">${p.active===false?'Reactivate':'Deactivate'}</button>`}
          ${isMe?'':`<button class="btn btn-sm" data-action="deleteUser" data-id="${p.id}" data-name="${esc(p.name||'(no name set)')}" data-clients="${p.clientCount||0}" style="font-size:10px;color:var(--red);border-color:var(--red-border)" title="Remove this person entirely. Deactivate is usually what you want.">Delete</button>`}
        </td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  return h;
}

// ═══════════════════════════════════════════════════════════════
// WORKLOAD — who is carrying too much this month
// ═══════════════════════════════════════════════════════════════
// The question managers actually ask: eight VAT returns land on one person
// this month and two on another — is that right, and what should move?
//
// Counts the work itself (VAT returns due, CT returns due, months of books)
// rather than open tasks, and moves whole clients rather than single tasks.
// Splitting one client's filings across two people is how they get missed.
const wlState={loading:false,error:'',data:null,month:'',suggestions:null,selected:new Set(),working:''};

function wlMonthOptions(){
  // Six months back, six forward — the window a compliance team plans in.
  const out=[],now=new Date();
  for(let i=-6;i<=6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    out.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:MONTHS[d.getMonth()]+' '+d.getFullYear()});
  }
  return out;
}

async function loadWorkload(force){
  if(wlState.loading&&!force) return;
  wlState.loading=true; wlState.error=''; render();
  try{
    const q=wlState.month?('?month='+encodeURIComponent(wlState.month)):'';
    const d=await apiJSON('/api/team/pressure'+q);
    wlState.data=d; wlState.month=d.month; wlState.suggestions=null; wlState.selected=new Set();
  }catch(e){ wlState.error=e.message; wlState.data=null; }
  wlState.loading=false; render();
}

async function loadWorkloadSuggestions(){
  wlState.working='Working out what to move…'; render();
  try{
    const q='?max=10'+(wlState.month?('&month='+encodeURIComponent(wlState.month)):'');
    const s=await apiJSON('/api/team/pressure/suggestions'+q);
    wlState.suggestions=s;
    // Pre-tick everything: the whole point is the set, and unticking one is
    // easier than ticking eight.
    wlState.selected=new Set((s.moves||[]).map((_,i)=>i));
  }catch(e){ wlState.error=e.message; }
  wlState.working=''; render();
}

async function applyWorkloadMoves(){
  const all=(wlState.suggestions&&wlState.suggestions.moves)||[];
  const picked=all.filter((_,i)=>wlState.selected.has(i));
  if(!picked.length){ alert('Tick at least one move to apply.'); return; }
  if(!confirm('Move '+picked.length+' client(s) to a different person?\n\nThis changes who owns the client and its corporate tax, and shows up in the activity log.')) return;
  wlState.working='Moving '+picked.length+' client(s)…'; render();
  try{
    const r=await apiJSON('/api/team/pressure/rebalance',{method:'POST',body:JSON.stringify({moves:picked.map(m=>({clientId:m.clientId,toUserId:m.toUserId}))})});
    await reloadTrackerFromServer();
    await loadOrgPeople(true);
    wlState.working=''; wlState.suggestions=null;
    await loadWorkload(true);
    alert('Moved '+r.applied.length+' client(s).'+(r.rejected.length?('\n\n'+r.rejected.length+' could not be moved.'):''));
  }catch(e){ wlState.error=e.message; wlState.working=''; render(); }
}

function wlBar(p,maxScore){
  const pct=maxScore>0?Math.round((p.score/maxScore)*100):0;
  const col=p.band==='over'?'var(--red)':p.band==='light'?'var(--blue)':'var(--green)';
  return `<div style="height:8px;background:var(--bg-elevated);border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:4px"></div></div>`;
}

function renderWorkload(){
  if(!isAdmin())return`<div class="empty-state"><div class="empty-state-icon">🔒</div><div class="empty-state-title">Managers only</div></div>`;
  if(!wlState.data&&!wlState.loading){ setTimeout(()=>loadWorkload(true),0); }

  const months=wlMonthOptions();
  const cur=wlState.month||'';
  let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div><h2 style="font-size:20px;font-weight:800;margin:0">⚖️ Workload</h2>
    <div style="font-size:12px;color:var(--text-muted);margin-top:3px">What each person is carrying this month, and what to move if it is lopsided.</div></div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="form-input" id="wlMonth" style="max-width:160px">${months.map(m=>`<option value="${m.key}"${m.key===cur?' selected':''}>${m.label}</option>`).join('')}</select>
      <button class="btn" data-action="wlReload">↻</button>
    </div></div>`;

  if(wlState.error)h+=`<div class="alert" style="margin-bottom:12px;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)">${esc(wlState.error)}</div>`;
  if(wlState.working)h+=`<div class="alert" style="margin-bottom:12px;background:var(--bg-elevated);border:1px solid var(--border)">⏳ ${esc(wlState.working)}</div>`;
  if(wlState.loading&&!wlState.data)return h+`<div style="padding:28px;text-align:center;color:var(--text-muted);font-size:13px">Working out this month's load…</div>`;

  const d=wlState.data;
  if(!d)return h;
  const people=d.people||[];
  if(!people.length)return h+`<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-title">Nobody to show</div><div style="font-size:12px;color:var(--text-muted)">Invite people in User Management first.</div></div>`;

  const maxScore=Math.max(1,...people.map(p=>p.score));
  const over=people.filter(p=>p.band==='over');
  const light=people.filter(p=>p.band==='light');

  // The headline, in a sentence. A manager should be able to read one line and
  // know whether to act — the table below is for when the answer is yes.
  const verdict = !d.totals.score
    ? {t:'Nothing due this month.',c:'var(--text-muted)',i:'○'}
    : over.length
      ? {t:over.map(p=>p.name).join(' and ')+(over.length>1?' are':' is')+' carrying well above an even share'+(light.length?', while '+light.map(p=>p.name).join(' and ')+(light.length>1?' have':' has')+' room.':'.'),c:'var(--red)',i:'⚠'}
      : {t:'The month is evenly spread across the team.',c:'var(--green)',i:'✓'};
  h+=`<div class="card" style="margin-bottom:14px;border-color:${verdict.c}">
    <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="font-size:22px;line-height:1">${verdict.i}</div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700;color:${verdict.c};line-height:1.45">${esc(verdict.t)}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:5px">${d.totals.vat} VAT return${d.totals.vat===1?'':'s'} · ${d.totals.ct} CT return${d.totals.ct===1?'':'s'} · ${d.totals.books} month${d.totals.books===1?'':'s'} of books, across ${people.length} ${people.length===1?'person':'people'}. An even share is about ${d.totals.fairShare} points each.</div>
      </div>
      ${over.length?`<button class="btn btn-primary" data-action="wlSuggest">Suggest moves</button>`:''}
    </div></div>`;

  h+=`<div class="card" style="margin-bottom:14px;overflow-x:auto"><table><thead><tr>
    <th style="text-align:left">Person</th><th style="text-align:right">VAT</th><th style="text-align:right">CT</th><th style="text-align:right">Books</th>
    <th style="text-align:right">Load</th><th style="text-align:left;min-width:150px">Share of the month</th><th style="text-align:left">Clients</th></tr></thead><tbody>`;
  people.forEach(p=>{
    const col=p.band==='over'?'var(--red)':p.band==='light'?'var(--blue)':'var(--green)';
    const label=p.band==='over'?'over':p.band==='light'?'has room':'even';
    h+=`<tr>
      <td style="font-weight:600">${esc(p.name)}${p.vatNeedsSetup?`<div style="font-size:10px;color:var(--amber)">${p.vatNeedsSetup} VAT client${p.vatNeedsSetup===1?'':'s'} with no periods set up</div>`:''}</td>
      <td style="text-align:right;font-weight:700${p.vat?'':';opacity:0.35'}">${p.vat}</td>
      <td style="text-align:right;font-weight:700${p.ct?'':';opacity:0.35'}">${p.ct}</td>
      <td style="text-align:right${p.books?'':';opacity:0.35'}">${p.books}</td>
      <td style="text-align:right;font-weight:800">${p.score}</td>
      <td>${wlBar(p,maxScore)}<div style="font-size:10px;color:${col};margin-top:3px;font-weight:600">${Math.round(p.ratio*100)}% of an even share · ${label}</div></td>
      <td style="color:var(--text-muted)">${p.clients}</td></tr>`;
  });
  if(d.unassigned&&d.unassigned.clients){
    h+=`<tr><td style="font-weight:600;color:var(--amber)">Unassigned</td><td style="text-align:right">${d.unassigned.vat}</td><td style="text-align:right">${d.unassigned.ct}</td><td style="text-align:right">${d.unassigned.books}</td><td style="text-align:right;font-weight:800">${d.unassigned.score}</td><td colspan="2" style="font-size:11px;color:var(--amber)">Nobody owns these — assign them</td></tr>`;
  }
  h+=`</tbody></table>
    <div style="font-size:11px;color:var(--text-muted);margin-top:10px;line-height:1.5">Load weights one CT return as ${d.weights.ct}, one VAT return as ${d.weights.vat} and one month of books as ${d.weights.books} — a CT return is the heaviest single job of the year, a month of books the smallest unit. A VAT-registered client whose return periods have not been set up still counts, because the work is real even though no row exists yet.</div></div>`;

  (d.noLoginOwners||[]).length && (h+=`<div class="card" style="margin-bottom:14px;border-color:var(--amber-border)">
    <div class="card-title" style="color:var(--amber)">⚠ Work held by people without a login</div>
    <div style="font-size:12px;color:var(--text-muted);line-height:1.6;margin-bottom:8px">Not counted above, because these names cannot sign in and do it. Invite them in User Management or move their clients.</div>
    ${d.noLoginOwners.map(o=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px"><b>${esc(o.name)}</b><span style="color:var(--text-muted)">${o.clients} client${o.clients===1?'':'s'} · ${o.vat} VAT · ${o.ct} CT</span></div>`).join('')}</div>`);

  const sg=wlState.suggestions;
  if(sg){
    if(!sg.moves||!sg.moves.length){
      h+=`<div class="card"><div style="font-size:13px;color:var(--text-muted)">${esc(sg.note||'Nothing worth moving.')}</div></div>`;
    }else{
      h+=`<div class="card" style="border-color:var(--accent-soft)">
        <div class="card-title">Suggested moves</div>
        <div style="font-size:12px;color:var(--text-muted);line-height:1.6;margin-bottom:10px">Whole clients, moved from the busiest person to the one with most room. Untick anything you would rather keep where it is.</div>
        <table><thead><tr><th style="width:28px"></th><th style="text-align:left">Client</th><th style="text-align:left">From</th><th style="text-align:left">To</th><th style="text-align:right">Load</th><th style="text-align:left">Closes the gap</th></tr></thead><tbody>`;
      sg.moves.forEach((m,i)=>{
        h+=`<tr><td><input type="checkbox" data-wl-move="${i}"${wlState.selected.has(i)?' checked':''}></td>
          <td style="font-weight:600">${esc(m.clientName)}<div style="font-size:10px;color:var(--text-muted)">${[m.vat?m.vat+' VAT':'',m.ct?m.ct+' CT':'',m.books?m.books+' books':''].filter(Boolean).join(' · ')}</div></td>
          <td>${esc(m.fromName)}</td><td style="font-weight:600">${esc(m.toName)}</td>
          <td style="text-align:right;font-weight:700">${m.score}</td>
          <td style="font-size:11px;color:var(--text-muted)">${m.gapBefore} → <b style="color:var(--green)">${m.gapAfter}</b></td></tr>`;
      });
      h+=`</tbody></table>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <button class="btn" data-action="wlClearSuggest">Discard</button>
          <button class="btn btn-primary" data-action="wlApply">Apply ${wlState.selected.size} move${wlState.selected.size===1?'':'s'}</button>
        </div></div>`;
    }
  }
  return h;
}

// ═══════════════════════════════════════════════════════════════
// FETCH CLIENTS FROM OPS-MKT
// ═══════════════════════════════════════════════════════════════
// Ops-Mkt is where a client first exists — the moment the firm signs it, it
// is on that grid with a First POC against it. Re-typing that list here was
// how the two drifted apart, so this pulls it across instead: pick the First
// POCs whose book this tracker should carry, see exactly what will arrive,
// then fetch. After that the nightly sweep keeps up with new signings on its
// own, and Refresh does the same on demand.
//
// It only ever adds. A client disengaged in Ops-Mkt keeps its record here,
// because its filings and its history are still this team's work.
const opsState={loading:false,error:'',pocs:null,selected:new Set(),preview:null,previewing:false,working:'',status:null,activeOnly:true};

// Pull the client list back from the server after a fetch or a sync. The
// clients are created server-side, so the page has to re-read them rather
// than merge — and it must not go anywhere near saveData(), which would push
// the stale in-memory list straight back over what was just written.
async function reloadTrackerFromServer(){
  const d=await loadData();
  if(d){ state.clients=d.clients||[]; state.teamMembers=d.teamMembers||[]; }
  render();
}

async function loadOpsMkt(){
  opsState.loading=true;opsState.error='';render();
  try{
    const [p,s]=await Promise.all([apiJSON('/api/opsmkt/pocs'),apiJSON('/api/opsmkt/status')]);
    opsState.pocs=p.pocs||[];opsState.status=s;opsState.activeOnly=s.activeOnly!==false;
    // Pre-tick the POCs already being followed, so Refresh and Fetch show the
    // same selection and nobody has to remember what was chosen last time.
    (s.pocs||[]).forEach(x=>opsState.selected.add(x));
  }catch(e){opsState.error=e.message;}
  opsState.loading=false;render();
}

async function previewOpsMkt(){
  if(!opsState.selected.size){opsState.preview=null;render();return;}
  opsState.previewing=true;opsState.error='';render();
  try{
    opsState.preview=await apiJSON('/api/opsmkt/preview',{method:'POST',body:JSON.stringify({pocs:[...opsState.selected],activeOnly:opsState.activeOnly})});
  }catch(e){opsState.error=e.message;opsState.preview=null;}
  opsState.previewing=false;render();
}

async function runOpsMktFetch(){
  if(!opsState.selected.size){alert('Pick at least one First POC.');return;}
  const n=opsState.preview?opsState.preview.willAdd:0;
  if(!n){alert('Nothing new to add for that selection.');return;}
  if(!confirm('Add '+n+' client(s) to the tracker?\n\nThis creates their VAT and CT obligations too. Nothing in Ops-Mkt is changed.'))return;
  opsState.working='Fetching '+n+' client(s)…';opsState.error='';render();
  try{
    const r=await apiJSON('/api/opsmkt/fetch',{method:'POST',body:JSON.stringify({pocs:[...opsState.selected],activeOnly:opsState.activeOnly})});
    opsState.working='';opsState.preview=null;
    await reloadTrackerFromServer();
    await loadOpsMkt();
    alert('Added '+r.added+' client(s). VAT and CT deadlines set up for '+r.seeded+'.'+(r.deferred?'\n\nThe last '+r.deferred+' will get theirs in tonight\'s run — the clients themselves are already saved.':''));
  }catch(e){opsState.error=e.message;opsState.working='';render();}
}

async function runOpsMktRefresh(){
  opsState.working='Checking Ops-Mkt for new clients…';opsState.error='';render();
  try{
    const r=await apiJSON('/api/opsmkt/sync',{method:'POST',body:JSON.stringify({})});
    opsState.working='';
    await reloadTrackerFromServer();
    await loadOpsMkt();
    alert(r.added?('Added '+r.added+' new client(s): '+(r.newNames||[]).join(', ')):(r.note||'Nothing new — the tracker is already up to date.'));
  }catch(e){opsState.error=e.message;opsState.working='';render();}
}

async function setOpsMktAutoSync(on){
  try{ await apiJSON('/api/opsmkt/settings',{method:'PUT',body:JSON.stringify({autoSync:on})}); await loadOpsMkt(); }
  catch(e){ opsState.error=e.message; render(); }
}

function renderOpsMktModal(){
  const s=opsState.status;
  let h=`<div class="modal-overlay" data-action="closeModal"><div class="modal" onclick="event.stopPropagation()" style="width:860px;max-width:96vw"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px"><div><div class="modal-title" style="margin-bottom:2px">Fetch clients from Ops-Mkt</div><div style="font-size:12px;color:var(--text-muted);line-height:1.5">Pick the First POCs whose clients this tracker should carry. Ops-Mkt is only read — nothing there is changed.</div></div><button class="btn btn-sm" data-action="closeModal">✕</button></div>`;

  if(opsState.error)h+=`<div class="alert" style="margin:12px 0;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)">${esc(opsState.error)}</div>`;
  if(opsState.working)h+=`<div class="alert" style="margin:12px 0;background:var(--bg-elevated);border:1px solid var(--border)">⏳ ${esc(opsState.working)}</div>`;

  if(s&&!s.configured)h+=`<div class="alert" style="margin:12px 0;background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)">The Ops-Mkt link is not configured on the server yet, so nothing can be fetched.</div>`;

  // What the tracker is already following, and when it last looked.
  if(s&&s.pocs&&s.pocs.length){
    h+=`<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);font-size:12px">
      <div><b>Following:</b> ${s.pocs.map(p=>esc(p)).join(', ')}</div>
      <div style="color:var(--text-muted)">${s.fromOpsMkt} of ${s.trackerClients} clients came from Ops-Mkt</div>
      <div style="color:var(--text-muted)">Last checked: ${s.lastSyncAt?fmtDate(s.lastSyncAt.slice(0,10)):'never'}</div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="opsAuto"${s.autoSync?' checked':''}> Add new clients automatically each night</label>
        <button class="btn btn-sm" data-action="opsRefresh">↻ Refresh now</button>
      </div>
    </div>`;
  }

  if(opsState.loading&&!opsState.pocs)h+=`<div style="padding:28px;text-align:center;color:var(--text-muted);font-size:13px">Reading the Ops-Mkt client list…</div>`;
  else if(opsState.pocs){
    h+=`<div class="form-label" style="margin-top:6px">First POC</div>`;
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">`;
    opsState.pocs.forEach(p=>{
      const on=opsState.selected.has(p.poc);
      h+=`<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid ${on?'var(--accent)':'var(--border)'};border-radius:var(--radius);cursor:pointer;font-size:12px;background:${on?'var(--accent-soft)':'transparent'}">
        <input type="checkbox" data-ops-poc="${esc(p.poc)}"${on?' checked':''}>
        <span style="flex:1;font-weight:600">${esc(p.poc)}</span>
        <span style="color:var(--text-muted)">${p.active} active</span>
      </label>`;
    });
    h+=`</div>`;
    h+=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" id="opsActiveOnly"${opsState.activeOnly?' checked':''}> Active clients only</label>
      <button class="btn btn-sm" data-action="opsPreview"${opsState.selected.size?'':' style="opacity:0.4;pointer-events:none"'}>Check what will be added</button>
      <span style="font-size:11px;color:var(--text-muted)">${opsState.selected.size?opsState.selected.size+' POC selected':'Nothing selected yet'}</span>
    </div>`;
  }

  // The preview. Shown before anything is written, because importing sixty
  // clients to find out what they were is not a workable order of events.
  const pv=opsState.preview;
  if(opsState.previewing)h+=`<div style="padding:18px;text-align:center;color:var(--text-muted);font-size:12px">Working out what would be added…</div>`;
  else if(pv){
    h+=`<div class="alert" style="margin:0 0 10px;background:${pv.willAdd?'var(--green-bg)':'var(--bg-elevated)'};border:1px solid ${pv.willAdd?'var(--green-border)':'var(--border)'};color:${pv.willAdd?'var(--green)':'var(--text-muted)'};font-size:12px">
      ${pv.willAdd?('<b>'+pv.willAdd+'</b> client(s) will be added'):'Nothing new to add'} — ${pv.skippedTotal} skipped, ${pv.scanned} scanned in Ops-Mkt</div>`;
    if(pv.clients.length){
      h+=`<div style="max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px"><table style="font-size:11px"><thead><tr>
        <th style="padding:6px 8px;text-align:left">Client</th><th style="padding:6px 8px;text-align:left">Entity type</th><th style="padding:6px 8px;text-align:left">Nature</th><th style="padding:6px 8px;text-align:left">VAT</th><th style="padding:6px 8px;text-align:left">Assign to</th></tr></thead><tbody>`;
      pv.clients.forEach(c=>{
        h+=`<tr><td style="padding:5px 8px;font-weight:600">${esc(c.name)}</td>
          <td style="padding:5px 8px">${esc(c.entityType)}${c.entityTypeGuessed?' <span style="color:var(--amber)" title="Read off the company name — confirm against the trade licence">⚠</span>':''}</td>
          <td style="padding:5px 8px;color:var(--text-muted)">${esc(c.businessNature)}</td>
          <td style="padding:5px 8px">${esc(c.vatApplicable)}</td>
          <td style="padding:5px 8px">${c.assignedTeam==='Unassigned'?`<span style="color:var(--amber)">Unassigned${c.opsMktMember?' ('+esc(c.opsMktMember)+' in Ops-Mkt)':''}</span>`:esc(c.assignedTeam)}</td></tr>`;
      });
      h+=`</tbody></table></div>`;
      h+=`<div style="font-size:11px;color:var(--text-muted);line-height:1.5;margin-bottom:12px">⚠ marks an entity type read off the company name rather than a trade licence — open the client and confirm it. Anyone shown Unassigned is handled by someone in Ops-Mkt who is not a user of this tracker, so assign them here.</div>`;
    }
    if(pv.skipped.length){
      h+=`<details style="margin-bottom:12px"><summary style="cursor:pointer;font-size:12px;color:var(--text-muted)">Why ${pv.skippedTotal} were skipped</summary><div style="max-height:160px;overflow:auto;font-size:11px;padding:8px 0">`;
      pv.skipped.forEach(sk=>{h+=`<div style="padding:3px 0;border-bottom:1px solid var(--border)"><b>${esc(sk.name)}</b> — ${esc(sk.reason)}</div>`;});
      h+=`</div></details>`;
    }
  }

  h+=`<div style="display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--border)">
    <button class="btn" data-action="closeModal">Close</button>

  </div></div></div>`;
  return h;
}

function generateTemplateXLSX(){
  const wb=XLSX.utils.book_new();
  const wsData=[
    ["UAE Compliance Tracker — Client Import Template"],
    ["Fill details. * = required. VAT: Yes/No/Pending - Documents Awaited/Pending - Registration in Progress. CT: Yes/No. Dates: YYYY-MM-DD"],
    [],
    ["Client Name *","Entity Type *","Nature","Assigned Team Member","VAT Applicable","CT Applicable"],
    ["Al Noor Trading","Mainland — LLC","Trading","","Yes","Yes"],
    ["Gulf Star","Free Zone — FZE (single shareholder)","Service","","Pending - Documents Awaited","Yes"],
    ["Horizon","Free Zone — FZCO / FZC (two or more shareholders)","Trading & Service","","No","No"],
  ];
  // A second sheet listing every valid entity type with its guidance, so the
  // person filling the template has the same help the dropdown gives and does
  // not have to invent a label the import will then reject.
  const refData=[["Entity Type","Group","When to choose it"]].concat(
    ENTITY_TYPE_CATALOGUE.map(e=>[e.value,e.group,e.hint])
  ).concat([[],["Nature"],...BUSINESS_NATURES.map(n=>[n])]);
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols']=[{wch:36},{wch:46},{wch:18},{wch:26},{wch:34},{wch:18}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}}];
  XLSX.utils.book_append_sheet(wb,ws,"Client Import");
  const wsRef=XLSX.utils.aoa_to_sheet(refData);
  wsRef['!cols']=[{wch:46},{wch:40},{wch:110}];
  XLSX.utils.book_append_sheet(wb,wsRef,"Entity Types");
  XLSX.writeFile(wb,"client_import_template.xlsx");
}

function getFilteredClients(){
  let list=getVisibleClients().filter(c=>{
    if(state.search&&!c.name.toLowerCase().includes(state.search.toLowerCase()))return false;
    if(state.filterTeam!=="All"&&c.assignedTeam!==state.filterTeam)return false;
    if(state.filterStatus!=="All"&&metricsCache[c.id]?.overallStatus!==state.filterStatus)return false;
    if(state.filterReadiness&&state.filterReadiness!=="All"){
      const r=readinessFor(c.id);
      if(!r||r.state!==state.filterReadiness)return false;
    }
    if(state.filterClientTier&&state.filterClientTier!=="All"){
      if((tierFor(c.id)||'B')!==state.filterClientTier)return false;
    }
    return true;
  });
  if(state.sortByTier){
    list=list.slice().sort((a,b)=>tierOrder(tierFor(a.id))-tierOrder(tierFor(b.id)));
  }
  return list;
}
